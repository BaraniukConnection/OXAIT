function icon(name){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(ICONS[name]||ICONS.wallet)+'"/></svg>'}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)||s<'1900-01-01'||s>'2199-12-31')return false;const d=new Date(s+'T12:00:00');return !isNaN(d)&&localDate(d)===s}
function cents(v){const s=String(v).trim();if(!/^-?\d{1,10}(\.\d{1,2})?$/.test(s))throw Error('Enter an amount with no more than two decimal places.');const n=Math.round(Number(s)*100);if(!Number.isSafeInteger(n)||Math.abs(n)>MAX)throw Error('This amount is too large.');return n}
function decimal(n){return (n/100).toFixed(2)}
function blank(){return {version:1,currency:'EUR',theme:'light',accounts:[],transactions:[],goals:[],budgets:{},recurring:[]}}
function validate(s){
 if(!s||s.version!==1||!['EUR','USD','GBP','UAH','PLN'].includes(s.currency)||!['light','dark'].includes(s.theme))throw Error('This is not a supported Clarity backup.');
 for(const k of ['accounts','transactions','goals','recurring'])if(!Array.isArray(s[k])||s[k].length>100000)throw Error('Invalid backup records.');
 const text=(v,max=100)=>typeof v==='string'&&v.length<=max;const amt=(n,negative=false)=>Number.isSafeInteger(n)&&Math.abs(n)<=MAX&&(negative||n>=0);const ids=new Set();
 for(const list of [s.accounts,s.transactions,s.goals,s.recurring])for(const e of list){if(!e||!text(e.id)||!e.id||ids.has(e.id))throw Error('Invalid or duplicate record identifier.');ids.add(e.id)}
 const accountIds=new Set(s.accounts.map(a=>a.id));
 for(const a of s.accounts)if(!text(a.name)||!a.name.trim()||!['current','cash','savings','credit'].includes(a.type)||!amt(a.opening,true)||!/^#[0-9a-f]{6}$/i.test(a.color))throw Error('Invalid account.');
 const goalAccounts=new Set();for(const g of s.goals){if(!text(g.name)||!g.name.trim()||!amt(g.target)||g.target<=0||!accountIds.has(g.account)||s.accounts.find(a=>a.id===g.account).type!=='savings'||goalAccounts.has(g.account)||(g.due!==''&&!validDate(g.due))||!['target','plane','home','heart','gift','book'].includes(g.icon))throw Error('Invalid savings goal.');goalAccounts.add(g.account)}
 for(const t of s.transactions){if(!['expense','income','transfer'].includes(t.type)||!amt(t.amount)||t.amount<=0||!validDate(t.date)||!accountIds.has(t.account)||!text(t.note,300))throw Error('Invalid transaction.');if(t.type==='transfer'){if(!accountIds.has(t.to)||t.to===t.account)throw Error('Invalid transfer.')}else if(!CATS[t.type].includes(t.category))throw Error('Unknown category.');if(t.recurringId!==undefined&&(!text(t.recurringId)||!validDate(t.occurrence)))throw Error('Invalid recurring transaction.')}
 for(const r of s.recurring)if(!['expense','income'].includes(r.type)||!amt(r.amount)||r.amount<=0||!accountIds.has(r.account)||!CATS[r.type].includes(r.category)||!text(r.note,300)||!validDate(r.next)||!['weekly','monthly','yearly'].includes(r.frequency)||!Number.isInteger(r.anchorDay)||r.anchorDay<1||r.anchorDay>31||typeof r.paused!=='boolean')throw Error('Invalid recurring entry.');
 if(!s.budgets||typeof s.budgets!=='object'||Array.isArray(s.budgets))throw Error('Invalid budgets.');for(const [m,v]of Object.entries(s.budgets)){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)||!v||typeof v!=='object'||Array.isArray(v))throw Error('Invalid budget month.');for(const [cat,n]of Object.entries(v))if(!CATS.expense.includes(cat)||!amt(n))throw Error('Invalid budget category.')}
 return s;
}
let state=blank(),storageOK=true,loadError=false;
let storedRaw=null;try{storedRaw=localStorage.getItem(KEY)}catch(e){storageOK=false}if(storedRaw){try{state=validate(JSON.parse(storedRaw))}catch(e){loadError=true;storageOK=false}}

function money(n){return new Intl.NumberFormat('en-GB',{style:'currency',currency:state.currency,minimumFractionDigits:2,maximumFractionDigits:2}).format(n/100)}
function dayLabel(s){return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function monthLabel(m=month){return new Date(m+'-01T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function accountBalance(i,at=today(),exclude=''){let n=acc(i)?.opening||0;for(const t of state.transactions){if(t.id===exclude||t.date>at)continue;if(t.account===i)n+=t.type==='income'?t.amount:-t.amount;if(t.type==='transfer'&&t.to===i)n+=t.amount}return n}
function transactionsFor(m=month){return state.transactions.filter(t=>t.date.slice(0,7)===m&&t.date<=today())}
function totals(m=month){const ts=transactionsFor(m);return {income:ts.filter(t=>t.type==='income').reduce((n,t)=>n+t.amount,0),expense:ts.filter(t=>t.type==='expense').reduce((n,t)=>n+t.amount,0)}}
function net(){return state.accounts.reduce((n,a)=>n+accountBalance(a.id),0)}
function savings(){return state.accounts.filter(a=>a.type==='savings').reduce((n,a)=>n+accountBalance(a.id),0)}
function spent(cat){return transactionsFor().filter(t=>t.type==='expense'&&t.category===cat).reduce((n,t)=>n+t.amount,0)}
function commit(next,message='Saved'){validate(next);if(loadError)throw Error('Stored data could not be read. Export or reset it in Settings before making changes.');try{localStorage.setItem(KEY,JSON.stringify(next));storageOK=true}catch(e){storageOK=false}state=next;render();if(message)toast(storageOK?message:message+' · Export a backup; storage is unavailable.');}

function cashChart(){const d=new Date(month+'-01T12:00:00'),ms=[];for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push({m:localDate(x).slice(0,7),label:x.toLocaleDateString('en-GB',{month:'short'})})}const vals=ms.map(x=>totals(x.m)),max=Math.max(...vals.flatMap(x=>[x.income,x.expense]),1);return '<div class="chart" role="img" aria-label="Income and expenses for the last six months">'+ms.map((x,i)=>'<div class="barcol"><div class="bars"><div class="bar" style="height:'+Math.max(vals[i].income/max*100,1)+'%" title="'+x.label+' income: '+money(vals[i].income)+'"></div><div class="bar exp" style="height:'+Math.max(vals[i].expense/max*100,1)+'%" title="'+x.label+' expenses: '+money(vals[i].expense)+'"></div></div><div class="barlabel">'+x.label+'</div></div>').join('')+'</div><table class="sr"><caption>Monthly income and expense amounts</caption>'+ms.map((x,i)=>'<tr><th>'+x.m+'</th><td>'+money(vals[i].income)+'</td><td>'+money(vals[i].expense)+'</td></tr>').join('')+'</table>'}

function savingsPage(){return '<div class="row sectionhead"><p class="pageintro" style="margin:0">A dedicated savings account for each thing you’re working toward.</p>'+button('new-goal','New goal')+'</div><section class="glass hero"><div><p class="muted">Total set aside</p><div class="balance">'+money(savings())+'</div><p class="muted tiny">Already included in your total balance. Always yours.</p></div><div class="hero-meta"><span>Active goals<b>'+state.goals.length+'</b></span><span>Reached<b>'+state.goals.filter(g=>accountBalance(g.account)>=g.target).length+'</b></span></div></section>'+(state.goals.length?'<div class="goalgrid">'+state.goals.map(goalCard).join('')+'</div>':'<section class="glass">'+empty('Small steps. Bigger possibilities.','Set a target for a trip, a home, or a little peace of mind.','new-goal','Create a savings goal','target')+'</section>')+'<p class="notice">Adding funds moves money into a goal’s savings account. Withdrawals move it back. Neither counts as income or spending. Removing a goal keeps its account and transaction history.</p>'}
function budgets(){const bs=state.budgets[month]||{},sum=Object.values(bs).reduce((n,x)=>n+x,0),t=totals(),used=CATS.expense.filter(c=>bs[c]>0).reduce((n,c)=>n+spent(c),0);return '<div class="row sectionhead"><p class="pageintro" style="margin:0">Set a spending limit for each fixed category, one month at a time.</p>'+button('copy-budget','Copy previous month','refresh','','btn')+'</div><div class="metrics">'+metric('Planned',sum,'budgets','', 'blue',monthLabel())+metric('Spent in budgets',used,'down',used>sum?'negative':'','red','Only categories with a limit')+metric('Remaining',sum-used,'wallet',sum-used<0?'negative':'positive','','Of your planned budget')+'</div><div class="budgetgrid">'+CATS.expense.map((cat,i)=>{const n=spent(cat),limit=bs[cat]||0,pct=limit?Math.min(100,n/limit*100):0;return '<article class="glass budget '+(limit&&n>limit?'over':'')+'"><div class="row"><div class="accountname">'+icon(catIcon(cat,'expense'))+esc(cat)+'</div></div><div class="row"><span class="tiny muted">'+money(n)+' spent</span><label>Limit <input aria-label="'+esc(cat)+' monthly limit" inputmode="decimal" type="number" min="0" max="10000000000" step="0.01" placeholder="0.00" value="'+(limit?decimal(limit):'')+'" data-budget="'+esc(cat)+'"></label></div><div class="track"><span style="width:'+pct+'%"></span></div><div class="tiny '+(limit&&n>limit?'negative':'muted')+'">'+(limit?(n>limit?money(n-limit)+' over budget':money(limit-n)+' remaining'):'No limit set')+'</div></article>'}).join('')+'</div><p class="notice">Limits save when you leave the field. Set 0 or leave blank to remove a limit for this month. Transfers and savings contributions are excluded. Total spending this month: '+money(t.expense)+'.</p>'}
function recurringPage(){const due=state.recurring.filter(r=>!r.paused&&r.next<=today());return '<div class="row sectionhead"><p class="pageintro" style="margin:0">Repeat an income or expense weekly, monthly, or yearly.</p>'+button('new-recurring','New recurring')+'</div>'+(due.length?'<section class="glass welcome"><div><h2>'+due.length+' recurring '+(due.length===1?'entry':'entries')+' ready</h2><p class="muted tiny">Review and post due occurrences through today.</p></div>'+button('post-due','Review due entries','check','','btn primary')+'</section>':'')+'<section class="glass panel">'+(state.recurring.length?state.recurring.map(r=>'<div class="listrow"><div class="txdesc"><span class="txicon">'+icon(catIcon(r.category,r.type))+'</span><div><strong>'+esc(r.note||r.category)+'</strong><p>'+esc(r.category)+' · '+esc(acc(r.account)?.name)+' · '+r.frequency+'</p><p>'+(r.paused?'Paused':'Next: '+dayLabel(r.next))+'</p></div></div><div class="row"><span class="amount '+(r.type==='income'?'positive':'negative')+'">'+(r.type==='income'?'+':'−')+money(r.amount)+'</span><button class="more" data-action="edit-recurring" data-id="'+esc(r.id)+'" aria-label="Edit recurring entry">'+icon('edit')+'</button></div></div>').join(''):empty('Give the everyday a rhythm.','Keep rent, salary, and subscriptions easy to record.','new-recurring','Add recurring entry','recurring'))+'</section><p class="notice">Clarity never posts bills automatically. Open this page and review due entries to add them to your ledger. Monthly dates such as the 31st move to the last day of shorter months, then return to the original day.</p>'}
function settings(){return '<p class="pageintro">A personal space for your finances. Everything runs in this single file, without a connection to a bank.</p><div class="settingsgrid"><section class="glass panel"><h2>Preferences</h2><div class="settingrow"><div><strong>Currency</strong><p>One currency for all accounts. Changes labels; no conversion.</p></div><label><span class="sr">Currency</span><select id="currency">'+options(['EUR','USD','GBP','UAH','PLN'],state.currency)+'</select></label></div><div class="settingrow"><div><strong>Appearance</strong><p>Soft glass, in light or dark.</p></div>'+button('theme',state.theme==='light'?'Dark':'Light',state.theme==='light'?'moon':'sun')+'</div><div class="settingrow"><div><strong>Your records</strong><p>'+state.accounts.length+' accounts · '+state.transactions.length+' transactions</p></div></div><p class="notice">Balances include entries through today. Scheduled entries affect balances on their date. The month selector controls reports and budgets.</p></section><section class="glass panel"><h2>Your data</h2><div class="settingrow"><div><strong>Back up everything</strong><p>Accounts, goals, budgets, and your complete history.</p></div>'+button('backup','Export','download','','btn')+'</div><div class="settingrow"><div><strong>Restore a backup</strong><p>Import a Clarity JSON backup. Replaces current data.</p></div>'+button('import','Import','upload')+'</div><div class="settingrow"><div><strong>Spreadsheet export</strong><p>All transactions, readable in your spreadsheet app.</p></div>'+button('csv-all','CSV','download')+'</div>'+(loadError?'<div class="settingrow"><div><strong>Unreadable saved data</strong><p>Download the original stored text for recovery.</p></div>'+button('raw-backup','Recover','download')+'</div>':'')+'<div class="settingrow"><div><strong>Start fresh</strong><p>Clear all finance records on this device.</p></div>'+button('reset','Reset','refresh','','btn danger')+'</div></section><section class="glass panel"><h2>Predetermined categories</h2><p class="notice">A consistent set for every account. Categories cannot be added or removed.</p><p class="tiny muted">EXPENSES</p><div class="allcategories">'+CATS.expense.map(c=>'<span class="tag">'+esc(c)+'</span>').join('')+'</div><p class="tiny muted">INCOME</p><div class="allcategories">'+CATS.income.map(c=>'<span class="tag">'+esc(c)+'</span>').join('')+'</div></section><section class="glass panel"><h2>A little peace of mind</h2><p class="notice">Your records are saved in this browser on this device. The file works offline and makes no network requests. Browser data is not encrypted; anyone with access to this browser profile may be able to view it.</p><p class="notice">Export backups regularly, especially before changing browsers, moving this file, or clearing browser data. A downloaded HTML file does not contain your financial records; use a JSON backup to move them.</p>'+(state.accounts.length?'':'<div class="settingrow"><div><strong>Take a look around</strong><p>Try a sample month of fictional finances.</p></div>'+button('demo','Load demo','play')+'</div>')+'</section></div>'}
function showModal(title,html,context=null){modalContext=context;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;hydrate();if(!$('#modal').open)$('#modal').showModal();const first=$('#modalBody input:not([type=hidden]), #modalBody select');if(first)first.focus()}
function closeModal(){$('#modal').close();modalContext=null}
function field(label,input){return '<div class="field"><label class="label">'+label+input+'</label></div>'}
function inputField(label,name,value='',extra=''){return field(label,'<input name="'+name+'" value="'+esc(value)+'" '+extra+'>')}
function selectField(label,name,opts){return field(label,'<select name="'+name+'">'+opts+'</select>')}
function formFooter(deleteAction='',recordId='',label='Save'){return '<p class="error" id="formError" role="alert"></p><div class="modalfoot">'+(deleteAction?button(deleteAction,'Delete','close','data-id="'+esc(recordId)+'"','btn danger small'):'<span></span>')+'<div class="row">'+button('close','Cancel','close','','btn')+'<button type="submit" class="btn primary">'+icon('check')+label+'</button></div></div>'}
function transactionModal(type='expense',record=null,goal=null,direction=null,rec=false,seed=null){
 if(!state.accounts.length){toast('Add an account first.');accountModal();return}if(type==='transfer'&&state.accounts.length<2){toast('Add a second account to make a transfer.');return}
 const t=record||seed||{type,amount:'',date:today(),account:state.accounts.find(a=>a.type!=='savings')?.id||state.accounts[0].id,to:state.accounts[1]?.id||'',category:CATS[type]?.[0]||'',note:''};type=t.type;
 const recurringMode=rec;let source=t.account,to=t.to;if(goal){source=direction==='fund'?state.accounts.find(a=>a.id!==goal.account&&a.type!=='savings')?.id||state.accounts.find(a=>a.id!==goal.account)?.id:goal.account;to=direction==='fund'?goal.account:state.accounts.find(a=>a.id!==goal.account&&a.type!=='savings')?.id||state.accounts.find(a=>a.id!==goal.account)?.id;if(!source||!to){toast('Add another account to move money into or out of this goal.');return}}
 const ctx={kind:recurringMode?'recurring':'transaction',id:record?.id||null,type,goal:goal?.id,direction,record};
 const segment=!goal?'<div class="segment" aria-label="Entry type">'+(recurringMode?['expense','income']:['expense','income','transfer']).map(k=>'<button type="button" data-action="tx-type" data-type="'+k+'" class="'+(k===type?'selected':'')+'">'+({expense:'Expense',income:'Income',transfer:'Transfer'}[k])+'</button>').join('')+'</div>':'';
 let html='<form id="entryForm">'+segment+inputField('Amount · '+state.currency,'amount',t.amount!==''?decimal(t.amount):'','type="number" min="0.01" max="10000000000" step="0.01" inputmode="decimal" required placeholder="0.00"')+'<div class="fieldgrid">'+selectField(type==='transfer'?'From account':'Account','account',accountOptions(source))+(type==='transfer'?selectField('To account','to',accountOptions(to)):selectField('Category','category',options(CATS[type],t.category)))+'</div>'+inputField(recurringMode?'Next due date':'Date','date',recurringMode?(record?.next||seed?.next||today()):t.date,'type="date" min="1900-01-01" max="2199-12-31" required')+inputField('Description (optional)','note',t.note,'maxlength="300" placeholder="What was it for?"');
 if(recurringMode)html+=selectField('Repeat','frequency',options(['weekly','monthly','yearly'],record?.frequency||seed?.frequency||'monthly'))+'<label class="formcheck"><input type="checkbox" name="paused" '+((record?.paused||seed?.paused)?'checked':'')+'>Pause this recurring entry</label><p class="notice">Due entries are posted only after you review them in Recurring.</p>';
 else if(!record&&type!=='transfer')html+='<label class="formcheck"><input type="checkbox" name="repeat" id="repeatCheck">Repeat this entry</label><div id="repeatFields" hidden>'+selectField('Repeat','frequency',options(['weekly','monthly','yearly'],'monthly'))+'</div>';
 if(goal)html+='<p class="notice">This transfer changes your goal’s balance, with no income or expense recorded.</p>';
 html+=formFooter(record?(recurringMode?'delete-recurring':'delete-tx'):'',record?.id||'',recurringMode?'Save recurring':'Save entry')+'</form>';
 showModal(goal?(direction==='fund'?'Add funds to ':'Withdraw from ')+goal.name:record?(recurringMode?'Edit recurring entry':'Edit entry'):recurringMode?'New recurring entry':'New entry',html,ctx);
}
function accountModal(a=null){const tied=a&&state.goals.some(g=>g.account===a.id);showModal(a?'Edit account':'New account','<form id="accountForm">'+inputField('Account name','name',a?.name||'','required maxlength="100" placeholder="e.g. Everyday account"')+'<div class="fieldgrid">'+selectField('Account type','type',options([{value:'current',label:'Current account'},{value:'cash',label:'Cash'},{value:'savings',label:'Savings'},{value:'credit',label:'Credit account'}],a?.type||'current'))+inputField('Card colour','color',a?.color||'#78bca9','type="color"')+'</div>'+inputField('Opening balance · '+state.currency,'opening',decimal(a?.opening||0),'type="number" min="-10000000000" max="10000000000" step="0.01" inputmode="decimal" required')+'<p class="notice">'+(tied?'This account belongs to a savings goal and must stay a savings account. ':'')+'The opening balance is before all recorded entries. Use a negative balance for credit debt. Editing it adjusts the current balance.</p>'+formFooter(a?'delete-account':'',a?.id||'')+'</form>',{kind:'account',id:a?.id||null})}
function goalModal(g=null){showModal(g?'Edit savings goal':'New savings goal','<form id="goalForm">'+inputField('Goal name','name',g?.name||'','required maxlength="100" placeholder="e.g. A little peace of mind"')+inputField('Target · '+state.currency,'target',g?decimal(g.target):'','type="number" min="0.01" max="10000000000" step="0.01" inputmode="decimal" required placeholder="5000.00"')+'<div class="fieldgrid">'+inputField('Target date (optional)','due',g?.due||'','type="date" min="1900-01-01" max="2199-12-31"')+selectField('Symbol','icon',options([{value:'target',label:'Goal'},{value:'plane',label:'Travel'},{value:'home',label:'Home'},{value:'heart',label:'Wellbeing'},{value:'gift',label:'Gift'},{value:'book',label:'Education'}],g?.icon||'target'))+'</div><p class="notice">'+(g?'Your dedicated savings account stays connected to this goal.':'We’ll create a dedicated savings account starting at zero. Add money using “Add funds”.')+'</p>'+formFooter(g?'delete-goal':'',g?.id||'')+'</form>',{kind:'goal',id:g?.id||null})}
function confirmModal(title,desc,callback,label='Confirm',danger=false){showModal(title,'<p class="confirmtext">'+esc(desc)+'</p><p class="error" id="formError" role="alert"></p><div class="modalfoot">'+button('close','Cancel','close')+'<button class="btn '+(danger?'danger':'primary')+'" data-action="confirm">'+esc(label)+'</button></div>',{kind:'confirm',callback})}
function nextOccurrence(r){const d=new Date(r.next+'T12:00:00');if(r.frequency==='weekly'){d.setDate(d.getDate()+7);return localDate(d)}const year=d.getFullYear()+(r.frequency==='yearly'?1:0),monthIndex=d.getMonth()+(r.frequency==='monthly'?1:0);const end=new Date(year,monthIndex+1,0).getDate();return localDate(new Date(year,monthIndex,Math.min(r.anchorDay,end)))}
function dueOccurrences(){const out=[];for(const source of state.recurring){if(source.paused)continue;let r={...source};while(r.next<=today()){if(out.length>=1000)throw Error('More than 1,000 occurrences are due. Adjust old next-due dates before posting.');if(!state.transactions.some(t=>t.recurringId===r.id&&t.occurrence===r.next))out.push({...r,date:r.next});r.next=nextOccurrence(r)}}return out}
function reviewDue(){const items=dueOccurrences();if(!items.length){toast('No unposted occurrences are due.');return}const incoming=items.filter(r=>r.type==='income').reduce((n,r)=>n+r.amount,0),outgoing=items.filter(r=>r.type==='expense').reduce((n,r)=>n+r.amount,0);showModal('Review due entries','<p class="confirmtext">Post '+items.length+' occurrences through '+dayLabel(today())+'?</p><div class="summaryline"><div class="tiny muted">Income<b class="positive">'+money(incoming)+'</b></div><div class="tiny muted">Expenses<b class="negative">'+money(outgoing)+'</b></div></div><div style="max-height:260px;overflow:auto">'+items.map(r=>'<div class="listrow"><div><strong>'+esc(r.note||r.category)+'</strong><p>'+dayLabel(r.date)+' · '+esc(acc(r.account)?.name)+'</p></div><span class="amount '+(r.type==='income'?'positive':'negative')+'">'+(r.type==='income'?'+':'−')+money(r.amount)+'</span></div>').join('')+'</div><p class="error" id="formError"></p><div class="modalfoot">'+button('close','Cancel','close')+'<button class="btn primary" data-action="confirm">Post entries</button></div>',{kind:'confirm',callback:()=>{const s=draft();for(const r of items)s.transactions.push({id:id(),type:r.type,amount:r.amount,date:r.date,account:r.account,category:r.category,note:r.note,recurringId:r.id,occurrence:r.date});for(const r of s.recurring)if(!r.paused)while(r.next<=today())r.next=nextOccurrence(r);commit(s,'Recurring entries posted');closeModal()}})}
function submitEntry(form){const f=new FormData(form),ctx=modalContext,s=draft(),n=cents(f.get('amount'));if(n<=0)throw Error('Amount must be greater than zero.');const date=f.get('date');if(!validDate(date))throw Error('Choose a valid date.');const account=f.get('account'),to=f.get('to'),type=ctx.type;if(!acc(account))throw Error('Choose an account.');if(type==='transfer'){if(account===to)throw Error('Choose two different accounts.');if(!acc(to))throw Error('Choose a destination account.');if(ctx.goal){const g=state.goals.find(g=>g.id===ctx.goal);if(ctx.direction==='fund'&&to!==g.account||ctx.direction==='withdraw'&&account!==g.account)throw Error('Keep the goal’s savings account selected.')}if(n>accountBalance(account,date,ctx.id||''))throw Error('The source account does not have enough money on that date.');}
 const note=String(f.get('note')||'').trim(),category=f.get('category')||'';
 if(ctx.kind==='recurring'){const prior=ctx.record;const r={id:ctx.id||id(),type,amount:n,account,category,note,next:date,frequency:f.get('frequency'),anchorDay:prior&&prior.next===date&&prior.frequency===f.get('frequency')?prior.anchorDay:Number(date.slice(8)),paused:f.has('paused')};const index=s.recurring.findIndex(x=>x.id===r.id);if(index>=0)s.recurring[index]=r;else s.recurring.push(r);commit(s,'Recurring entry saved');}
 else {const t={id:ctx.id||id(),type,amount:n,date,account,note};if(type==='transfer')t.to=to;else t.category=category;if(ctx.record?.recurringId){t.recurringId=ctx.record.recurringId;t.occurrence=ctx.record.occurrence}const index=s.transactions.findIndex(x=>x.id===t.id);if(index>=0)s.transactions[index]=t;else s.transactions.push(t);if(f.has('repeat')&&type!=='transfer'){const r={id:id(),type,amount:n,account,category,note,next:date,frequency:f.get('frequency'),anchorDay:Number(date.slice(8)),paused:false};if(date<=today()){t.recurringId=r.id;t.occurrence=date;r.next=nextOccurrence(r)}else{s.transactions=s.transactions.filter(x=>x.id!==t.id)}s.recurring.push(r)}commit(s,date>today()?'Scheduled entry saved':'Entry saved');}closeModal();}
function submitAccount(form){const f=new FormData(form),s=draft(),a={id:modalContext.id||id(),name:String(f.get('name')).trim(),type:f.get('type'),opening:cents(f.get('opening')),color:f.get('color')};if(!a.name)throw Error('Give your account a name.');if(s.goals.some(g=>g.account===a.id)&&a.type!=='savings')throw Error('A goal account must keep the savings type.');const i=s.accounts.findIndex(x=>x.id===a.id);if(i<0)s.accounts.push(a);else s.accounts[i]=a;commit(s,'Account saved');closeModal()}
function submitGoal(form){const f=new FormData(form),s=draft(),name=String(f.get('name')).trim(),target=cents(f.get('target')),due=f.get('due')||'',symbol=f.get('icon');if(!name)throw Error('Give your goal a name.');if(target<=0)throw Error('Set a target greater than zero.');if(due&&!validDate(due))throw Error('Choose a valid target date.');const existing=s.goals.find(g=>g.id===modalContext.id);if(existing){Object.assign(existing,{name,target,due,icon:symbol});s.accounts.find(a=>a.id===existing.account).name=name}else{const account=id();s.accounts.push({id:account,name,type:'savings',opening:0,color:'#8ac8b5'});s.goals.push({id:id(),name,target,due,icon:symbol,account})}commit(s,'Goal saved');closeModal()}
function download(name,type,text){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function backup(){download('clarity-backup-'+today()+'.json','application/json',JSON.stringify(state,null,2));toast('Backup exported')}
function csv(all=false){const ts=all?[...state.transactions].sort(sortTx):filtered();const rows=[['Date','Type','Category','Description','From / Account','To','Amount','Currency','Status'],...ts.map(t=>[t.date,t.type,t.category||'Transfer',t.note,acc(t.account)?.name||'',t.to?acc(t.to)?.name:'',decimal(t.type==='expense'?-t.amount:t.amount),state.currency,t.date>today()?'Scheduled':'Recorded'])];const safe=(v,numeric=false)=>{const str=String(v??'');return '"'+(!numeric&&(/^[\t\r\n]/.test(str)||/^\s*[=+\-@]/.test(str))?"'":'')+str.replace(/"/g,'""')+'"'};download('clarity-transactions-'+(all?'all':month)+'.csv','text/csv;charset=utf-8','\uFEFF'+rows.map(row=>row.map((v,i)=>safe(v,i===6)).join(',')).join('\r\n'));toast('CSV exported')}
function demo(){if(state.accounts.length||state.transactions.length){toast('Demo is available only when your accounts are empty.');return}const s=blank();s.theme=state.theme;s.currency=state.currency;const a=id(),b=id(),c=id(),g=id();s.accounts=[{id:a,name:'Everyday account',type:'current',opening:410000,color:'#8facdf'},{id:b,name:'Cash',type:'cash',opening:18000,color:'#d3b094'},{id:c,name:'A little peace of mind',type:'savings',opening:225000,color:'#80c9b0'}];s.goals=[{id:g,account:c,name:'A little peace of mind',target:600000,due:localDate(new Date(new Date().getFullYear()+1,0,1)),icon:'heart'}];const d=new Date();for(let i=5;i>=0;i--){const mo=new Date(d.getFullYear(),d.getMonth()-i,1),date=(day)=>localDate(new Date(mo.getFullYear(),mo.getMonth(),Math.min(day,d.getDate())));const add=(type,amount,category,note,day)=>s.transactions.push({id:id(),type,amount,date:date(day),account:a,category,note});add('income',320000+i*6500,'Salary','Monthly salary',1);add('expense',98000,'Home & utilities','Home sweet home',2);add('expense',28600+i*1700,'Food & groceries','Groceries',3);add('expense',14700+i*1000,'Dining & coffee','Coffee & good company',4);add('expense',6900,'Transport','City travel',5);add('expense',18900+i*1300,'Shopping','A few essentials',6);add('expense',2900,'Subscriptions','Music & streaming',7);s.transactions.push({id:id(),type:'transfer',amount:25000,date:date(8),account:a,to:c,note:'A little more peace of mind'})}s.budgets[month]={'Home & utilities':105000,'Food & groceries':40000,'Dining & coffee':22000,'Transport':12000,'Shopping':25000,'Subscriptions':5000};s.recurring=[{id:id(),type:'expense',amount:98000,account:a,category:'Home & utilities',note:'Monthly rent',next:localDate(new Date(d.getFullYear(),d.getMonth()+1,2)),frequency:'monthly',anchorDay:2,paused:false}];commit(s,'Fictional demo loaded')}
async function importFile(file){if(file.size>15000000){toast('Backup is too large (15 MB maximum).');return}try{const s=validate(JSON.parse(await file.text()));confirmModal('Restore this backup?',s.accounts.length+' accounts and '+s.transactions.length+' transactions will replace your current records. Export your current backup first if you want to keep it.',()=>{loadError=false;commit(s,'Backup restored');filters={q:'',type:'all',account:'all',category:'all'};closeModal();render()},'Restore backup')}catch(e){toast('Could not import: '+e.message)}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-page]');if(!el)return;if(el.dataset.page){page=el.dataset.page;render();return}const action=el.dataset.action,recordId=el.dataset.id;try{switch(action){
 case 'close':closeModal();break;case 'new-tx':case 'expense':transactionModal('expense');break;case 'income':transactionModal('income');break;case 'transfer':transactionModal('transfer');break;
 case 'edit-tx':{const t=state.transactions.find(x=>x.id===recordId);if(t)transactionModal(t.type,t);break}
 case 'tx-type':{const c=modalContext,f=new FormData($('#entryForm')),type=el.dataset.type,raw=f.get('amount'),seed={...(c?.record||{}),type,amount:raw?cents(raw):'',date:f.get('date'),next:f.get('date'),account:f.get('account'),to:f.get('to')||state.accounts.find(a=>a.id!==f.get('account'))?.id||'',note:f.get('note'),category:CATS[type]?.includes(f.get('category'))?f.get('category'):CATS[type]?.[0]||'',frequency:f.get('frequency')||'monthly',paused:f.has('paused')};if(type==='transfer'&&state.accounts.length<2){toast('Add a second account to make a transfer.');break}transactionModal(type,c?.id?seed:null,null,null,c?.kind==='recurring',seed);break}

 case 'new-account':accountModal();break;case 'edit-account':accountModal(acc(recordId));break;case 'new-goal':goalModal();break;case 'edit-goal':goalModal(state.goals.find(x=>x.id===recordId));break;
 case 'fund-goal':transactionModal('transfer',null,state.goals.find(x=>x.id===recordId),'fund');break;case 'withdraw-goal':transactionModal('transfer',null,state.goals.find(x=>x.id===recordId),'withdraw');break;
 case 'new-recurring':transactionModal('expense',null,null,null,true);break;case 'edit-recurring':{const r=state.recurring.find(x=>x.id===recordId);transactionModal(r.type,r,null,null,true);break}
 case 'delete-tx':confirmModal('Delete this entry?','Account balances and reports will be recalculated. Deleting a posted recurring entry does not automatically post it again.',()=>{const s=draft();s.transactions=s.transactions.filter(t=>t.id!==recordId);commit(s,'Entry deleted');closeModal()},'Delete entry',true);break;
 case 'delete-account':if(state.transactions.some(t=>t.account===recordId||t.to===recordId)||state.goals.some(g=>g.account===recordId)||state.recurring.some(r=>r.account===recordId))throw Error('This account is linked to entries, a goal, or recurring records. Remove those links before deleting it.');confirmModal('Delete account?','Its opening balance will be removed from your total balance.',()=>{const s=draft();s.accounts=s.accounts.filter(a=>a.id!==recordId);commit(s,'Account deleted');closeModal()},'Delete account',true);break;
 case 'delete-goal':confirmModal('Remove this goal?','The savings account, balance, and transaction history will remain in Accounts.',()=>{const s=draft();s.goals=s.goals.filter(g=>g.id!==recordId);commit(s,'Goal removed; savings account kept');closeModal()},'Remove goal',true);break;
 case 'delete-recurring':confirmModal('Delete recurring entry?','Previously recorded transactions will stay in your history. No further occurrences will be due.',()=>{const s=draft();s.recurring=s.recurring.filter(r=>r.id!==recordId);commit(s,'Recurring entry deleted');closeModal()},'Delete recurring',true);break;
 case 'post-due':reviewDue();break;case 'confirm':modalContext?.callback?.();break;case 'backup':backup();break;case 'csv':csv();break;case 'csv-all':csv(true);break;case 'import':$('#importFile').click();break;
 case 'theme':{const s=draft();s.theme=s.theme==='light'?'dark':'light';commit(s,'');break}
 case 'copy-budget':{const d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()-1);const previous=localDate(d).slice(0,7),bs=state.budgets[previous];if(!bs||!Object.values(bs).some(n=>n>0)){toast('No budgets set for '+monthLabel(previous));break}confirmModal('Copy last month’s budgets?','This will replace the category limits for '+monthLabel()+'.',()=>{const s=draft();s.budgets[month]={...bs};commit(s,'Budgets copied');closeModal()},'Copy limits');break}
 case 'more-tx':txLimit+=50;refreshTx();break;case 'demo':demo();break;
 case 'reset':confirmModal('Start fresh?','All accounts, transactions, savings goals, budgets, and recurring entries will be cleared. Export a backup first to keep your records.',()=>{loadError=false;const s=blank();s.theme=state.theme;s.currency=state.currency;commit(s,'All records cleared');filters={q:'',type:'all',account:'all',category:'all'};page='overview';closeModal();render()},'Clear all records',true);break;
 case 'raw-backup':{const raw=localStorage.getItem(KEY);download('clarity-recovery-'+today()+'.txt','text/plain',raw||'');break}
}}catch(error){const field=$('#formError');if($('#modal').open&&field)field.textContent=error.message;else toast(error.message)}});
document.addEventListener('submit',e=>{e.preventDefault();try{if(e.target.id==='entryForm')submitEntry(e.target);else if(e.target.id==='accountForm')submitAccount(e.target);else if(e.target.id==='goalForm')submitGoal(e.target)}catch(error){$('#formError').textContent=error.message}});
document.addEventListener('change',e=>{const el=e.target;try{if(el.id==='month'){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(el.value))return;month=el.value;txLimit=50;render()}else if(el.id==='typeFilter'){filters.type=el.value;txLimit=50;refreshTx()}else if(el.id==='accountFilter'){filters.account=el.value;txLimit=50;refreshTx()}else if(el.id==='categoryFilter'){filters.category=el.value;txLimit=50;refreshTx()}else if(el.id==='repeatCheck')$('#repeatFields').hidden=!el.checked;else if(el.id==='currency'){const s=draft();s.currency=el.value;commit(s,'Currency label updated')}else if(el.hasAttribute('data-budget')){const n=el.value===''?0:cents(el.value);if(n<0)throw Error('A budget limit cannot be negative.');const s=draft();s.budgets[month]||={};s.budgets[month][el.dataset.budget]=n;commit(s,'Budget saved')}else if(el.id==='importFile'&&el.files[0]){importFile(el.files[0]);el.value=''}}catch(error){toast(error.message);if(el.hasAttribute('data-budget'))el.value=decimal(state.budgets[month]?.[el.dataset.budget]||0)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.q=e.target.value;txLimit=50;refreshTx()}});
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('#modal').open&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();transactionModal('expense')}});
$('#modal').addEventListener('cancel',()=>{modalContext=null});
window.addEventListener('storage',e=>{if(e.key===KEY){if($('#modal').open){toast('Data changed in another tab. Close this dialog and reload before saving.');loadError=true;return}try{state=e.newValue?validate(JSON.parse(e.newValue)):blank();loadError=false;storageOK=true;render();toast('Updated from another tab')}catch(error){toast('Could not read the update from another tab.')}}});
let currentDay=today();setInterval(()=>{if(today()!==currentDay){currentDay=today();render()}},60000);
render();
</script>
</body>
