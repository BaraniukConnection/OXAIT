<!doctype html>
<html lang="en">
<head>
<script src="../../../../../../assets/js/pybridge.js" data-server="../server.py"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Simulator</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-left">
    <div class="hud-stat"><span>Balance</span><b id="hudBalance">$0.00</b></div>
    <div class="hud-stat"><span>Inventory</span><b id="hudInv">$0.00</b><small id="hudInvCount">0 skins</small></div>
    <div class="hud-stat"><span>Cases</span><b id="hudCases">0</b></div>
  </div>
  <div class="hud-right">
    <button id="btnMute" title="Mute (M)">🔊</button>
    <button id="btnHelp" title="Controls">?</button>
  </div>
  <div class="hud-nav">
    <button data-view="left">◀ My Cases <kbd>A</kbd></button>
    <button data-view="front">Hall of Drops <kbd>W</kbd></button>
    <button data-view="right">PC / Market <kbd>D</kbd> ▶</button>
  </div>
</div>

<div id="tooltip" class="hidden"></div>
<div id="toasts"></div>

<!-- Monitor app (positioned over the 3D screen) -->
<div id="monitorUI" class="hidden">
  <div class="os">
    <header class="os-bar">
      <div class="os-logo">ARMS<span>//</span>NET</div>
      <nav class="os-tabs">
        <button data-tab="shop" class="active">Case Shop</button>
        <button data-tab="market">Skin Market</button>
        <button data-tab="inventory">Inventory</button>
        <button data-tab="stats">Stats</button>
      </nav>
      <div class="os-balance">Balance <b id="osBalance">$0</b></div>
      <button class="os-close" id="monitorClose" title="Leave PC (Esc)">✕</button>
    </header>
    <div class="os-body">
      <section data-panel="shop" class="panel active"></section>
      <section data-panel="market" class="panel"></section>
      <section data-panel="inventory" class="panel"></section>
      <section data-panel="stats" class="panel"></section>
    </div>
    <footer class="os-ticker"><div id="ticker"></div></footer>
  </div>
  <div id="modal" class="hidden"></div>
</div>

<!-- Case opening reel -->
<div id="reel" class="hidden">
  <div class="reel-title" id="reelTitle"></div>
  <div class="reel-window">
    <div class="reel-strip" id="reelStrip"></div>
    <div class="reel-marker"></div>
  </div>
</div>

<!-- Reveal card -->
<div id="reveal" class="hidden"></div>

<!-- Intro / loading -->
<div id="intro">
  <div class="intro-card">
    <h1>CASE<span>SIM</span></h1>
    <p class="sub">Old storage. A PC with a market. A rack full of cases.</p>
    <div class="controls">
      <div><kbd>Drag</kbd> look around</div>
      <div><kbd>A</kbd>/<kbd>D</kbd> turn to cases / PC</div>
      <div><kbd>W</kbd> hall of drops</div>
      <div><kbd>Click</kbd> monitor or case</div>
      <div><kbd>Esc</kbd> back</div>
      <div><kbd>M</kbd> mute</div>
    </div>
    <button id="enterBtn" disabled>Loading…</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
