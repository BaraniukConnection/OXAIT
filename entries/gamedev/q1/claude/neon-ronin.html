const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=Math.random;
const rnd=(a,b)=>a+R()*(b-a), rint=(a,b)=>Math.floor(a+R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const rr=(a,b)=>a+Math.random()*(b-a), rpick=a=>a[Math.floor(Math.random()*a.length)];
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
const hexA=(h,a)=>{const[r,g,b]=hexRGB(h);return`rgba(${r},${g},${b},${a})`;};
const darken=(h,f)=>{const[r,g,b]=hexRGB(h);return`rgb(${r*f|0},${g*f|0},${b*f|0})`;};
const fmtT=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

const AU={ctx:null,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}
    try{
      const a=new(window.AudioContext||window.webkitAudioContext)();this.ctx=a;
      this.out=a.createGain();this.out.connect(a.destination);
      this.mus=a.createGain();this.sfx=a.createGain();this.mus.connect(this.out);this.sfx.connect(this.out);
      this.dIn=a.createGain();this.dIn.gain.value=.45;const d=a.createDelay(1);d.delayTime.value=.32;const fb=a.createGain();fb.gain.value=.33;
      this.dIn.connect(d);d.connect(fb);fb.connect(d);d.connect(this.mus);
      const len=a.sampleRate;const b=a.createBuffer(1,len,a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;this.noise=b;
      this.apply();
    }catch(e){this.ctx=null;}
  },
  apply(){if(!this.ctx)return;this.mus.gain.value=save.muted?0:save.music*.55;this.sfx.gain.value=save.muted?0:save.sfx*.7;}
};
function tone(f0,f1,dur,type,vol,delay=0){const a=AU.ctx;if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AU.sfx);o.start(t);o.stop(t+dur+.02);}
function nz(dur,vol,ft,f0,f1,delay=0,q=1){const a=AU.ctx;if(!a)return;const t=a.currentTime+delay;const s=a.createBufferSource();s.buffer=AU.noise;const f=a.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AU.sfx);s.start(t,Math.random()*.5);s.stop(t+dur+.02);}
const SFX={
  jump:()=>tone(260,520,.12,'square',.1),
  slash:()=>{nz(.14,.35,'bandpass',4200,700);tone(1200,300,.07,'triangle',.1);},
  hit:()=>{tone(200,50,.12,'square',.22);nz(.08,.3,'lowpass',2000,300);},
  kill:()=>{tone(500,40,.35,'sawtooth',.16);nz(.3,.3,'lowpass',1500,100);},
  hurt:()=>{tone(240,70,.28,'sawtooth',.25);nz(.15,.25,'lowpass',1200,200);},
  dash:()=>nz(.2,.3,'bandpass',400,3500,0,.8),
  roll:()=>nz(.22,.22,'lowpass',600,150),
  land:()=>nz(.07,.16,'lowpass',400,100),
  alert:()=>{tone(880,880,.05,'square',.07);tone(1320,1320,.08,'square',.07,.06);},
  swing:()=>nz(.16,.2,'bandpass',900,2200),
  pickup:()=>{[660,880,1320].forEach((f,i)=>tone(f,f,.08,'square',.1,i*.06));},
  select:()=>tone(660,990,.07,'square',.1),
  move:()=>tone(440,440,.035,'square',.06),
  slam:()=>{tone(110,28,.6,'sine',.7);nz(.5,.45,'lowpass',900,60);},
  boom:()=>{nz(.7,.5,'lowpass',1200,50);tone(80,25,.6,'sine',.5);},
  check:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,f,.12,'triangle',.12,i*.07));},
  clear:()=>{[392,523,659,784,1046].forEach((f,i)=>tone(f,f,.18,'square',.09,i*.09));},
  die:()=>{tone(400,30,1.1,'sawtooth',.25);nz(.8,.3,'lowpass',2000,80);},
  roar:()=>{tone(70,40,1,'sawtooth',.35);nz(1,.3,'bandpass',300,120);}
};
function sfx(n){if(AU.ctx&&SFX[n])try{SFX[n]();}catch(e){}}

const mtof=m=>440*Math.pow(2,(m-69)/12);
function mNote(t,m,dur,type,vol,cut,send){const a=AU.ctx,o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type=type;o.frequency.value=mtof(m);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f);f.connect(g);g.connect(AU.mus);if(send)g.connect(AU.dIn);o.start(t);o.stop(t+dur+.05);}
function mPad(t,m,dur){const a=AU.ctx;[-7,7].forEach(dt=>{const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=dt;f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.02,t+.5);g.gain.linearRampToValueAtTime(.0001,t+dur);o.connect(f);f.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+dur+.05);});}
function mKick(t){const a=AU.ctx,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+.3);}
function mNoise(t,dur,vol,ft,fr){const a=AU.ctx,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=AU.noise;f.type=ft;f.frequency.value=fr;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AU.mus);s.start(t,Math.random()*.5);s.stop(t+dur+.02);}
const music={name:null,song:null,step:0,nextT:0,
  play(n){if(this.name===n)return;this.name=n;this.song=SONGS[n];this.step=0;this.nextT=0;},
  stop(){this.name=null;this.song=null;},
  tick(){const a=AU.ctx;if(!a||!this.song||a.state!=='running')return;
    if(this.nextT<a.currentTime)this.nextT=a.currentTime+.05;
    const S=this.song,spb=60/S.bpm/4;
    while(this.nextT<a.currentTime+.15){this.playStep(this.step,this.nextT,spb);this.nextT+=spb;this.step++;}
  },
  playStep(s,t,spb){const S=this.song,st=s%16,bar=Math.floor(s/16)%S.prog.length,[cr,q]=S.prog[bar];
    try{
      if(S.kick[st]==='x')mKick(t);
      if(S.snare[st]==='x'){mNoise(t,.16,.32,'bandpass',1700);}
      if(S.hat[st]==='x')mNoise(t,.04,.12,'highpass',7500);
      const b=S.bass[st];if(b!=='.')mNote(t,S.root+cr+(b==='o'?12:0),spb*1.6,'sawtooth',.2,700);
      const ar=S.arp[st];if(ar!=='.'){const tn=[0,q,7,12,12+q];mNote(t,S.root+24+cr+tn[+ar],spb*1.3,'square',.06,2600,true);}
      if(S.pad&&st===0)[0,q,7].forEach(iv=>mPad(t,S.root+12+cr+iv,spb*16));
    }catch(e){}
  }
};

const THEMES=[

// ================= LEVEL GENERATION =================
function genLevel(n){
  const d=LEVELS[n];R=mulberry32(d.seed);
  const L={n,d,th:THEMES[n-1],plats:[],enemies:[],decos:[],signs:[],fires:[],vents:[],pickups:[],cps:[],hints:[],waves:[],exit:null,boss:null,arena:null,width:0,time:0,kills:0,dmg:0,banner:null,toast:null,cpIndex:-1};
  const ground=(x,w,y)=>{const p={x,y,w,h:H+80-y,one:false};L.plats.push(p);return p;};
  const flt=(x,y,w)=>{const p={x,y,w,h:8,one:true};L.plats.push(p);return p;};
  let x=0,gy=212,g=ground(0,420,gy);decoGround(L,g,true);
  L.start={x:56,y:gy-22};
  if(n===1)L.hints=[{x:60,y:150,t:'A / D  MOVE'},{x:200,y:144,t:'W  JUMP'},{x:200,y:156,t:'W+D  LEAP'},{x:330,y:150,t:'SPACE  SLASH'},{x:520,y:96,t:'SHIFT  DASH'},{x:520,y:108,t:'W+SHIFT  DASH UP'},{x:760,y:96,t:'S  DUCK HIGH SWINGS'},{x:760,y:108,t:'S+D  ROLL (INVULNERABLE)'},{x:1000,y:102,t:'W+SPACE  UP SLASH'}];
  x=420;let cpDone=false;const gapMaxF=Math.min(52,d.gap[1]);
  while(x<d.len){
    const r=R();
    if(r<d.floatP){
      let py=gy;const k=rint(2,n>2?4:3);
      for(let i=0;i<=k;i++){
        const dy=rint(-28,26),gap=dy<-12?rint(24,38):rint(28,gapMaxF);
        x+=gap;
        if(i===k){gy=clamp(py+dy,150,226);break;}
        py=clamp(py+dy,112,224);const w=rint(52,84);const p=flt(x,py,w);decoFloat(L,p);
        if(w>=66&&R()<d.enemyP*.6)addEnemy(L,p,p.x+2,p.x+p.w-2);else if(R()<d.stimP*.6)addStim(L,p.x+w/2,p.y);
        x+=w;
      }
    }else if(r<d.floatP+d.moveP){
      const pw=rint(150,190);const p=flt(x+4,gy,46);p.mv={a:x+4,b:x+pw-50,sp:rnd(40,60)};p.dir=1;p.dx=0;x+=pw;
    }else if(r<d.floatP+d.moveP+.22){
      gy=clamp(gy+(R()<.5?-1:1)*rint(16,32),150,226);
    }else{
      const gap=rint(d.gap[0],d.gap[1]);x+=gap;gy=clamp(gy+(gap>50?rint(0,26):rint(-26,26)),150,226);
    }
    const w=rint(210,330);g=ground(x,w,gy);decoGround(L,g,false);
    if(n>=3&&w>=280&&R()<.4){const m=x+w/2;addEnemy(L,g,x+16,m-4);addEnemy(L,g,m+4,x+w-16);}
    else if(R()<d.enemyP)addEnemy(L,g,x+16,x+w-16);
    if(R()<d.upperP){const uw=rint(78,110),ux=x+rint(30,Math.max(31,w-uw-30)),up=flt(ux,gy-rint(46,54),uw);decoFloat(L,up);if(R()<d.enemyP*.7)addEnemy(L,up,up.x+2,up.x+up.w-2);else addStim(L,ux+uw/2,up.y);}
    if(!cpDone&&x>d.len*.48){L.cps.push({x:x+30,y:gy,on:false});cpDone=true;}
    x+=w;
  }
  if(!d.boss){
    x+=rint(30,40);g=ground(x,400,gy);decoGround(L,g,true);
    L.exit={x:x+300,y:gy-34,w:22,h:34};L.width=x+400;
    L.plats.push({x:L.width,y:-300,w:20,h:H+500,one:false,wall:true,hidden:true});
  }else{

function moveBody(b,dt){
  const ps=L.plats;b.wall=false;
  b.x+=b.vx*dt;
  for(const s of ps){if(s.one)continue;if(b.x<s.x+s.w&&b.x+b.w>s.x&&b.y<s.y+s.h&&b.y+b.h>s.y){if(b.x+b.w/2<s.x+s.w/2)b.x=s.x-b.w;else b.x=s.x+s.w;b.vx=0;b.wall=true;}}
  const pb=b.y+b.h;b.y+=b.vy*dt;b.onGround=false;b.ground=null;
  for(const s of ps){
    if(b.x+b.w<=s.x||b.x>=s.x+s.w)continue;
    if(s.one){if(b.heavy)continue;if(b.vy>=0&&pb<=s.y+1&&b.y+b.h>=s.y){b.y=s.y-b.h;b.vy=0;b.onGround=true;b.ground=s;}}
    else if(b.y<s.y+s.h&&b.y+b.h>s.y){if(b.vy>=0&&pb<=s.y+6){b.y=s.y-b.h;b.vy=0;b.onGround=true;b.ground=s;}else if(b.vy<0){b.y=s.y+s.h;b.vy=0;}}
  }
}

// ================= PLAYER =================
const GRAV=980,JUMP_V=345,RUN=120,DASH_V=330,DASH_T=.14,ROLL_V=210,ROLL_T=.32;
function playerAtkBox(){
  const p=P;if(p.dead||p.atkT<.08)return null;
  if(p.atkDir==='up')return{x:p.x-9,y:p.y-24,w:p.w+18,h:26};
  const h=p.atkLow?12:20,y=p.atkLow?p.y:p.y-2;
  return p.face>0?{x:p.x+p.w-2,y,w:28,h}:{x:p.x-26,y,w:28,h};
}
function updatePlayer(dt){
  const p=P;p.anim+=dt;
  if(p.dead){p.deadT+=dt;p.vy+=GRAV*dt;p.vx*=.95;if(p.y<H+60)moveBody(p,dt);return;}
  const mx=(keys.right?1:0)-(keys.left?1:0),up=keys.up,down=keys.down;
  p.inv=Math.max(0,p.inv-dt);p.dashCD-=dt;p.atkCD-=dt;p.rollCD-=dt;p.jumpBuf-=dt;p.atkBuf-=dt;p.dashBuf-=dt;p.coyote-=dt;p.atkT-=dt;
  if(p.onGround){p.coyote=.09;p.airDash=1;}
  if(p.state==='normal'||p.state==='roll'){
    if(p.dashBuf>0&&p.dashCD<=0&&(p.onGround||p.airDash>0)){
      p.dashBuf=0;p.state='dash';p.dashT=DASH_T;p.dashCD=.42;if(!p.onGround)p.airDash--;
      if(up){p.dx=0;p.dy=-1;}else{p.dx=p.face;p.dy=0;}
      p.inv=Math.max(p.inv,DASH_T+.04);p.ducking=false;setH(p,22);sfx('dash');
      burst(p.x+5,p.y+p.h,6,['#ffffff','#7a7a9a'],60,.3,0);
    }else if(p.state==='normal'&&p.onGround&&down&&mx!==0&&p.rollCD<=0){
      p.state='roll';p.rollT=ROLL_T;p.face=mx;p.inv=Math.max(p.inv,ROLL_T);setH(p,12);p.ducking=false;sfx('roll');
    }
  }
  if(p.state==='dash'){
    p.dashT-=dt;p.vx=p.dx*DASH_V;p.vy=p.dy*DASH_V*.95;
    if(Math.random()<.7)after.push({x:p.x+p.w/2,y:p.y+p.h,face:p.face,pose:p.dy<0?'dashUp':'dash',l:1});
    if(p.dashT<=0){p.state='normal';if(p.dy<0)p.vy=-120;else p.vx=p.dx*RUN;}
  }else if(p.state==='roll'){
    p.rollT-=dt;p.vx=p.face*ROLL_V*(.6+.4*(p.rollT/ROLL_T));p.vy+=GRAV*dt;
    if(Math.random()<.4)after.push({x:p.x+p.w/2,y:p.y+p.h,face:p.face,pose:'roll',a:p.anim,l:.7});
    if(p.rollT<=0||(!p.onGround&&p.rollT<ROLL_T-.05)){p.state='normal';p.rollCD=.12;if(!(p.onGround&&down))setH(p,22);}
  }else if(p.state==='hurt'){
    p.hurtT-=dt;p.vy+=GRAV*dt;p.vx=approach(p.vx,0,400*dt);if(p.hurtT<=0)p.state='normal';
  }else{
    p.ducking=p.onGround&&down;setH(p,p.ducking?12:22);
    const target=p.ducking?0:mx*RUN;
    p.vx=approach(p.vx,target,(p.onGround?1500:1000)*dt);
    if(mx&&p.atkT<=.05)p.face=mx;
    if(p.jumpBuf>0&&(p.onGround||p.coyote>0)){p.vy=-JUMP_V;p.onGround=false;p.coyote=0;p.jumpBuf=0;p.ducking=false;setH(p,22);sfx('jump');burst(p.x+5,p.y+p.h,5,['#8a8aa8'],40,.25,0);}
    let g=GRAV;if(p.vy<0&&!up)g*=2.2;if(!p.onGround&&down&&p.vy>0)g*=1.6;
    p.vy=Math.min(p.vy+g*dt,down?560:460);
  }
  if(p.atkBuf>0&&p.atkCD<=0&&p.state!=='roll'&&p.state!=='hurt'){
    p.atkBuf=0;p.atkT=.2;p.atkCD=.26;p.atkDir=up?'up':'side';p.atkLow=p.ducking;p.atkId++;p.atkFlip=!p.atkFlip;sfx('slash');
  }
  const wasG=p.onGround,vyB=p.vy;
  moveBody(p,dt);
  if(!wasG&&p.onGround&&vyB>220){burst(p.x+5,p.y+p.h,6,['#8a8aa8'],50,.25,0);sfx('land');}
  if(p.onGround&&p.ground&&!p.ground.mv&&!p.ground.wall){const g=p.ground;p.safe.x=clamp(p.x,g.x+6,g.x+g.w-p.w-6);p.safe.y=g.y-22;}
  if(p.y>H+30){
    p.hp--;L.dmg++;
    if(p.hp<=0)killPlayer();
    else{p.x=p.safe.x;p.y=p.safe.y;p.vx=p.vy=0;p.inv=1.2;p.state='normal';p.h=22;sfx('hurt');shakeIt(4,.2);}
  }
}
function playerPose(p){
  if(p.dead)return'dead';
  if(p.state==='roll')return'roll';
  if(p.state==='dash')return p.dy<0?'dashUp':'dash';
  if(p.state==='hurt')return'hurt';
  if(p.atkT>0)return p.atkDir==='up'?'atkUp':p.atkLow?'atkDuck':'atk';
  if(!p.onGround)return p.vy<0?'jump':'fall';
  if(p.ducking)return'duck';
  if(Math.abs(p.vx)>10)return'run';
  return'idle';
}

// ================= ENEMIES =================
function enemyAtkBox(e){const y=e.low?e.y+e.h-11:e.y+1,h=e.low?11:12;return e.face>0?{x:e.x+e.w,y,w:e.range,h}:{x:e.x-e.range,y,w:e.range,h};}
function damageEnemy(e,dir){
  e.hp--;e.flash=.12;sfx('hit');hitstop(.045);shakeIt(2,.1);
  const cx=e.x+e.w/2,cy=e.y+10;burst(cx,cy,10,[L.th.a,L.th.b,'#ffffff'],150,.35);
  if(e.hp<=0){e.dead=true;e.deadT=0;e.vx=(dir||1)*140;e.vy=-160;L.kills++;sfx('kill');burst(cx,cy,18,[L.th.a,L.th.b,'#ffffff','#ffe600'],180,.6);
    if(Math.random()<.12)L.pickups.push({x:Math.round(cx-4),y:e.y+e.h-16,w:8,h:11,taken:false,ph:0});}
  else{e.state='hurt';e.t=.28;e.vx=dir*130;if(dir===0)e.vy=-120;}
}
function updateEnemies(dt){
  const p=P,pcx=p.x+p.w/2,pfeet=p.y+p.h,ab=playerAtkBox();
  for(const e of L.enemies){
    e.anim+=dt;e.flash-=dt;
    if(e.dead){e.deadT+=dt;if(e.y<H+60){e.vy+=GRAV*dt;e.vx*=.92;moveBody(e,dt);}continue;}
    const ecx=e.x+e.w/2,dx=pcx-ecx,dy=pfeet-(e.y+e.h);
    const inZone=!p.dead&&pcx>e.zone[0]-6&&pcx<e.zone[1]+6&&dy>-56&&dy<20;
    e.t-=dt;
    switch(e.state){
      case 'patrol':e.vx=e.face*e.spd;if(e.x<=e.zone[0]+1)e.face=1;else if(e.x+e.w>=e.zone[1]-1)e.face=-1;
        if(inZone){e.state='alert';e.t=.32;e.face=dx>=0?1:-1;e.vx=0;sfx('alert');}break;
      case 'alert':e.vx=0;if(e.t<=0)e.state='chase';break;
      case 'chase':{if(!inZone){e.state='patrol';break;}e.face=dx>=0?1:-1;const dist=Math.abs(dx)-(e.w+p.w)/2;
        if(dist<=e.range-2&&dy>-30){e.state='windup';e.t=e.wind;e.low=Math.random()<e.lowP;e.vx=0;}else e.vx=e.face*e.chase;break;}
      case 'windup':e.vx=0;if(e.t<=0){e.state='swing';e.t=.14;e.hitDone=false;sfx('swing');}break;
      case 'swing':e.vx=0;if(!e.hitDone&&overlap(enemyAtkBox(e),p)&&hurtPlayer(e.dmg,ecx,e.kb))e.hitDone=true;if(e.t<=0){e.state='recover';e.t=e.rec;}break;
      case 'recover':e.vx=0;if(e.t<=0)e.state=inZone?'chase':'patrol';break;
      case 'hurt':e.vx*=Math.pow(.002,dt);if(e.t<=0)e.state=inZone?'chase':'patrol';break;
    }
    e.vy+=GRAV*dt;moveBody(e,dt);
    if(e.state!=='hurt'){if(e.x<e.zone[0])e.x=e.zone[0];if(e.x+e.w>e.zone[1])e.x=e.zone[1]-e.w;}
    if(e.y>H+40){e.dead=true;e.deadT=5;L.kills++;continue;}
    if(ab&&e.hitId!==p.atkId&&overlap(ab,e)){e.hitId=p.atkId;damageEnemy(e,p.atkDir==='up'?0:p.face);}
  }
}

// ================= BOSS =================
function bossPunchBox(b){return b.face>0?{x:b.x+b.w-6,y:b.y+18,w:46,h:36}:{x:b.x-40,y:b.y+18,w:46,h:36};}
function spawnWaves(b){const sp=b.hp<=b.max/2?205:170,y=b.y+b.h;L.waves.push({x:b.x-2,y,dir:-1,sp,l:2.6},{x:b.x+b.w+2,y,dir:1,sp,l:2.6});burst(b.x+b.w/2,y,20,['#ffffff','#ffc400','#888888'],160,.5);}
function updateArena(){
  const a=L.arena;if(!a||a.on)return;
  if(P.x>a.x+40&&!P.dead){a.on=true;L.plats.push({x:a.x,y:-300,w:12,h:H+500,one:false,wall:true});
    const b=L.boss;b.state='drop';b.y=-100;b.vy=0;music.play('boss');sfx('roar');
    L.banner={t:3.2,title:'K-9000 OVERLORD',sub:'CORPORATE ENFORCEMENT MECH',boss:true};}
}
function updateBoss(dt){
  const b=L.boss;if(!b||b.state==='wait'||b.state==='dead')return;
  b.t-=dt;b.flash-=dt;b.anim+=dt;
  const ph2=b.hp<=b.max/2,sp=ph2?.7:1,pc=P.x+P.w/2,bc=b.x+b.w/2,dx=pc-bc,adx=Math.abs(dx);
  const faceP=()=>{b.face=dx>=0?1:-1;};
  switch(b.state){
    case 'drop':if(b.onGround){b.state='roar';b.t=1.1;shakeIt(10,.5);sfx('slam');burst(bc,b.y+b.h,24,['#ffffff','#888888'],160,.5);}break;
    case 'roar':b.vx=0;faceP();if(b.t<=0){b.state='walk';b.t=.8;}break;
    case 'walk':faceP();b.vx=b.face*(ph2?58:40);
      if(adx<64&&b.t<.5){b.state='pWind';b.t=.55*sp;b.vx=0;}
      else if(b.t<=0){const r=Math.random();if(adx<90&&r<.5){b.state='pWind';b.t=.55*sp;}else if(r<.55||adx>200){b.state='cWind';b.t=.75*sp;}else{b.state='lWind';b.t=.45*sp;}b.vx=0;}
      break;
    case 'pWind':b.vx=0;if(b.t<=0){b.state='punch';b.t=.2;sfx('swing');b.hitDone=false;}break;
    case 'punch':b.vx=b.face*60;if(!b.hitDone&&overlap(bossPunchBox(b),P)&&hurtPlayer(2,bc,240))b.hitDone=true;if(b.t<=0){b.state='rest';b.t=.65*sp;}break;
    case 'cWind':b.vx=0;if(b.t>.35*sp)faceP();if(Math.random()<.5)parts.push({x:bc-b.face*20,y:b.y+30,vx:-b.face*rr(20,60),vy:rr(-40,-10),l:.5,m:.5,c:'#9aa0b0',g:-20,s:2});
      if(b.t<=0){b.state='charge';b.t=3;sfx('dash');}break;
    case 'charge':b.vx=b.face*(ph2?340:280);if(Math.random()<.6)parts.push({x:bc-b.face*20,y:b.y+b.h-2,vx:-b.face*rr(40,120),vy:rr(-80,-20),l:.3,m:.3,c:rpick(['#ffc400','#ffffff']),g:300,s:1});break;
    case 'stun':b.vx=0;if(b.t<=0){b.state='walk';b.t=.9;}break;
    case 'lWind':b.vx=0;faceP();if(b.t<=0){b.state='air';b.vy=-440;b.vx=clamp(dx/(2*440/GRAV),-300,300);b.onGround=false;sfx('jump');}break;
    case 'air':if(b.onGround){b.state='rest';b.t=.8*sp;b.vx=0;shakeIt(10,.4);sfx('slam');spawnWaves(b);if(ph2)b.wave2=.4;}break;
    case 'rest':b.vx=0;if(b.t<=0){b.state='walk';b.t=rr(.6,1.2)*sp;}break;
    case 'dying':b.vx=0;b.boomT-=dt;if(b.boomT<=0){b.boomT=.16;burst(b.x+rr(0,b.w),b.y+rr(0,b.h),12,['#ffc400','#ff5a00','#ffffff'],140,.5);sfx('boom');shakeIt(5,.2);}
      if(b.t<=0){b.state='dead';burst(bc,b.y+35,60,['#ffc400','#ff5a00','#ffffff',L.th.a],260,1.2);shakeIt(12,.6);completeLevel();return;}break;
  }
  if(b.wave2>0){b.wave2-=dt;if(b.wave2<=0)spawnWaves(b);}
  b.vy+=GRAV*dt;moveBody(b,dt);
  if(b.state==='charge'&&(b.wall||b.t<=0)){b.state='stun';b.t=1.4;b.vx=0;shakeIt(8,.4);sfx('slam');burst(b.face>0?b.x+b.w:b.x,b.y+30,20,['#ffc400','#ffffff'],160,.5);}
  if((b.state==='charge'||b.state==='air'||b.state==='drop')&&overlap(b,P))hurtPlayer(2,bc,260);
  const ab=playerAtkBox();
  if(ab&&b.state!=='dying'&&b.hitId!==P.atkId&&overlap(ab,b)){
    b.hitId=P.atkId;const dmg=b.state==='stun'?2:1;b.hp-=dmg;b.flash=.1;sfx('hit');hitstop(.04);
    burst(ab.x+ab.w/2,ab.y+ab.h/2,10,['#ffffff','#ffc400',L.th.a],160,.35);
    if(b.hp<=0){b.hp=0;b.state='dying';b.t=2.6;b.boomT=0;b.wave2=0;L.kills++;L.waves.length=0;music.stop();}
  }
}
function updateWaves(dt){
  const a=L.arena;
  for(let i=L.waves.length-1;i>=0;i--){const w=L.waves[i];w.x+=w.dir*w.sp*dt;w.l-=dt;
    if(Math.random()<.5)parts.push({x:w.x,y:w.y-rr(0,10),vx:-w.dir*rr(10,40),vy:rr(-60,-10),l:.3,m:.3,c:rpick(['#ffffff',L.th.a]),g:100,s:1});
    if(overlap({x:w.x-5,y:w.y-12,w:10,h:12},P))hurtPlayer(1,w.x-w.dir*10,150);
    if(w.l<=0||(a&&(w.x<a.x+12||w.x>a.x+W-12)))L.waves.splice(i,1);}

// ================= MAIN UPDATE =================
function updatePlay(dt){
  if(pressed.pause){openMenu('pause',false,true);return;}
  if(pressed.mute)toggleMute();
  if(pressed.up)P.jumpBuf=.12;if(pressed.attack)P.atkBuf=.12;if(pressed.dash)P.dashBuf=.1;
  updateFX(dt);
  if(freezeT>0){freezeT-=dt;return;}
  L.time+=dt;
  for(const p of L.plats)if(p.mv){const ox=p.x;if(p.wait>0)p.wait-=dt;else{p.x+=p.dir*p.mv.sp*dt;if(p.x>p.mv.b){p.x=p.mv.b;p.dir=-1;p.wait=.8;}if(p.x<p.mv.a){p.x=p.mv.a;p.dir=1;p.wait=.8;}}p.dx=p.x-ox;}
  if(P.onGround&&P.ground&&P.ground.mv)P.x+=P.ground.dx;
  updatePlayer(dt);updateEnemies(dt);updateArena();updateBoss(dt);updateWaves(dt);
  for(const s of L.pickups)if(!s.taken&&!P.dead&&overlap(P,s)){s.taken=true;P.hp=Math.min(P.maxHp,P.hp+2);sfx('pickup');burst(s.x+4,s.y+5,14,['#7dff3a','#ffffff'],100,.5);L.toast={t:1.2,s:'+2 HP'};}
  L.cps.forEach((c,i)=>{if(!c.on&&!P.dead&&P.x+P.w>c.x-4&&P.x<c.x+6&&Math.abs(P.y+P.h-c.y)<40){c.on=true;L.cpIndex=i;sfx('check');L.toast={t:1.6,s:'CHECKPOINT'};burst(c.x+1,c.y-33,14,[L.th.b,'#ffffff'],90,.5);}});
  if(L.exit&&!P.dead&&overlap(P,L.exit)){completeLevel();return;}
  for(const f of L.fires)if(Math.random()<.08&&Math.abs(f.x-cam.x-W/2)<W)parts.push({x:f.x+rr(-2,2),y:f.y-4,vx:rr(-10,10),vy:rr(-50,-20),l:.8,m:.8,c:rpick(['#ff8a00','#ffd23a']),g:-10,s:1});
  for(const v of L.vents){v.t-=dt;if(v.t<=0){v.t=rr(1,2.5);for(let i=0;i<6;i++)parts.push({x:v.x+rr(-3,3),y:v.y,vx:rr(-8,8),vy:rr(-40,-20),l:1.2,m:1.2,c:'#b8bccc',g:-8,s:3,a:.25});}}
  let tx=L.arena&&L.arena.on?L.arena.x:P.x+P.w/2-W*.42+P.face*24;
  tx=clamp(tx,0,Math.max(0,L.width-W));cam.x+=(tx-cam.x)*Math.min(1,dt*5);
  if(L.banner){L.banner.t-=dt;if(L.banner.t<=0)L.banner=null;}
  if(L.toast){L.toast.t-=dt;if(L.toast.t<=0)L.toast=null;}
  if(P.dead&&P.deadT>1.6)openMenu('dead',false,true);
}
function updateFX(dt){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue;}q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}
  for(let i=after.length-1;i>=0;i--){after[i].l-=dt*4;if(after[i].l<=0)after.splice(i,1);}
  if(shake.t>0){shake.t-=dt;shake.x=rr(-1,1)*shake.m;shake.y=rr(-1,1)*shake.m;shake.m*=.9;}else{shake.x=shake.y=0;shake.m=0;}

}
function drawHUD(){
  const th=L.th;
  for(let i=0;i<P.maxHp;i++)heart(8+i*9,8,i<P.hp?'#ff2a5a':'#3a1424');
  const k=clamp(1-P.dashCD/.42,0,1);F(8,17,52,2,'#1a1a28');F(8,17,Math.round(52*k),2,k>=1?th.b:'#4a4a70');
  text('LV'+L.n+' '+L.d.name,W/2,6,'#cfc8ea',8,'center');
  text('KILLS '+L.kills+'/'+L.total,W-8,6,th.c,8,'right');
  text(fmtT(L.time),W-8,17,'#9a94b8',8,'right');
  const b=L.boss;
  if(b&&L.arena&&L.arena.on&&b.state!=='dead'){const bw=260,bx=(W-bw)/2,by=252;text('K-9000 OVERLORD',W/2,by-11,'#ffffff',8,'center',th.a);F(bx-1,by-1,bw+2,7,'#000000');F(bx,by,bw,5,'#2a0a1a');F(bx,by,Math.round(bw*b.hp/b.max),5,b.hp<=b.max/2?'#ff2a2a':th.a);F(bx+bw/2,by,1,5,'#ffffff');}
  if(L.banner){const bn=L.banner,a=clamp(Math.min(bn.t*1.5,(3.2-bn.t)*3),0,1);ctx.globalAlpha=a;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,92,W,50);ctx.fillStyle=bn.boss?'#ff2a2a':th.a;ctx.fillRect(0,92,W,1);ctx.fillRect(0,141,W,1);
    text(bn.title,W/2,100,'#ffffff',16,'center',bn.boss?'#ff2a2a':th.a);text(bn.sub,W/2,124,bn.boss?'#ffb0b0':th.b,8,'center');ctx.globalAlpha=1;}
  if(L.toast){ctx.globalAlpha=clamp(L.toast.t*2,0,1);text(L.toast.s,W/2,60,th.c,8,'center',th.c);ctx.globalAlpha=1;}
  if(!document.hasFocus()&&Math.floor(T*2)%2)text('CLICK THE GAME TO FOCUS',W/2,H-14,'#ffe600',8,'center');
}

// ================= MENUS =================
const menu={screen:'title',idx:0,stack:[],rects:[],ingame:false};
function openMenu(s,push,ingame){if(push)menu.stack.push({s:menu.screen,i:menu.idx});else menu.stack=[];menu.screen=s;menu.idx=0;if(ingame!==undefined)menu.ingame=ingame;state='menu';}
function back(){if(menu.stack.length){const o=menu.stack.pop();menu.screen=o.s;menu.idx=o.i;}else if(menu.screen==='pause')resume();}
function resume(){state='play';}
function toTitle(){L=null;P=null;openMenu('title',false,false);music.play('menu');}
function newGame(){save.started=true;save.current=1;save.unlocked=1;save.best={};save.done=false;writeSave();startLevel(1);}
function resetSave(){Object.assign(save,{started:false,unlocked:1,current:1,best:{},done:false});writeSave();}
const bar=v=>'['+'|'.repeat(Math.round(v*10)).padEnd(10,'.')+']';
function menuItems(){
  const it=[],add=(label,act,o={})=>it.push(Object.assign({label,act},o));
  switch(menu.screen){
    case 'title':
      if(save.started)add('CONTINUE - LEVEL '+save.current,()=>startLevel(save.current));
      add('NEW GAME',()=>save.started?openMenu('confirmNew',true):newGame());
      add('SELECT LEVEL',()=>openMenu('levels',true));
      add('OPTIONS',()=>openMenu('options',true));
      add('CONTROLS',()=>openMenu('controls',true));break;
    case 'confirmNew':add('YES, START OVER',newGame);add('NO',back);break;
    case 'levels':
      for(let i=1;i<=5;i++){const lock=i>save.unlocked,b=save.best[i];add(lock?(i+'  ??????????').padEnd(20)+'LOCKED':(i+'  '+LEVELS[i].name).padEnd(20)+(b?'BEST '+fmtT(b):'NEW'),()=>{if(lock)sfx('hurt');else startLevel(i);},{dis:lock});}
      add('BACK',back);break;
    case 'options':
      add('MUSIC  '+bar(save.music),null,{adj:d=>{save.music=clamp(Math.round((save.music+d)*10)/10,0,1);AU.apply();writeSave();}});
      add('SFX    '+bar(save.sfx),null,{adj:d=>{save.sfx=clamp(Math.round((save.sfx+d)*10)/10,0,1);AU.apply();writeSave();sfx('slash');}});
      add('SOUND  '+(save.muted?'OFF':'ON '),()=>{save.muted=!save.muted;AU.apply();writeSave();},{adj:()=>{save.muted=!save.muted;AU.apply();writeSave();}});
      if(!menu.ingame)add('RESET PROGRESS',()=>openMenu('confirmReset',true));
      add('BACK',back);break;
    case 'confirmReset':add('YES, ERASE SAVE',()=>{resetSave();back();back();});add('NO',back);break;
    case 'controls':add('BACK',back);break;
    case 'pause':add('RESUME',resume);add('RESTART LEVEL',()=>startLevel(L.n));add('OPTIONS',()=>openMenu('options',true));add('CONTROLS',()=>openMenu('controls',true));add('QUIT TO MENU',toTitle);break;
    case 'dead':if(L.cpIndex>=0)add('RETRY FROM CHECKPOINT',()=>startLevel(L.n,true));add('RESTART LEVEL',()=>startLevel(L.n));add('QUIT TO MENU',toTitle);break;
    case 'complete':add('NEXT LEVEL',()=>startLevel(L.n+1));add('REPLAY LEVEL',()=>startLevel(L.n));add('MAIN MENU',toTitle);break;
    case 'victory':add('MAIN MENU',toTitle);add('FIGHT THE BOSS AGAIN',()=>startLevel(5));break;
  }
  return it;
}
function activate(m,dir){if(m.adj&&dir){m.adj(dir*.1);sfx('move');return;}if(m.act){sfx('select');m.act();}else if(m.adj){m.adj(.1);sfx('move');}}
function updateMenu(){
  if(pressed.mute)toggleMute();
  const it=menuItems();if(!it.length)return;
  if(menu.idx>=it.length)menu.idx=it.length-1;
  if(pressed.up){menu.idx=(menu.idx-1+it.length)%it.length;sfx('move');}
  if(pressed.down){menu.idx=(menu.idx+1)%it.length;sfx('move');}
  const cur=it[menu.idx];
  if(cur.adj){if(pressed.left)activate(cur,-1);if(pressed.right)activate(cur,1);}
  if(pressed.enter||pressed.attack)activate(cur,0);
  else if(pressed.pause)back();
}
let titleCam=0;
const demoE={x:404,y:200,w:12,h:26,face:-1,state:'patrol',vx:0,anim:0,flash:0,t:0,weapon:'bat',dead:false,hp:1,maxHp:1,look:{jacket:'#141418',trim:'#ff2bd6',pants:'#1f2433',shirt:'#e6e6ee',skin:'#e0ac69',skin2:darken('#e0ac69',.78),hair:'mohawk',hc:'#00f0ff',imps:['arm','eye'],glow:'#00f0ff',spikes:true,earring:true}};
function drawTitleBG(){
  const bg=bgFor(0),th=THEMES[0];titleCam+=rdt*18;
  ctx.drawImage(bg.sky,0,0);drawLayer(bg.far,titleCam*.12);drawCars(titleCam,rdt);ctx.drawImage(bg.fog,0,0);drawLayer(bg.mid,titleCam*.3);
  F(0,226,W,44,th.plat);F(0,226,W,6,th.plat2);F(0,226,W,1,th.b);
  ctx.save();ctx.translate(70,226);drawSamurai('idle',T);ctx.restore();
  drawGlow(73,229,SC.visor,6,.35);
  drawEnemy(demoE);
  drawRain(rdt);ctx.drawImage(vignette,0,0);
}
function drawLogo(){
  const g=Math.sin(T*3.1)>.96;
  ctx.font='24px '+FONT;ctx.textBaseline='top';ctx.textAlign='center';
  if(g){ctx.fillStyle='rgba(255,0,80,.6)';ctx.fillText('NEON RONIN',W/2-3,34);ctx.fillStyle='rgba(0,240,255,.6)';ctx.fillText('NEON RONIN',W/2+3,36);}
  ctx.textAlign='left';const w1=ctx.measureText('NEON ').width,w2=ctx.measureText('RONIN').width,x0=W/2-(w1+w2)/2;
  ctx.shadowBlur=12;ctx.shadowColor='#ff2bd6';ctx.fillStyle='#ff2bd6';ctx.fillText('NEON',x0,35);
  ctx.shadowColor='#00f0ff';ctx.fillStyle='#00f0ff';ctx.fillText('RONIN',x0+w1,35);ctx.shadowBlur=0;
  text('A CYBERPUNK KATANA PLATFORMER',W/2,68,'#e8e4ff',8,'center');
}
const CONTROLS=[['A / D','MOVE LEFT / RIGHT'],['W','JUMP'],['W+A / W+D','DIAGONAL LEAP'],['S','DUCK (DODGE HIGH SWINGS)'],['S+A / S+D','ROLL (INVULNERABLE)'],['SHIFT','DASH  (HOLD W: DASH UP)'],['SPACE','SLASH  (HOLD W: UP SLASH)'],['ESC / P','PAUSE      M: MUTE']];
function drawMenu(){
  const ig=menu.ingame&&L;
  if(ig){drawWorld();drawHUD();ctx.fillStyle='rgba(6,3,14,.8)';ctx.fillRect(0,0,W,H);}else drawTitleBG();
  const th=ig?L.th:THEMES[0];
  let y0=118;
  const title=(s,c=th.a,y=34)=>text(s,W/2,y,'#ffffff',16,'center',c);
  switch(menu.screen){
    case 'title':drawLogo();y0=112;if(save.done)text('GAME COMPLETED',W/2,82,th.c,8,'center');break;
    case 'pause':title('PAUSED');y0=86;break;
    case 'options':title('OPTIONS');y0=86;text('A / D TO ADJUST',W/2,62,'#9a94b8',8,'center');break;
    case 'controls':title('CONTROLS',th.a,22);CONTROLS.forEach(([k,d],i)=>{text(k,64,52+i*15,th.b,8);text(d,170,52+i*15,'#e8e4ff',8);});
      text('WATCH THE WEAPON: RAISED HIGH = DUCK',W/2,180,th.c,8,'center');text('HELD LOW (YELLOW GLINT) = JUMP OR ROLL',W/2,192,th.c,8,'center');y0=222;break;
    case 'levels':title('SELECT LEVEL');y0=76;break;
    case 'confirmNew':title('NEW GAME?');text('YOUR SAVED PROGRESS WILL BE RESET',W/2,70,th.c,8,'center');y0=104;break;
    case 'confirmReset':title('ERASE SAVE?');text('UNLOCKED LEVELS AND BEST TIMES',W/2,70,th.c,8,'center');y0=104;break;
    case 'dead':title('YOU DIED','#ff2a2a',60);text('THE CITY CLAIMS ANOTHER BLADE',W/2,86,'#ffb0b0',8,'center');y0=118;break;
    case 'complete':{title('LEVEL CLEAR',th.a,30);const r=L.result;
      [['TIME',fmtT(r.time)],['KILLS',r.kills+' / '+r.total],['DAMAGE TAKEN',String(r.dmg)]].forEach(([a,b],i)=>{text(a,140,64+i*14,'#9a94b8',8);text(b,340,64+i*14,'#ffffff',8,'right');});
      text('RANK',140,112,'#9a94b8',8);text(r.rank,340,106,th.c,16,'right',th.c);y0=146;break;}
    case 'victory':{title('OVERLORD DESTROYED',th.a,30);text('NEO-KYOTO SLEEPS SAFE TONIGHT.',W/2,58,'#e8e4ff',8,'center');text('THE RONIN WALKS ON INTO THE RAIN.',W/2,70,'#e8e4ff',8,'center');
      const r=L.result;text('BOSS TIME '+fmtT(r.time)+'   RANK '+r.rank,W/2,92,th.c,8,'center');text('THANKS FOR PLAYING',W/2,114,th.b,8,'center',th.b);y0=150;break;}
  }
  const it=menuItems();menu.rects=[];
  it.forEach((m,i)=>{const y=y0+i*15,sel=i===menu.idx,col=m.dis?(sel?'#8a84a8':'#55506a'):sel?th.a:'#d8d4ea';const lbl=sel?'> '+m.label+' <':m.label;
    text(lbl,W/2,y,col,8,'center',sel&&!m.dis?th.a:null);ctx.font='8px '+FONT;const w=ctx.measureText(lbl).width;menu.rects.push({x:W/2-w/2-6,y:y-3,w:w+12,h:14});});
  if(!ig||menu.screen!=='controls')text('W/S CHOOSE  ENTER/SPACE OK  ESC BACK',W/2,H-12,'#7a74a0',8,'center');
  if(!document.hasFocus()&&Math.floor(T*2)%2)text('CLICK THE GAME TO FOCUS',W/2,H-26,'#ffe600',8,'center');
}

// ================= MOUSE =================
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('mousemove',e=>{if(state!=='menu')return;const p=toCanvas(e);menu.rects.forEach((r,i)=>{if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h&&menu.idx!==i){menu.idx=i;}});});
cv.addEventListener('mousedown',e=>{cv.focus();AU.init();if(state!=='menu')return;const p=toCanvas(e);const it=menuItems();
  menu.rects.forEach((r,i)=>{if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h&&it[i]){menu.idx=i;const m=it[i];if(m.adj&&!m.act)activate(m,p.x<r.x+r.w/2?-1:1);else activate(m,0);}});});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')openMenu('pause',false,true);});

// ================= LOOP =================
let acc=0,last=performance.now();
function frame(now){
  let dt=Math.min(.1,(now-last)/1000);last=now;rdt=dt;acc+=dt;
  while(acc>=STEP){
    T+=STEP;
    if(state==='play')updatePlay(STEP);else updateMenu();
    for(const k in pressed)delete pressed[k];
    acc-=STEP;
  }
  try{if(state==='play'){drawWorld();drawHUD();}else drawMenu();}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
music.play('menu');
requestAnimationFrame(frame);
cv.focus();
</script>
