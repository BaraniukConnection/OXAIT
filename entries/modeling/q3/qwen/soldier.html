<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blocy Soldier 3D Viewer</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: Arial; }
  canvas { display: block; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #fff;
    background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px;
    font-size: 14px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">🖱️ Left-drag: Rotate | Scroll: Zoom | Right-drag: Pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 20, 50);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(5, 4, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1.5, 0);

// Lighting
const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
fillLight.position.set(-5, 3, -5);
scene.add(fillLight);

// Ground
const groundGeo = new THREE.PlaneGeometry(30, 30);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3e, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid
const grid = new THREE.GridHelper(30, 30, 0x444466, 0x333355);
scene.add(grid);

// Materials
const camoGreen = new THREE.MeshStandardMaterial({ color: 0x4a6b3a, roughness: 0.7 });
const camoDark = new THREE.MeshStandardMaterial({ color: 0x2d4a22, roughness: 0.7 });
const camoTan = new THREE.MeshStandardMaterial({ color: 0x8b7d5a, roughness: 0.7 });
const skinMat = new THREE.MeshStandardMaterial({ color: 0xd4a574, roughness: 0.6 });
const blackMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4 });
const grayMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.5 });
const helmetMat = new THREE.MeshStandardMaterial({ color: 0x3d5c2e, roughness: 0.6 });
const vestMat = new THREE.MeshStandardMaterial({ color: 0x5a4a30, roughness: 0.7 });
const bootMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.8 });
const goggleMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00aa55, roughness: 0.2 });

// Helper function to create a block
function block(w, h, d, mat, x, y, z, parent) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// Build Soldier
const soldier = new THREE.Group();

// === HEAD ===
const headGroup = new THREE.Group();
block(0.8, 0.8, 0.8, skinMat, 0, 2.8, 0, headGroup); // face
block(0.85, 0.3, 0.85, helmetMat, 0, 3.25, 0, headGroup); // helmet top
block(0.85, 0.2, 0.85, helmetMat, 0, 3.05, 0.05, headGroup); // helmet brim
block(0.7, 0.2, 0.1, goggleMat, 0, 2.85, 0.42, headGroup); // goggles
block(0.3, 0.15, 0.1, blackMat, 0, 2.55, 0.42, headGroup); // mouth area
block(0.15, 0.05, 0.1, blackMat, 0, 2.65, 0.43, headGroup); // nose
soldier.add(headGroup);

// === NECK ===
block(0.3, 0.2, 0.3, skinMat, 0, 2.35, 0, soldier);

// === TORSO ===
block(1.2, 1.2, 0.7, camoGreen, 0, 1.8, 0, soldier); // main torso
block(1.25, 0.8, 0.75, vestMat, 0, 1.9, 0.05, soldier); // tactical vest
// Vest pouches
block(0.25, 0.3, 0.15, camoDark, -0.35, 1.7, 0.45, soldier);
block(0.25, 0.3, 0.15, camoDark, 0, 1.7, 0.45, soldier);
block(0.25, 0.3, 0.15, camoDark, 0.35, 1.7, 0.45, soldier);
// Radio
block(0.15, 0.25, 0.1, grayMat, 0.5, 2.1, 0.35, soldier);
block(0.05, 0.3, 0.05, blackMat, 0.55, 2.25, 0.35, soldier); // antenna

// === SHOULDERS ===
block(0.5, 0.3, 0.5, camoDark, -0.75, 2.25, 0, soldier); // left shoulder
block(0.5, 0.3, 0.5, camoDark, 0.75, 2.25, 0, soldier); // right shoulder

// === ARMS ===
// Left arm
block(0.35, 0.9, 0.35, camoGreen, -0.75, 1.55, 0, soldier);
block(0.3, 0.15, 0.3, camoTan, -0.75, 1.05, 0.1, soldier); // left hand

// Right arm (holding rifle)
block(0.35, 0.9, 0.35, camoGreen, 0.75, 1.55, 0.15, soldier);
block(0.3, 0.15, 0.3, camoTan, 0.75, 1.05, 0.25, soldier); // right hand

// === RIFLE ===
const rifle = new THREE.Group();
block(0.12, 0.12, 1.2, grayMat, 0, 0, 0, rifle); // barrel
block(0.15, 0.25, 0.3, blackMat, 0, -0.1, 0.3, rifle); // magazine
block(0.1, 0.15, 0.4, blackMat, 0, 0.05, -0.4, rifle); // stock
block(0.08, 0.08, 0.2, blackMat, 0, 0.1, 0.6, rifle); // front grip
rifle.position.set(0.75, 1.2, 0.5);
rifle.rotation.x = -0.3;
soldier.add(rifle);

// === WAIST / BELT ===
block(1.1, 0.2, 0.65, blackMat, 0, 1.15, 0, soldier);
block(0.2, 0.15, 0.1, grayMat, 0, 1.15, 0.35, soldier); // buckle

// === LEGS ===
block(0.45, 0.9, 0.45, camoGreen, -0.3, 0.6, 0, soldier); // left leg
block(0.45, 0.9, 0.45, camoGreen, 0.3, 0.6, 0, soldier); // right leg

// Knee pads
block(0.48, 0.2, 0.15, blackMat, -0.3, 0.5, 0.25, soldier);
block(0.48, 0.2, 0.15, blackMat, 0.3, 0.5, 0.25, soldier);

// === BOOTS ===
block(0.5, 0.35, 0.6, bootMat, -0.3, 0.17, 0.05, soldier);
block(0.5, 0.35, 0.6, bootMat, 0.3, 0.17, 0.05, soldier);
block(0.52, 0.1, 0.62, blackMat, -0.3, 0.05, 0.05, soldier); // sole
block(0.52, 0.1, 0.62, blackMat, 0.3, 0.05, 0.05, soldier);

scene.add(soldier);

// Animation
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  // Subtle idle breathing animation
  soldier.position.y = Math.sin(Date.now() * 0.002) * 0.02;
  headGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.05;
  renderer.render(scene, camera);
}
animate();

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
