<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low Poly Futuristic Tank</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111111; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #info {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: #00ffff; font-size: 14px; letter-spacing: 2px;
            pointer-events: none; text-shadow: 0 0 8px #00ffff;
            text-transform: uppercase;
        }
        #controls-hint {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #888; font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">MK-IV CYBER TANK // LOW POLY RENDER</div>
    <div id="controls-hint">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.Fog(0x111111, 15, 40);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent going below ground

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0x00ffff, 1);
        rimLight.position.set(-5, 5, -5);
        scene.add(rimLight);

        // --- Materials (Low Poly Flat Shading) ---
        const hullMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, flatShading: true, roughness: 0.8 });
        const armorMat = new THREE.MeshStandardMaterial({ color: 0x34495e, flatShading: true, roughness: 0.6 });
        const accentMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, flatShading: true, roughness: 0.5 });
        const glowMat = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            emissive: 0x00ffff, 
            emissiveIntensity: 1.5, 
            flatShading: true 
        });
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x111111, flatShading: true, roughness: 0.9 });
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, flatShading: true, roughness: 1 });

        // --- Tank Construction ---
        const tank = new THREE.Group();

        // Tracks
        const trackGeo = new THREE.BoxGeometry(1.2, 0.8, 4.5);
        const leftTrack = new THREE.Mesh(trackGeo, trackMat);
        leftTrack.position.set(-1.6, 0.4, 0);
        leftTrack.castShadow = true;
        leftTrack.receiveShadow = true;
        tank.add(leftTrack);

        const rightTrack = new THREE.Mesh(trackGeo, trackMat);
        rightTrack.position.set(1.6, 0.4, 0);
        rightTrack.castShadow = true;
        rightTrack.receiveShadow = true;
        tank.add(rightTrack);

        // Track details (wheels)
        const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.3, 8);
        wheelGeo.rotateZ(Math.PI / 2);
        for(let i = -1.5; i <= 1.5; i += 0.75) {
            const leftWheel = new THREE.Mesh(wheelGeo, hullMat);
            leftWheel.position.set(-1.6, 0.4, i);
            tank.add(leftWheel);
            
            const rightWheel = new THREE.Mesh(wheelGeo, hullMat);
            rightWheel.position.set(1.6, 0.4, i);
            tank.add(rightWheel);
        }

        // Main Hull
        const hullGeo = new THREE.BoxGeometry(3.2, 0.8, 3.8);
        const hull = new THREE.Mesh(hullGeo, hullMat);
        hull.position.y = 1.2;
        hull.castShadow = true;
        hull.receiveShadow = true;
        tank.add(hull);

        // Front Angled Armor
        const frontGeo = new THREE.BoxGeometry(3.4, 0.6, 1.2);
        const frontArmor = new THREE.Mesh(frontGeo, armorMat);
        frontArmor.position.set(0, 1.4, 2.4);
        frontArmor.rotation.x = -0.3;
        frontArmor.castShadow = true;
        tank.add(frontArmor);

        // Turret Base
        const turretBaseGeo = new THREE.CylinderGeometry(1.1, 1.3, 0.4, 6);
        const turretBase = new THREE.Mesh(turretBaseGeo, armorMat);
        turretBase.position.set(0, 1.8, -0.2);
        turretBase.castShadow = true;
        tank.add(turretBase);

        // Turret Main Body
        const turretGeo = new THREE.BoxGeometry(2.2, 0.9, 2.4);
        const turret = new THREE.Mesh(turretGeo, hullMat);
        turret.position.set(0, 2.4, -0.2);
        turret.castShadow = true;
        tank.add(turret);

        // Cannon Barrel
        const cannonGeo = new THREE.CylinderGeometry(0.12, 0.18, 3.5, 6);
        cannonGeo.rotateX(Math.PI / 2);
        const cannon = new THREE.Mesh(cannonGeo, accentMat);
        cannon.position.set(0, 2.4, 2.8);
        cannon.castShadow = true;
        tank.add(cannon);

        // Cannon Tip
        const cannonTipGeo = new THREE.CylinderGeometry(0.2, 0.12, 0.5, 6);
        cannonTipGeo.rotateX(Math.PI / 2);
        const cannonTip = new THREE.Mesh(cannonTipGeo, armorMat);
        cannonTip.position.set(0, 2.4, 4.5);
        tank.add(cannonTip);

        // Glowing Energy Core
        const coreGeo = new THREE.OctahedronGeometry(0.35, 0);
        const core = new THREE.Mesh(coreGeo, glowMat);
        core.position.set(0, 2.4, -0.2);
        tank.add(core);

        // Core Light
        const coreLight = new THREE.PointLight(0x00ffff, 3, 6);
        coreLight.position.set(0, 2.4, -0.2);
        tank.add(coreLight);

        // Side Armor Details
        const detailGeo = new THREE.BoxGeometry(0.2, 0.5, 0.8);
        for(let i = 0; i < 3; i++) {
            const leftDetail = new THREE.Mesh(detailGeo, accentMat);
            leftDetail.position.set(-1.7, 1.2, -1 + i * 1);
            tank.add(leftDetail);
            
            const rightDetail = new THREE.Mesh(detailGeo, accentMat);
            rightDetail.position.set(1.7, 1.2, -1 + i * 1);
            tank.add(rightDetail);
        }

        // Antennas
        const antennaGeo = new THREE.CylinderGeometry(0.02, 0.02, 1.5, 4);
        const antenna1 = new THREE.Mesh(antennaGeo, accentMat);
        antenna1.position.set(-0.8, 3.1, -1);
        tank.add(antenna1);
        
        const antenna2 = new THREE.Mesh(antennaGeo, accentMat);
        antenna2.position.set(0.8, 3.1, -1);
        tank.add(antenna2);

        scene.add(tank);

        // --- Ground ---
        const groundGeo = new THREE.PlaneGeometry(100, 100, 20, 20);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid Helper for low poly feel
        const gridHelper = new THREE.GridHelper(100, 50, 0x333333, 0x222222);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            // Animate core
            core.rotation.y += 0.02;
            core.rotation.x += 0.01;
            
            // Pulse light
            coreLight.intensity = 3 + Math.sin(Date.now() * 0.005) * 1.5;
            
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
