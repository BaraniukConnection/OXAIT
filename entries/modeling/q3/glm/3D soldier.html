<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0f120c}
  body{font-family:'Chakra Petch',sans-serif;color:#cfd6b8;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0}
  canvas{display:block;cursor:grab}
  canvas:active{cursor:grabbing}

  .panel{position:fixed;z-index:10;background:rgba(13,15,10,.74);border:1px solid #3c4530;
    backdrop-filter:blur(5px);padding:14px 16px;
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
  .dossier{left:18px;top:18px;width:312px}
  .dossier h1{font-family:'Black Ops One';font-weight:400;font-size:24px;letter-spacing:2px;color:#dfe5c8;line-height:1.05}
  .dossier h1 em{font-style:normal;color:#c9b487}
  .dossier .sub{font-size:10px;letter-spacing:3px;color:#7f8a6a;margin:7px 0 10px;border-bottom:1px solid #2c3323;padding-bottom:9px}
  .dossier .rows{font-family:'Share Tech Mono',monospace;font-size:11.5px;color:#a9b48d;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
  .dossier .rows b{color:#6c7657;font-weight:400}
  .dossier .serial{margin-top:11px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;color:#5c6549}

  .control{right:18px;top:18px;width:240px}
  .p-title{font-size:10px;letter-spacing:3px;color:#7f8a6a;margin-bottom:8px}
  .crow{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:2px;color:#a9b48d;margin:10px 0 4px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#3c4530}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;background:#b7c48c;border:1px solid #10130b;border-radius:0}
  input[type=range]::-moz-range-track{height:2px;background:#3c4530}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;background:#b7c48c;border:1px solid #10130b;border-radius:0}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  button{font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.6px;color:#b3bd97;
    background:transparent;border:1px solid #3c4530;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  button:hover{background:rgba(183,196,140,.1);border-color:#55613f}
  button.on,#statebar button.active{background:#b7c48c;color:#14170f;border-color:#b7c48c}
  button.wide{width:100%;justify-content:center;margin-top:10px}
  button i{font-style:normal;font-family:'Share Tech Mono',monospace;font-size:9px;opacity:.55}

  #statebar{position:fixed;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px;
    background:rgba(13,15,10,.74);border:1px solid #3c4530;padding:8px;backdrop-filter:blur(5px);
    clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%,0 12px)}
  #readout{position:fixed;z-index:10;left:18px;bottom:20px;font-family:'Share Tech Mono',monospace;font-size:11px;
    color:#8f9a78;line-height:1.75;white-space:pre}
  #readout b{color:#c9b487;font-weight:400}
  .cur{display:inline-block;width:7px;height:11px;background:#b7c48c;vertical-align:-1px;margin-left:4px;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  #hint{position:fixed;z-index:9;left:50%;bottom:68px;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;
    font-size:10px;letter-spacing:1px;color:#5c6549;white-space:nowrap}

  .fc{position:fixed;z-index:5;width:20px;height:20px;border:2px solid #39412c;pointer-events:none}
  .fc.tl{top:10px;left:10px;border-right:none;border-bottom:none}
  .fc.tr{top:10px;right:10px;border-left:none;border-bottom:none}
  .fc.bl{bottom:10px;left:10px;border-right:none;border-top:none}
  .fc.br{bottom:10px;right:10px;border-left:none;border-top:none}

  .lbl{position:fixed;z-index:8;left:0;top:0;display:flex;align-items:center;pointer-events:none;opacity:0;will-change:transform}
  .lbl .dot{width:7px;height:7px;border:1px solid #b7c48c;background:rgba(183,196,140,.25);flex:none}
  .lbl .ln{width:24px;height:1px;background:#6c7657;flex:none}
  .lbl .tx{border:1px solid #3c4530;background:rgba(10,12,8,.85);padding:4px 8px;white-space:nowrap}
  .lbl .tx b{display:block;font-size:9.5px;letter-spacing:1.6px;color:#cfd6b8;font-weight:600}
  .lbl .tx i{display:block;font-style:normal;font-family:'Share Tech Mono',monospace;font-size:9px;color:#7f8a6a;margin-top:1px}

  #loader{position:fixed;inset:0;z-index:100;background:#0f120c;display:flex;align-items:center;justify-content:center;
    font-family:'Black Ops One';letter-spacing:5px;color:#8f9a78;font-size:15px;transition:opacity .5s}
  #loader.off{opacity:0;pointer-events:none}

  @media(max-width:860px){
    .dossier{width:232px;padding:10px 12px}
    .dossier h1{font-size:17px}
    .dossier .rows{grid-template-columns:1fr;font-size:10px}
    .dossier .serial{display:none}
    .control{width:204px}
    #hint{display:none}
    #readout{font-size:10px}
  }
</style>
</head>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PI = Math.PI;
const rand = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const V3 = (x=0,y=0,z=0)=> new THREE.Vector3(x,y,z);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============ RENDERER / SCENE ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f120c);
scene.fog = new THREE.Fog(0x0f120c, 55, 135);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 300);
const HOME_P = V3(13.5, 14.5, 23.5), HOME_T = V3(0, 10.6, 0);
camera.position.set(21, 20, 36);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_T);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 55;
controls.maxPolarAngle = 1.48;
controls.autoRotate = true; controls.autoRotateSpeed = 0.7;

/* ============ LIGHTS ============ */
scene.add(new THREE.HemisphereLight(0x93a07f, 0x1c1a14, 0.55));
const key = new THREE.DirectionalLight(0xfff1da, 2.6);
key.position.set(16, 26, 12); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -18; key.shadow.camera.right = 18;
key.shadow.camera.top = 30;  key.shadow.camera.bottom = -4;
key.shadow.camera.near = 4;  key.shadow.camera.far = 70;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb0a0, 1.3); rim.position.set(-16, 14, -20); scene.add(rim);
const fill = new THREE.DirectionalLight(0xd8b98a, 0.5); fill.position.set(-10, 6, 16); scene.add(fill);

/* ============ CANVAS TEXTURES ============ */
function makeCamo(base, palette, seed, repeat){
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0,0,s,s);
  const r = mulberry32(seed);
  for(let i=0;i<360;i++){
    g.fillStyle = palette[(r()*palette.length)|0];
    g.fillRect((r()*s)|0, (r()*s)|0, 4+((r()*3)|0)*4, 4+((r()*3)|0)*4);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.MirroredRepeatWrapping; tex.repeat.set(repeat, repeat);
  return tex;
}
const texJacket = makeCamo('#5c6a45', ['#4a5738','#6d7a4e','#3c4530','#78684a','#525d3f'], 7, 1.7);
const texPants  = texJacket.clone(); texPants.needsUpdate = true; texPants.repeat.set(2.3, 2.3);
const texHelmet = texJacket.clone(); texHelmet.needsUpdate = true; texHelmet.repeat.set(1.1, 1.1);

function makeFace(){
  const s=128, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  g.fillStyle='#d9a06f'; g.fillRect(0,0,s,s);
  g.fillStyle='rgba(0,0,0,.06)'; g.fillRect(0,0,s,18);
  g.fillStyle='#4a3626'; g.fillRect(30,46,26,8); g.fillRect(72,46,26,8);          // brows
  g.fillStyle='#f2ead8'; g.fillRect(34,58,18,12); g.fillRect(76,58,18,12);        // eyes
  g.fillStyle='#232a30'; g.fillRect(40,60,8,10); g.fillRect(82,60,8,10);
  g.fillStyle='#5a6742'; g.fillRect(6,64,20,28); g.fillRect(102,64,20,28);        // camo paint
  g.fillStyle='#47533a'; g.fillRect(10,72,12,20); g.fillRect(106,72,12,20);
  g.fillRect(52,20,24,10);                                                        // forehead stripe
  g.fillStyle='rgba(0,0,0,.15)'; g.fillRect(58,62,12,18);                         // nose shade
  g.fillStyle='#7a4a3a'; g.fillRect(50,96,28,6);                                  // mouth
  g.fillStyle='rgba(40,30,20,.18)'; g.fillRect(20,88,88,36);                      // stubble
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function makeFlag(){
  const c=document.createElement('canvas'); c.width=64; c.height=40;
  const g=c.getContext('2d');
  g.fillStyle='#3a3d31'; g.fillRect(0,0,64,40);
  g.fillStyle='#8f815d';
  for(let i=0;i<3;i++) g.fillRect(24,6+i*10,34,6);
  g.fillStyle='#2c2f26'; g.fillRect(0,0,24,26);
  g.fillStyle='#8f815d'; g.fillRect(8,9,8,8);
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function makeDeck(){
  const s=512, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  g.fillStyle='#191c15'; g.fillRect(0,0,s,s);
  const r=mulberry32(11);
  for(let i=0;i<900;i++){ g.fillStyle='rgba(0,0,0,'+(0.04+r()*0.05).toFixed(2)+')'; g.fillRect((r()*s)|0,(r()*s)|0,3,3); }
  g.strokeStyle='#3d4531'; g.lineWidth=8; g.beginPath(); g.arc(256,256,206,0,PI*2); g.stroke();
  g.lineWidth=2; g.beginPath(); g.arc(256,256,172,0,PI*2); g.stroke();
  g.strokeStyle='#39412c'; g.lineWidth=3;
  for(let i=0;i<24;i++){ const a=i/24*PI*2;
    g.beginPath(); g.moveTo(256+Math.cos(a)*188,256+Math.sin(a)*188);
    g.lineTo(256+Math.cos(a)*204,256+Math.sin(a)*204); g.stroke(); }
  g.strokeStyle='#6b5a33'; g.lineWidth=10;
  for(let i=0;i<8;i++){ const a=i/8*PI*2+0.2;
    g.beginPath(); g.arc(256,256,238,a,a+0.25); g.stroke(); }
  g.fillStyle='#252b1c'; g.font='900 150px monospace'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('07',256,262);
  g.fillStyle='#39402c'; g.font='16px monospace';
  g.fillText('A R M O R Y   ·   D E C K   0 3',256,120);
  const t=new THREE.CanvasTexture(c); t.anisotropy=8; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

/* ============ MATERIALS ============ */
const std = (o)=> new THREE.MeshStandardMaterial(Object.assign({roughness:.92, metalness:0}, o));
const matCamo   = std({map:texJacket});
const matCamoP  = std({map:texPants, color:0xd8dcc9});
const matHelmet = std({map:texHelmet, color:0xe3e7d5, roughness:.8});
const matSkin   = std({color:0xd9a06f, roughness:.75});
const matFace   = std({map:makeFace(), roughness:.75});
const matHair   = std({color:0x3d2f22});
const matVest   = std({color:0x4a5340});
const matPack   = std({color:0x55604a});
const matShould = std({color:0x454f38});
const matTan    = std({color:0x8f7f5b});
const matOlive  = std({color:0x5a6444});
const matOliveD = std({color:0x3f4734});
const matGear   = std({color:0x262a22});
const matGearD  = std({color:0x1b1e18, roughness:.7});
const matGlove  = std({color:0x23261f});
const matBoot   = std({color:0x2c2924, roughness:.85});
const matSole   = std({color:0x15130f});
const matMetal  = std({color:0x3a3e36, roughness:.5, metalness:.4});
const matMetalD = std({color:0x20231e, roughness:.55, metalness:.45});
const matPoly   = std({color:0x2e322a, roughness:.8});
const matPolyD  = std({color:0x22251e, roughness:.8});
const matFlag   = std({map:makeFlag(), roughness:.85});
const matGlass  = std({color:0x0e1410, metalness:.9, roughness:.15, emissive:0x14231a, emissiveIntensity:.6});
const matGogG   = std({color:0x10160f, metalness:.6, roughness:.25, emissive:0x1c2a18, emissiveIntensity:.5});
const matDot    = new THREE.MeshBasicMaterial({color:0xff4536}); matDot.toneMapped=false;
const matFlash  = new THREE.MeshBasicMaterial({color:0xffc46b, transparent:true, opacity:.95, blending:THREE.AdditiveBlending, depthWrite:false});
const matBrass  = std({color:0xc9a227, roughness:.35, metalness:.85});

/* ============ BUILD HELPERS ============ */
function B(w,h,d,mat,x,y,z,parent,o={}){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  if(o.rx) m.rotation.x=o.rx; if(o.ry) m.rotation.y=o.ry; if(o.rz) m.rotation.z=o.rz;
  m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
function CYL(rt,rb,h,mat,x,y,z,parent,o={}){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,o.seg||12), mat);
  m.position.set(x,y,z); m.rotation.set(o.rx||0,0,o.rz||0);
  m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}

/* ============ ENVIRONMENT ============ */
const floor = new THREE.Mesh(new THREE.CircleGeometry(85,48), std({color:0x0d100a, roughness:1}));
floor.rotation.x = -PI/2; floor.position.y = -0.71; floor.receiveShadow = true; scene.add(floor);

const grid = new THREE.GridHelper(160, 40, 0x2a3120, 0x1a1f14);
grid.position.y = -0.70; grid.material.transparent = true; grid.material.opacity = 0.5; scene.add(grid);

const deckSide = std({color:0x101309});
const deckTop  = std({map:makeDeck(), roughness:.95});
const deck = new THREE.Mesh(new THREE.CylinderGeometry(13,13.7,0.7,64), [deckSide, deckTop, deckSide]);
deck.position.y = -0.35; deck.receiveShadow = true; scene.add(deck);

/* ============ THE SOLDIER ============ */
const charRoot = new THREE.Group(); scene.add(charRoot);
const upper = new THREE.Group(); charRoot.add(upper);

// --- torso block
B(6.8, 7.8, 3.4, matCamo, 0, 13.1, 0, upper);            // jacket
B(4.6, 0.8, 3.6, matGear, 0, 16.75, 0, upper);           // collar
B(7.1, 1.0, 3.9, matGear, 0, 9.95, 0, upper);            // belt
B(0.9, 0.6, 0.25, matTan, 0, 9.95, 1.98, upper);         // buckle

// --- tactical vest
const vestG = new THREE.Group(); upper.add(vestG);
B(7.35, 4.9, 4.05, matVest, 0, 13.7, 0.15, vestG);
[-1.8, 0, 1.8].forEach(x=> B(1.45, 1.7, 0.8, matTan, x, 12.45, 2.42, vestG));   // mag pouches
B(0.65, 4.9, 0.25, matGearD, -2.75, 13.7, 2.2, vestG);                          // straps
B(0.65, 4.9, 0.25, matGearD,  2.75, 13.7, 2.2, vestG);
B(1.3, 2.0, 0.75, matGearD, 2.75, 15.1, 2.35, vestG);                           // radio
B(0.6, 0.5, 0.2, matGear, 2.15, 14.15, 2.75, vestG);                            // PTT
CYL(0.05, 0.05, 3.6, matMetalD, 2.95, 17.7, 2.3, vestG, {rx:-0.12});            // antenna
B(1.7, 1.15, 0.55, matGearD, -2.5, 15.35, 2.3, vestG);                          // admin panel
B(1.15, 1.5, 0.8, matOliveD, -3.1, 10.0, 0.2, vestG);                           // canteen
CYL(0.3, 0.3, 0.6, matOlive, 2.7, 9.55, 1.85, vestG);                           // grenades
CYL(0.3, 0.3, 0.6, matOlive, 3.55, 9.55, 1.15, vestG);
B(0.26, 0.22, 0.26, matMetalD, 2.7, 9.9, 1.85, vestG);
B(0.26, 0.22, 0.26, matMetalD, 3.55, 9.9, 1.15, vestG);

// --- raid pack
const packG = new THREE.Group(); upper.add(packG);
B(4.7, 4.7, 1.9, matPack, 0, 13.5, -2.75, packG);
B(1.6, 1.6, 0.9, matGearD, -1.15, 12.7, -3.85, packG);
B(1.6, 1.6, 0.9, matGearD,  1.15, 12.7, -3.85, packG);
B(0.35, 5.0, 0.3, matGear, -1.5, 13.6, -1.95, packG);
B(0.35, 5.0, 0.3, matGear,  1.5, 13.6, -1.95, packG);
CYL(0.85, 0.85, 4.8, matTan, 0, 16.35, -2.95, packG, {rz:PI/2});                // bedroll

// --- head & helmet
const headPivot = new THREE.Group(); headPivot.position.set(0, 17.0, 0); upper.add(headPivot);
B(1.7, 0.9, 1.7, matGear, 0, 0.4, 0, headPivot);                                 // neck
const headG = new THREE.Group(); headPivot.add(headG);
const headMats = [matSkin, matSkin, matSkin, matSkin, matFace, matHair];         // +x -x +y -y +z -z
B(4.4, 4.4, 4.4, headMats, 0, 3.05, 0, headG);
B(0.35, 1.1, 1.1, matSkin, -2.28, 3.0, 0.1, headG);                              // ears
B(0.35, 1.1, 1.1, matSkin,  2.28, 3.0, 0.1, headG);

/* ============ AUDIO (synthesized) ============ */
const AudioFX = {
  ctx:null, master:null, noise:null, on:true,
  ensure(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.3;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
  },
  shot(){
    if(!this.on || !this.ctx) return;
    const c=this.ctx, t=c.currentTime;
    const n=c.createBufferSource(); n.buffer=this.noise;
    const f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(rand(2800,4200), t);
    f.frequency.exponentialRampToValueAtTime(280, t+0.12);
    const g=c.createGain(); g.gain.setValueAtTime(0.85, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.17);
    n.connect(f); f.connect(g); g.connect(this.master); n.start(t); n.stop(t+0.2);
    const o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(45, t+0.12);
    const g2=c.createGain(); g2.gain.setValueAtTime(0.65, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t+0.15);
    o.connect(g2); g2.connect(this.master); o.start(t); o.stop(t+0.16);
  },
  blip(freq=900, dur=0.045, vol=0.09){
    if(!this.on || !this.ctx) return;
    const c=this.ctx, t=c.currentTime;
    const o=c.createOscillator(); o.type='square'; o.frequency.value=freq;
    const g=c.createGain(); g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.01);
  }
};

const STATES = {
  idle(t){
    const b = Math.sin(t*1.6);
    T.wpn = 0.52 + b*0.025; T.wpnPos = 0;
    T.shL.set(0.1, 0, 0.2);  T.elL = -0.5;
    T.shR.set(0.12 + b*0.01, 0, 0.06); T.elR = -0.3;
    T.head.set(Math.sin(t*0.5)*0.05 + Math.sin(t*0.21)*0.06,
               Math.sin(t*0.3)*0.28 + Math.sin(t*0.11)*0.18, 0);
    T.upper.set(0.02 + b*0.008, Math.sin(t*0.26)*0.05, 0);
    T.legL = 0.02; T.legR = -0.02; T.kneeL = 0.04; T.kneeR = 0.03;
    T.bob = 0.04 + b*0.05; T.sway = 0;
  },
  march(t){
    const w = t*5.4, s = Math.sin(w), c = -s;
    T.legL = s*0.72; T.legR = c*0.72;
    T.kneeL = Math.max(0, Math.sin(w+2.1))*0.8;
    T.kneeR = Math.max(0, Math.sin(w+PI+2.1))*0.8;
    T.shL.set(c*0.5+0.08, 0, 0.16); T.elL = -0.45 - Math.max(0,c)*0.5;
    T.shR.set(0.1 + s*0.06, 0, 0.08); T.elR = -0.3;
    T.wpn = 0.52 + Math.sin(w*2)*0.04; T.wpnPos = Math.sin(w*2)*0.1;
    T.head.set(0.05, s*0.07, 0); T.upper.set(0.08, s*0.1, 0);
    T.bob = Math.abs(Math.cos(w))*0.22; T.sway = s*0.12;
  },
  sprint(t){
    const w = t*9.6, s = Math.sin(w), c = -s;
    T.legL = s*1.02; T.legR = c*1.02;
    T.kneeL = Math.max(0, Math.sin(w+1.9))*1.2;
    T.kneeR = Math.max(0, Math.sin(w+PI+1.9))*1.2;
    T.shL.set(-0.3 + c*0.85, 0, 0.12); T.elL = -1.05 - Math.max(0,c)*0.65;
    T.shR.set(-0.55 + s*0.08, 0, 0.12); T.elR = -1.05;
    T.wpn = 1.52 + Math.sin(w*2)*0.03; T.wpnPos = 0.22;
    T.head.set(-0.16, s*0.09, 0); T.upper.set(0.27, s*0.13, 0);
    T.bob = Math.abs(Math.cos(w))*0.3; T.sway = s*0.18;
  },
  aim(t){
    const b = Math.sin(t*1.6);
    T.shR.set(-1.38, 0, -0.26); T.elR = -0.42;
    T.wpn = 1.84 + b*0.015; T.wpnPos = 0;
    T.shL.set(-1.33, 0, 0.14); T.elL = -0.86;
    T.head.set(0.02, 0.14, 0); T.upper.set(0.03, 0.22, 0);
    T.legL = -0.16; T.legR = 0.2; T.kneeL = 0.1; T.kneeR = 0.22;
    T.bob = 0; T.sway = 0;
  },
  salute(t){
    const b = Math.sin(t*1.8);
    T.shL.set(-2.9 + b*0.02, 0, 0.4); T.elL = -0.55;
    T.shR.set(0.14, 0, 0.08); T.elR = -0.35;
    T.wpn = 0.56; T.wpnPos = 0;
    T.head.set(0.06, -0.2, 0.09); T.upper.set(0.01, 0.1, 0);
    T.legL = 0.02; T.legR = -0.02; T.kneeL = 0.04; T.kneeR = 0.03;
    T.bob = 0.02; T.sway = 0;
  }
};

function fire(){
  if(curE > 0.03) return;
  flash.visible = true; flashT = 0.075;
  flash.scale.set(rand(0.75,1.3), rand(0.75,1.3), rand(0.7,1.4));
  flash.rotation.set(rand(-0.25,0.25), rand(-0.25,0.25), 0);
  mlight.intensity = 34;
  recoil = 1;
  // tracer
  const tr = tracers.find(o=>o.life<=0) || tracers[0];
  muzzleAnchor.getWorldPosition(_v1); muzzleAnchor.getWorldQuaternion(_q);
  _v2.set(0,0,1).applyQuaternion(_q);
  tr.m.position.copy(_v1).addScaledVector(_v2, 5.5);
  tr.m.quaternion.setFromUnitVectors(_v3.set(0,0,1), _v2);
  tr.m.scale.set(1,1,rand(6,9)); tr.m.visible = true; tr.m.material.opacity = 0.9; tr.life = 0.11;
  // shell
  const sh = shells.find(o=>o.life<=0) || shells[0];
  ejectAnchor.getWorldPosition(_v1); ejectAnchor.getWorldQuaternion(_q);
  _v2.set(1,0,0).applyQuaternion(_q);
  sh.m.position.copy(_v1);
  sh.v.copy(_v2).multiplyScalar(rand(3.5,5.5)); sh.v.y += rand(2.5,4);
  sh.av.set(rand(-12,12), rand(-12,12), rand(-12,12));
  sh.m.visible = true; sh.m.material.opacity = 1; sh.life = 1.3;
  AudioFX.shot();
  tFire = Math.random() < 0.3 ? 0.16 : rand(0.8, 2.1);
}

/* ============ MAIN LOOP ============ */
const clock = new THREE.Clock();
let firstFrame = true;
const loader = document.getElementById('loader');

renderer.setAnimationLoop(()=>{
  const dt = Math.min(clock.getDelta(), 0.05);
  tAnim += dt;

  // camera intro / reset tween
  if(tween){
    camera.position.lerp(HOME_P, 0.055);
    controls.target.lerp(HOME_T, 0.055);
    if(camera.position.distanceTo(HOME_P) < 0.05) tween = 0;
  }

  // pose targets → smooth apply
  STATES[state](tAnim, T);
  const k = 1 - Math.exp(-dt*7.5);
  cur.shL.lerp(T.shL,k); cur.shR.lerp(T.shR,k);
  cur.head.lerp(T.head,k); cur.upper.lerp(T.upper,k);
  for(const p of ['elL','elR','wpn','wpnPos','legL','legR','kneeL','kneeR','bob','sway'])
    cur[p] += (T[p]-cur[p])*k;

  armL.pivot.rotation.set(cur.shL.x, cur.shL.y, cur.shL.z);
  armL.elbow.rotation.x = cur.elL;
  armR.pivot.rotation.set(cur.shR.x, cur.shR.y, cur.shR.z);
  armR.elbow.rotation.x = cur.elR;
  headPivot.rotation.set(cur.head.x, cur.head.y, cur.head.z);
  upper.rotation.set(cur.upper.x, cur.upper.y, cur.upper.z);
  upper.position.y = cur.bob; upper.position.x = cur.sway;
  legL.pivot.rotation.x = cur.legL; legL.knee.rotation.x = cur.kneeL;
  legR.pivot.rotation.x = cur.legR; legR.knee.rotation.x = cur.kneeR;

  recoil *= Math.exp(-dt*6.5);
  weaponPivot.rotation.x = cur.wpn - recoil*0.26;
  weaponPivot.position.z = -recoil*0.55;

  // fire control
  if(state === 'aim' && curE < 0.03){ tFire -= dt; if(tFire <= 0) fire(); }
  flashT -= dt; if(flashT <= 0) flash.visible = false;
  mlight.intensity *= Math.exp(-dt*20);

  // tracers
  for(const t of tracers){
    if(t.life > 0){ t.life -= dt; t.m.material.opacity = Math.max(0, t.life/0.11)*0.9; if(t.life<=0) t.m.visible=false; }
  }
  // shells
  for(const s of shells){
    if(s.life > 0){
      s.v.y -= 24*dt;
      s.m.position.addScaledVector(s.v, dt);
      s.m.rotation.x += s.av.x*dt; s.m.rotation.y += s.av.y*dt; s.m.rotation.z += s.av.z*dt;
      if(s.m.position.y < 0.18 && s.v.y < 0){ s.v.y *= -0.35; s.v.x *= 0.6; s.v.z *= 0.6; s.m.position.y = 0.18; }
      s.life -= dt; s.m.material.opacity = Math.min(1, s.life/0.4);
      if(s.life <= 0) s.m.visible = false;
    }
  }

  // exploded view
  curE += (targetE - curE)*(1 - Math.exp(-dt*6));
  if(Math.abs(curE - targetE) < 0.001) curE = targetE;
  for(const p of EX){
    p.obj.position.copy(p.base).addScaledVector(p.dir, curE);
    if(p.rot) p.obj.rotation.set(p.rot[0]*curE, p.rot[1]*curE, p.rot[2]*curE);
  }

  // labels
  const show = schematic || curE > 0.1;
  for(const L of LABELS){
    if(!show){ L.el.style.opacity = 0; continue; }
    L.a.getWorldPosition(_v1); _v1.project(camera);
    if(_v1.z > 1){ L.el.style.opacity = 0; continue; }
    const x = (_v1.x*0.5+0.5)*innerWidth, y = (-_v1.y*0.5+0.5)*innerHeight;
    L.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    L.el.style.opacity = schematic ? 0.95 : Math.min(1, (curE-0.1)/0.25)*0.95;
  }

  // readout
  const az = controls.getAzimuthalAngle();
  const dist = camera.position.distanceTo(controls.target);
  readout.innerHTML =
    `STATE    <b>${state.toUpperCase()}</b>\n` +
    `AZIMUTH  <b>${fmtAz(az)}°</b>   RANGE <b>${dist.toFixed(1)}M</b>\n` +
    `SYS      <b>${STATUS[state]}</b><span class="cur"></span>`;

  controls.update();
  renderer.render(scene, camera);

  if(firstFrame){ firstFrame = false; loader.classList.add('off'); }
});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
