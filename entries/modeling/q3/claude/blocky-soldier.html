<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blocky Soldier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --panel: rgba(20,24,18,.78);
    --panel-line: rgba(255,255,255,.10);
    --ink: #eef1e4;
    --muted: #a7b096;
    --accent: #c8d66a;
    --accent-ink: #1b2010;
    --btn: rgba(255,255,255,.06);
    --btn-hover: rgba(255,255,255,.12);
    --sky-a: #7fbaf0; --sky-b: #cfe6fb; --sky-c: #f4e7cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family: Inter, system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 55%,var(--sky-c) 100%);
    transition: background .8s;
  }
  body.night{ --sky-a:#05080f; --sky-b:#111a2e; --sky-c:#28304a; }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;outline:none}
  .panel{
    position:fixed; top:16px; left:16px; width:280px; max-height:calc(100% - 32px); overflow:auto;
    background:var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border:1px solid var(--panel-line); border-radius:14px; padding:14px 14px 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .panel header{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .badge{width:36px;height:36px;border-radius:8px;flex:none;
    background:
      linear-gradient(45deg,#4b5a2e 25%,transparent 25%) 0 0/12px 12px,
      linear-gradient(-45deg,#3c3022 25%,transparent 25%) 0 0/12px 12px,
      #6d7b47; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35);}
  h1{font-family:Silkscreen, monospace; font-size:18px; margin:0; letter-spacing:.5px; font-weight:700}
  .sub{margin:2px 0 0;font-size:11px;color:var(--muted)}
  .collapse{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px;border-radius:6px}
  .collapse:hover{background:var(--btn-hover);color:var(--ink)}
  .panel.collapsed section{display:none}
  .panel.collapsed header{margin-bottom:0}
  section{padding:10px 0;border-top:1px solid var(--panel-line)}
  h2{font-family:Silkscreen, monospace;font-size:11px;font-weight:400;color:var(--muted);margin:0 0 8px;letter-spacing:1px;text-transform:uppercase}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  button.b{
    flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font: 500 12px Inter, system-ui, sans-serif; color:var(--ink);
    background:var(--btn); border:1px solid var(--panel-line); border-radius:8px; padding:7px 8px; cursor:pointer;
    transition: background .15s, transform .05s;
  }
  button.b:hover{background:var(--btn-hover)}
  button.b:active{transform:translateY(1px)}
  button.b.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  button.b.fire{background:#b8432f;border-color:transparent}
  button.b.fire:hover{background:#cf5038}
  kbd{font:10px/1 Silkscreen, monospace;opacity:.65;border:1px solid currentColor;border-radius:4px;padding:2px 3px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{width:40px;height:40px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0;position:relative;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.3)}
  .chip.on{border-color:var(--accent)}
  .chip span{position:absolute;left:0;right:0;bottom:-15px;font-size:9px;color:var(--muted);text-align:center;white-space:nowrap}
  .chips{padding-bottom:14px}
  .skin{width:28px;height:28px;border-radius:50%}
  .skin span{display:none}
  .chips.skins{padding-bottom:0}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:12px;color:var(--ink);background:rgba(15,18,14,.6);backdrop-filter:blur(6px);
    padding:7px 12px;border-radius:999px;white-space:nowrap;border:1px solid var(--panel-line)}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-family:Silkscreen,monospace;color:#1d2a12;font-size:16px}
  @media (max-width: 640px){
    .panel{top:auto;bottom:16px;left:16px;right:16px;width:auto;max-height:52vh}
    .hint{display:none}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">Deploying soldier…</div>

<aside class="panel" id="panel">
  <header>
    <div class="badge" aria-hidden="true"></div>
    <div>
      <h1>Blocky Soldier</h1>
      <p class="sub">SGT. BLOCK · 3rd Voxel Infantry</p>
    </div>
    <button class="collapse" id="collapse" title="Collapse panel" aria-label="Collapse panel">–</button>
  </header>
  <section>
    <h2>Pose</h2>
    <div class="row" id="poses">
      <button class="b on" data-pose="ready">Ready <kbd>1</kbd></button>
      <button class="b" data-pose="aim">Aim <kbd>2</kbd></button>
      <button class="b" data-pose="salute">Salute <kbd>3</kbd></button>
    </div>
  </section>
  <section>
    <h2>Action</h2>
    <div class="row">
      <button class="b fire" id="fire">Fire <kbd>Space</kbd></button>
      <button class="b" id="patrol">Patrol <kbd>P</kbd></button>
    </div>
  </section>
  <section>
    <h2>Camo</h2>
    <div class="chips" id="camo"></div>
  </section>
  <section>
    <h2>Skin tone</h2>
    <div class="chips skins" id="skins"></div>
  </section>
  <section>
    <h2>Scene</h2>
    <div class="row">
      <button class="b" id="night">Night <kbd>N</kbd></button>
      <button class="b" id="light">Torch <kbd>F</kbd></button>
      <button class="b" id="spin">Spin <kbd>R</kbd></button>
      <button class="b on" id="sound">Sound <kbd>M</kbd></button>
    </div>
  </section>
</aside>
<div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan · <kbd>C</kbd> reset view</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V3 = THREE.Vector3;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(2024);

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 300);
const CAM_HOME = new V3(5.6, 3.4, 7.8), TARGET_HOME = new V3(0, 1.75, 0);
camera.position.copy(CAM_HOME);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET_HOME);
controls.enableDamping = true;
controls.minDistance = 2.2; controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotateSpeed = 1.4;

const hemi = new THREE.HemisphereLight(0xd6ecff, 0x6b5a3c, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d4, 2.7);
sun.position.set(6, 11, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-8, right:8, top:8, bottom:-8, near:1, far:30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.025;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xa9c8ff, 0.7);
fill.position.set(-6, 4, -5);
scene.add(fill);

/* ---------------- texture helpers ---------------- */
function cnv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function toTex(c, repeat=true){
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestMipmapLinearFilter;

  t.anisotropy = renderer.capabilities.getMaxAnisotropy();

}
function drawPix(c, rows, pal){
  const g = c.getContext('2d'); g.clearRect(0,0,c.width,c.height);
  rows.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if (ch==='.') return; g.fillStyle = pal[ch]; g.fillRect(x,y,1,1);
  }));
}
function noiseCanvas(n, lo, hi, seed, speck=0, tint=[1,1,1]){
  const c = cnv(n,n), g = c.getContext('2d'), img = g.createImageData(n,n), r = mulberry32(seed);
  for (let i=0;i<n*n;i++){
    let v = lo + r()*(hi-lo); if (r()<speck) v *= 0.82;
    img.data[i*4]=v*tint[0]; img.data[i*4+1]=v*tint[1]; img.data[i*4+2]=v*tint[2]; img.data[i*4+3]=255;
  }
  g.putImageData(img,0,0); return c;
}
function paintNoise(g, n, amt, r){
  const img = g.getImageData(0,0,n,n);
  for (let i=0;i<img.data.length;i+=4){ const d=(r()-.5)*amt; img.data[i]+=d; img.data[i+1]+=d; img.data[i+2]+=d; }
  g.putImageData(img,0,0);
}
const noiseTex = toTex(noiseCanvas(16, 208, 255, 11, 0.1));

// tiny 3x5 pixel font for stencils & name tape
const FONT = {
  B:['110','101','110','101','110'], L:['100','100','100','100','111'], O:['111','101','101','101','111'],
  C:['111','100','100','100','111'], K:['101','101','110','101','101'], A:['010','101','111','101','101'],
  M:['101','111','111','101','101'], '7':['111','001','010','010','010'], '.':['000','000','000','000','010'],
  '6':['111','100','111','101','111'], '2':['111','001','111','100','111'], ' ':['000','000','000','000','000'],
};
function pixText(g, s, x, y, col){
  g.fillStyle = col;
  [...s].forEach((ch,i)=>FONT[ch].forEach((row,ry)=>[...row].forEach((b,rx)=>{ if(b==='1') g.fillRect(x+i*4+rx, y+ry, 1, 1); })));
}

/* ---------------- camo ---------------- */
const THEMES = {
  woodland:{ name:'Woodland', base:'#6d7b47', layers:['#4b5a2e','#3c3022','#1e2019'],
    vest:'#596037', pouch:'#4c5330', strap:'#363a24', boot:'#3b2b1f', glove:'#2c2c27', furn:'#1d1f20', knee:'#3c4128', pack:'#56603a', helmet:'#4f5a33' },
  desert:{ name:'Desert', base:'#cdb88f', layers:['#a99270','#8b7353','#e3d5b0'],
    vest:'#b09a6e', pouch:'#a28a60', strap:'#857049', boot:'#b4976a', glove:'#a2875c', furn:'#ad946a', knee:'#958060', pack:'#a99167', helmet:'#b8a274' },
  arctic:{ name:'Arctic', base:'#e9ecef', layers:['#c4cbd1','#9aa3ab','#ffffff'],
    vest:'#dadee2', pouch:'#cdd2d7', strap:'#a5adb4', boot:'#dfe3e6', glove:'#d0d5d9', furn:'#e4e7e9', knee:'#b6bdc3', pack:'#d3d7db', helmet:'#e3e6e9' },
  urban:{ name:'Urban', base:'#8d9297', layers:['#62686e','#3f444a','#babec1'],
    vest:'#30353b', pouch:'#2a2f34', strap:'#1f2328', boot:'#1b1c1e', glove:'#202226', furn:'#1b1d1f', knee:'#26292d', pack:'#3a3f45', helmet:'#3b4046' },
};
function drawCamo(c, th, seed){
  const N = c.width, g = c.getContext('2d'), r = mulberry32(seed);
  g.fillStyle = th.base; g.fillRect(0,0,N,N);
  th.layers.forEach((col,li)=>{
    g.fillStyle = col;
    const blobs = [9,8,6][li] ?? 6;
    for (let b=0;b<blobs;b++){
      let x = Math.floor(r()*N), y = Math.floor(r()*N);
      const len = 26 + Math.floor(r()*34) - li*8;
      for (let s=0;s<len;s++){
        const sz = r()<.55 ? 2 : 1;
        for (let dx=0;dx<sz;dx++) for (let dy=0;dy<sz;dy++) g.fillRect((x+dx)%N, (y+dy)%N, 1, 1);
        const d = Math.floor(r()*4);
        x = (x + (d===0) - (d===1) + N) % N; y = (y + (d===2) - (d===3) + N) % N;
      }
    }
  });
  paintNoise(g, N, 12, r);
}
const camoTopC = cnv(32,32), camoBotC = cnv(32,32), camoHelmC = cnv(32,32);
const camoTopT = toTex(camoTopC), camoBotT = toTex(camoBotC), camoHelmT = toTex(camoHelmC);

/* ---------------- materials ---------------- */
function M(color, o={}){
  const map = o.map === undefined ? noiseTex : o.map;
  const m = new THREE.MeshStandardMaterial({
    color, map, roughness:o.rough ?? 0.88, metalness:o.metal ?? 0,
    emissive:o.emissive ?? 0x000000, emissiveIntensity:o.ei ?? 1,
    transparent:!!o.transparent, alphaTest:o.alphaTest ?? 0,
  });
  m.userData.tiled = !!map && o.tiled !== false;
  m.userData.rep = o.rep ?? (map === noiseTex ? 0.8 : 1.6);
  return m;
}
const mats = {
  shirt: M(0xffffff,{map:camoTopT, rep:1.6}),
  pants: M(0xffffff,{map:camoBotT, rep:1.6}),
  helmet: M(0xffffff,{map:camoHelmT, rep:1.6}),
  vest: M('#596037'), pouch: M('#4c5330'), pouchDark: M('#3d4327'), strap: M('#363a24'),
  pack: M('#56603a'), packDark: M('#444c2d'), bedroll: M('#3f4a2e'),
  belt: M('#2a2b24'), buckle: M('#8b8e90',{rough:.35, metal:.8}),
  boot: M('#3b2b1f'), sole: M('#17140f'), glove: M('#2c2c27'), gloveDark: M('#1f1f1b'),
  knee: M('#3c4128'), skin: M('#e0ab86'),
  black: M('#1b1c1d',{rough:.6}), metal: M('#2a2c2e',{rough:.45, metal:.6}), metalLight: M('#5a5e63',{rough:.4, metal:.7}),
  furn: M('#1d1f20',{rough:.6, metal:.1}), rubber: M('#151515',{rough:.95}),
  lens: M('#7fd3ff',{map:null, rough:.1, metal:.3, emissive:0x1e6c8f, ei:.6}),
  goggleLens: M('#f2a33a',{map:null, rough:.15, metal:.2, emissive:0x7a3f05, ei:.5}),
  torchLens: M('#fff6d8',{map:null, rough:.2, emissive:0x000000}),
  radio: M('#2f3326'), headset: M('#2b2e25'), brass: M('#d2a243',{map:null, rough:.3, metal:.85}),
  tag: M('#c4c8cc',{map:null, rough:.3, metal:.9}), grenade: M('#4a5530'), canteen: M('#3e4a2c'),
  shovel: M('#6d7176',{rough:.5, metal:.6}), wood: M('#6b4a2c'), holster: M('#26271f'),
  watchFace: M('#9ff7c8',{map:null, emissive:0x2a9a6a, ei:.8}),
};

/* ---------------- geometry helpers ---------------- */
const uvR = mulberry32(99);
function scaleUV(geo, w,h,d, rep){
  const uv = geo.attributes.uv, dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for (let f=0; f<6; f++){
    const [a,b] = dims[f], ox = Math.floor(uvR()*32)/32, oy = Math.floor(uvR()*32)/32;
    for (let i=0;i<4;i++){ const k=f*4+i; uv.setXY(k, uv.getX(k)*a/rep + ox, uv.getY(k)*b/rep + oy); }
  }
  uv.needsUpdate = true;
}
function B(parent, w,h,d, x,y,z, m, rot){
  const geo = new THREE.BoxGeometry(w,h,d);
  if (!Array.isArray(m) && m.userData.tiled) scaleUV(geo,w,h,d,m.userData.rep);
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x,y,z);
  if (rot) mesh.rotation.set(rot[0],rot[1],rot[2]);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}
function decalMat(tex, transparent=false){
  return new THREE.MeshStandardMaterial({ map:tex, roughness:.9, transparent, alphaTest: transparent ? .5 : 0,
    polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 });
}
function P(parent, w,h, m, x,y,z, ry=0){
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h), m);
  mesh.position.set(x,y,z); mesh.rotation.y = ry; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}

/* ---------------- pixel decals ---------------- */
const nameC = cnv(24,7); { const g=nameC.getContext('2d'); g.fillStyle='#5b6340'; g.fillRect(0,0,24,7); pixText(g,'BLOCK',2,1,'#141510'); }
const nameT = toTex(nameC,false);
const patchC = cnv(12,12);
drawPix(patchC,[
  'KKKKKKKKKKKK','KGGGGGGGGGGK','KGGGGYYGGGGK','KGGGGYYGGGGK','KGYYYYYYYYGK','KGGYYYYYYGGK',
  'KGGGYYYYGGGK','KGGYYGGYYGGK','KGYYGGGGYYGK','KGGGGGGGGGGK','KGGGGGGGGGGK','KKKKKKKKKKKK'],
  {K:'#1c1d16', G:'#4e5a33', Y:'#e1c55a'});
const chevC = cnv(10,11);
drawPix(chevC,[
  'DDDDDDDDDD','DDDDYYDDDD','DDYYDDYYDD','YYDDDDDDYY','DDDDYYDDDD','DDYYDDYYDD',
  'YYDDDDDDYY','DDDDYYDDDD','DDYYDDYYDD','YYDDDDDDYY','DDDDDDDDDD'], {D:'#2b2f22', Y:'#d8c25e'});
const laceC = cnv(4,6);
drawPix(laceC,['L..L','.LL.','L..L','.LL.','L..L','.LL.'], {L:'#c9b48a'});
const patchM = decalMat(toTex(patchC,false)), chevM = decalMat(toTex(chevC,false));
const laceM = decalMat(toTex(laceC,false), true), nameM = decalMat(nameT);

/* ---------------- head textures ---------------- */
const SKINS = [
  { s:'#e8b896', S:'#d39e7a', h:'#c08a68', t:'#a98266', r:'#3a2a1d' },
  { s:'#c98d60', S:'#b27a50', h:'#9e6b45', t:'#86603f', r:'#22180f' },
  { s:'#8e5b3c', S:'#7a4c31', h:'#694028', t:'#563826', r:'#140e09' },
  { s:'#f2d2b8', S:'#ddb79a', h:'#cfa488', t:'#b89a84', r:'#8a5a2b' },
];
let skin = SKINS[0];
const FACE = [
  'ssssssssssssssss',
  'ssssssssssssssss',
  'ssssssssssssssss',
  'ssssssssssssssss',
  'sbbbbssssssbbbbs',
  'ssssssssssssssss',
  'swwppssssssppwws',
  'swwppssssssppwws',
  'kgkgksshhskgkgkg',
  'ssssssshhsssssss',
  'sssssshhhhssssss',
  'ssssssssssssssss',
  'ssttmmmmmmmmttss',
  'sstttMMMMMMtttss',
  'ssttttttttttttss',
  'sssttttttttttsss',
];
const SIDE = [
  'rrrrrrrrrrrrrrrr','rrrrrrrrrrrrrrrr','rrrrrrrrrrrrrrrr','rrrrrrrrrrrrrrrr',
  'sssrrrrrrrrrrrrr','sssssrrrrrrrrrrr','ssssssrSSSsrrrrr','ssssssrSEESsrrrr',
  'sssssssSEESsrrrr','sssssssSEESssrrr','sssssssSSSsssrrr','sssssssssssssssr',
  'tsssssssssssssss','ttssssssssssssss','tttsssssssssssss','ttttssssssssssss',
];
const BACK = Array.from({length:16},(_,y)=> y<11 ? 'rrrrrrrrrrrrrrrr' : y===11 ? 'rsrrsrrrsrrsrrsr' : 'ssssssssssssssss');
const TOP = Array.from({length:16},()=> 'rrrrrrrrrrrrrrrr');
const BOTTOM = Array.from({length:16},()=> 'ssssssssssssssss');
const headC = { face:cnv(16,16), sideL:cnv(16,16), sideR:cnv(16,16), back:cnv(16,16), top:cnv(16,16), bottom:cnv(16,16) };
const headT = Object.fromEntries(Object.entries(headC).map(([k,c])=>[k,toTex(c,false)]));
function facePal(){
  return { s:skin.s, S:skin.S, h:skin.h, t:skin.t, r:skin.r, E:skin.h,
           w:'#f3f3ef', p:'#2f4a69', b:'#2c2018', m:'#7a3d31', M:'#5a2a22', g:'#3d4a2a', k:'#1d2316', l:'#3a2a20' };
}
let eyeState = '';
function drawFace(closeR, closeL){
  const key = `${skin.s}${closeR}${closeL}`; if (key===eyeState) return; eyeState = key;
  const rows = FACE.slice();
  // texture cols 1-4 = soldier's right eye, 11-14 = left eye
  const lid = (row, from, to, ch) => row.slice(0,from) + ch.repeat(to-from) + row.slice(to);
  if (closeR){ rows[6] = lid(rows[6],1,5,'s'); rows[7] = lid(rows[7],1,5,'l'); }
  if (closeL){ rows[6] = lid(rows[6],11,15,'s'); rows[7] = lid(rows[7],11,15,'l'); }
  drawPix(headC.face, rows, facePal()); headT.face.needsUpdate = true;
}
function drawHead(){
  const pal = facePal();
  drawPix(headC.sideL, SIDE, pal);

/* ---------------- two-bone IK ---------------- */
const DOWN = new V3(0,-1,0);
const _u=new V3(), _v=new V3(), _e=new V3(), _E=new V3(), _H=new V3(), _S=new V3(), _qU=new THREE.Quaternion(), _qF=new THREE.Quaternion();
function solveArm(arm, target, pole){
  const reach = arm.L1 + arm.L2;
  _S.copy(arm.base);
  _u.subVectors(target, _S);
  const excess = THREE.MathUtils.clamp(_u.length() - reach*0.97, 0, 0.16);   // shoulder protraction
  _S.addScaledVector(_u.normalize(), excess);
  arm.shoulder.position.copy(_S);
  _u.subVectors(target, _S);
  const dist = THREE.MathUtils.clamp(_u.length(), 0.2, reach*0.999);
  _u.normalize();
  const a = Math.acos(THREE.MathUtils.clamp((arm.L1*arm.L1 + dist*dist - arm.L2*arm.L2)/(2*arm.L1*dist), -1, 1));
  _v.copy(pole).addScaledVector(_u, -pole.dot(_u)).normalize();
  _e.copy(_u).multiplyScalar(Math.cos(a)).addScaledVector(_v, Math.sin(a));
  _E.copy(_S).addScaledVector(_e, arm.L1);
  _H.copy(_S).addScaledVector(_u, dist).sub(_E).normalize();
  _qU.setFromUnitVectors(DOWN, _e);
  _qF.setFromUnitVectors(DOWN, _H);
  arm.upper.quaternion.copy(_qU);
  arm.fore.quaternion.copy(_qU).invert().multiply(_qF);
}

    const c = new THREE.Group(); c.position.y = y; c.rotation.y = ry; c.scale.setScalar(s); crate.add(c);
    B(c, 0.9,0.5,0.55, 0,0.25,0, olive);
    for (const sx of [-1,1]){ B(c, 0.06,0.52,0.57, sx*0.42,0.25,0, edge); }
    B(c, 0.92,0.06,0.57, 0,0.5,0, edge);
    B(c, 0.14,0.05,0.04, 0,0.38,0.29, hinge);
    P(c, 0.5,0.32, stM, 0,0.24,0.276);
    return c;
  }
  crateAt(0,1,0); crateAt(0.5,0.8,0.3);
}
// jerry can
{
  const jc = new THREE.Group(); jc.position.set(-2.3,0,3.0); jc.rotation.y = 0.5; scene.add(jc);
  const g = M('#4b5532');

  }
  for (const x of [-0.12,0,0.12]) B(jc, 0.04,0.08,0.18, x,0.66,0, g);

// tree
{

// grass tufts & flowers (instanced)
{
  const r = mulberry32(77), blades = [], blooms = [];
  const avoid = [[0,0,1.1],[3.4,1.9,0.9],[-2.3,3,0.6],[-4.3,0.6,1.2]];
  for (let n=0; n<70; n++){
    const a = r()*Math.PI*2, d = Math.sqrt(r())*(ISLAND_R-1.2), x = Math.cos(a)*d, z = Math.sin(a)*d;
    if (avoid.some(([ax,az,ar])=>Math.hypot(x-ax,z-az)<ar)) continue;
    if (Math.hypot(x,z) > 3.9 && Math.hypot(x,z) < 4.8 && z < 0) continue;
    const flower = r()<0.18;
    for (let b=0;b<(flower?1:3);b++) blades.push([x+(r()-.5)*.15, z+(r()-.5)*.15, 0.12+r()*0.16]);
    if (flower) blooms.push([x, z, r()<.5 ? '#e8524a' : '#f2d04b']);
  }
  const bg = new THREE.BoxGeometry(0.05,1,0.05), bm = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1 });
  const im = new THREE.InstancedMesh(bg, bm, blades.length), m4 = new THREE.Matrix4(), c = new THREE.Color();
  blades.forEach(([x,z,h],i)=>{ m4.compose(new V3(x,h/2,z), new THREE.Quaternion().setFromEuler(new THREE.Euler((r()-.5)*.4,0,(r()-.5)*.4)), new V3(1,h,1)); im.setMatrixAt(i,m4); im.setColorAt(i,c.set(r()<.5?'#5d9a3a':'#4b852f')); });
  im.castShadow = true; scene.add(im);
  const fg = new THREE.BoxGeometry(0.11,0.11,0.11), fi = new THREE.InstancedMesh(fg, bm, blooms.length);
  blooms.forEach(([x,z,col],i)=>{ m4.makeTranslation(x,0.3,z); fi.setMatrixAt(i,m4); fi.setColorAt(i,c.set(col)); });
  scene.add(fi);
}

{

// stars
const stars = (() => {
  const r = mulberry32(3), pos = [];
  for (let i=0;i<700;i++){ const u=r()*Math.PI*2, v=Math.acos(r()*0.95); pos.push(90*Math.sin(v)*Math.cos(u), 90*Math.cos(v), 90*Math.sin(v)*Math.sin(u)); }

/* ---------------- effects: shells & smoke ---------------- */
const shells = [], smokes = [];
const shellGeo = new THREE.BoxGeometry(0.035,0.035,0.09), smokeGeo = new THREE.BoxGeometry(1,1,1);
const _wq = new THREE.Quaternion();
function spawnShell(){
  const m = new THREE.Mesh(shellGeo, mats.brass); m.castShadow = true;
  rifle.localToWorld(m.position.copy(EJECT));
  rifle.getWorldQuaternion(_wq);
  const v = new V3(-1, 0.7, -0.25).applyQuaternion(_wq).multiplyScalar(2.2 + Math.random());
  m.userData = { v, spin:new V3(Math.random()*20, Math.random()*20, Math.random()*20), rest:false };
  scene.add(m); shells.push(m);
  if (shells.length > 60) scene.remove(shells.shift());
}
function spawnSmoke(){
  const mat = new THREE.MeshStandardMaterial({ color:0xd8d8d8, transparent:true, opacity:.5, roughness:1, depthWrite:false });
  const m = new THREE.Mesh(smokeGeo, mat);
  rifle.localToWorld(m.position.copy(MUZZLE));
  rifle.getWorldQuaternion(_wq);
  const v = new V3((Math.random()-.5)*0.3, 0.35+Math.random()*0.3, 0.6+Math.random()*0.4).applyQuaternion(_wq);
  v.y = Math.abs(v.y) + 0.2;
  m.userData = { v, life:0, s:0.08+Math.random()*0.06 };
  m.rotation.set(Math.random()*3, Math.random()*3, 0);
  scene.add(m); smokes.push(m);
}

/* ---------------- sound ---------------- */
let actx = null, soundOn = true;
function shotSound(){
  if (!soundOn) return;
  try {
    actx ??= new AudioContext();
    const len = Math.floor(actx.sampleRate*0.32), buf = actx.createBuffer(1,len,actx.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++){ const t=i/len; d[i] = (Math.random()*2-1) * Math.pow(1-t, 5) * (t<0.01 ? 1.6 : 1); }
    const src = actx.createBufferSource(); src.buffer = buf;
    const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1400;
    const g = actx.createGain(); g.gain.value = 0.28;
    src.connect(f).connect(g).connect(actx.destination); src.start();
  } catch(e){}
}

/* ---------------- state / controls ---------------- */
let patrol = false, walkW = 0, phase = 0, heading = 0;
let recoil = 0, flashT = 0, burst = 0, nextShot = 0;
let aimW = 0, saluteW = 0, nextBlink = 2, blinkEnd = 0;
let night = false, torchOn = false, theme = 'woodland';
const clock = new THREE.Clock();

function setPose(p){
  pose = p;
  document.querySelectorAll('#poses button').forEach(b=>b.classList.toggle('on', b.dataset.pose===p));
}
function fire(){
  const t = clock.elapsedTime;
  if (pose !== 'aim'){ setPose('aim'); nextShot = t + 0.5; } else nextShot = Math.max(nextShot, t);
  burst = 3;
}
function shoot(){
  recoil = 1; flashT = 0.055; flash.visible = true;
  flash.rotation.z = Math.random()*Math.PI; flash.scale.setScalar(0.8+Math.random()*0.5);
  muzzleLight.intensity = 25;
  spawnShell(); spawnSmoke(); spawnSmoke(); shotSound();
}
function setTheme(name){
  theme = name; const th = THEMES[name];
  drawCamo(camoTopC, th, 101); drawCamo(camoBotC, th, 202); drawCamo(camoHelmC, th, 303);
  camoTopT.needsUpdate = camoBotT.needsUpdate = camoHelmT.needsUpdate = true;
  mats.helmet.color.set(0xffffff);
  mats.vest.color.set(th.vest); mats.pouch.color.set(th.pouch); mats.pouchDark.color.set(th.strap);
  mats.strap.color.set(th.strap); mats.boot.color.set(th.boot); mats.glove.color.set(th.glove);
  mats.furn.color.set(th.furn); mats.knee.color.set(th.knee); mats.pack.color.set(th.pack);
  mats.packDark.color.set(th.strap); mats.bedroll.color.set(th.knee); mats.headset.color.set(th.strap);
  mats.radio.color.set(th.strap); mats.holster.color.set(th.strap);
  document.querySelectorAll('#camo .chip').forEach(c=>c.classList.toggle('on', c.dataset.k===name));
}
function setSkin(i){
  skin = SKINS[i]; drawHead();
  document.querySelectorAll('#skins .chip').forEach((c,n)=>c.classList.toggle('on', n===i));
}
function setNight(on){
  night = on; document.body.classList.toggle('night', on);
  document.getElementById('night').classList.toggle('on', on);
  if (on !== torchOn) setTorch(on);
}
function setTorch(on){
  torchOn = on; document.getElementById('light').classList.toggle('on', on);
  mats.torchLens.emissive.set(on ? 0xfff3c8 : 0x000000);
}
function togglePatrol(){ patrol = !patrol; document.getElementById('patrol').classList.toggle('on', patrol); }
function toggleSpin(){ controls.autoRotate = !controls.autoRotate; document.getElementById('spin').classList.toggle('on', controls.autoRotate); }
function toggleSound(){ soundOn = !soundOn; document.getElementById('sound').classList.toggle('on', soundOn); }
function resetView(){ camera.position.copy(soldier.position).add(CAM_HOME); controls.target.copy(soldier.position).add(TARGET_HOME); }

// UI wiring
const camoEl = document.getElementById('camo');
for (const [k,th] of Object.entries(THEMES)){
  const b = document.createElement('button'); b.className='chip'; b.dataset.k=k; b.title=th.name;
  b.style.background = `linear-gradient(135deg, ${th.layers[0]} 0 25%, ${th.base} 25% 50%, ${th.layers[1]} 50% 70%, ${th.layers[2]} 70%)`;
  b.innerHTML = `<span>${th.name}</span>`; b.onclick = ()=>setTheme(k); camoEl.appendChild(b);
}
const skinEl = document.getElementById('skins');
SKINS.forEach((s,i)=>{ const b=document.createElement('button'); b.className='chip skin'; b.style.background=s.s; b.title='Skin tone '+(i+1); b.onclick=()=>setSkin(i); skinEl.appendChild(b); });
document.querySelectorAll('#poses button').forEach(b=>b.onclick=()=>setPose(b.dataset.pose));
document.getElementById('fire').onclick = fire;
document.getElementById('patrol').onclick = togglePatrol;
document.getElementById('night').onclick = ()=>setNight(!night);
document.getElementById('light').onclick = ()=>setTorch(!torchOn);
document.getElementById('spin').onclick = toggleSpin;
document.getElementById('sound').onclick = toggleSound;
document.getElementById('collapse').onclick = (e)=>{
  const p = document.getElementById('panel'); p.classList.toggle('collapsed');
  e.currentTarget.textContent = p.classList.contains('collapsed') ? '+' : '–';
};
addEventListener('keydown', e=>{
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k==='1') setPose('ready'); else if (k==='2') setPose('aim'); else if (k==='3') setPose('salute');
  else if (k===' '){ e.preventDefault(); fire(); }
  else if (k==='p') togglePatrol(); else if (k==='n') setNight(!night); else if (k==='f') setTorch(!torchOn);
  else if (k==='r') toggleSpin(); else if (k==='m') toggleSound(); else if (k==='c') resetView();
});
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

setTheme('woodland'); setSkin(0);

/* ---------------- animation loop ---------------- */
const _tgt = new V3(), _rT = new V3(), _lT = new V3(), _prev = new V3(), _back = new V3();
const _qx = new THREE.Quaternion(), XAXIS = new V3(1,0,0);
const SUN_COL = new THREE.Color(0xfff0d4), MOON_COL = new THREE.Color(0x8fa6ff);
const SKY_DAY = new THREE.Color(0xd6ecff), SKY_NIGHT = new THREE.Color(0x30406a);
function angDiff(a,b){ return Math.atan2(Math.sin(b-a), Math.cos(b-a)); }

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const P = POSES[pose], k = 1 - Math.exp(-dt*7);

  // blend pose state
  for (const key of ['torso','head','tL','tR','rPos','poleR','poleL','rOvT']) st[key].lerp(P[key], k);
  for (const key of ['hipsYaw','crouch','sL','sR','rOv']) st[key] += (P[key]-st[key])*k;
  st.rQ.slerp(P.rQ, k);
  aimW += ((pose==='aim')-aimW)*k; saluteW += ((pose==='salute')-saluteW)*k;

  // patrol / locomotion
  const pos = soldier.position; _prev.copy(pos);
  let moving, desired = 0;
  if (patrol){
    const a = Math.atan2(pos.z, pos.x) + 0.55;
    _tgt.set(Math.cos(a)*2.4, 0, Math.sin(a)*2.4); moving = true;
  } else { _tgt.set(0,0,0); moving = pos.length() > 0.04; }
  if (moving) desired = Math.atan2(_tgt.x-pos.x, _tgt.z-pos.z);
  heading += THREE.MathUtils.clamp(angDiff(heading, desired), -dt*3, dt*3);
  walkW += ((moving?1:0) - walkW) * (1-Math.exp(-dt*5));
  const align = Math.max(0, Math.cos(angDiff(heading, desired)));
  let speed = 1.35 * walkW * align * (pose==='aim' ? 0.6 : 1);
  if (!patrol) speed *= Math.min(1, pos.length()*2.5);
  pos.x += Math.sin(heading)*speed*dt; pos.z += Math.cos(heading)*speed*dt;
  soldier.rotation.y = heading;
  phase += dt * (speed*3.6 + 0.0001);
  const sw = Math.min(1, speed/0.6) * walkW;

  // follow camera
  const delta = _back.subVectors(pos, _prev);
  camera.position.add(delta); controls.target.add(delta);

  // body
  const breath = Math.sin(t*1.7);
  const idle = (1-aimW)*(1-saluteW);
  hips.position.y = 1.2 - st.crouch - (1-Math.abs(Math.cos(phase)))*0.05*sw;
  hips.rotation.y = st.hipsYaw;
  torso.position.y = breath*0.008;
  torso.rotation.set(st.torso.x + breath*0.01 + sw*0.06, st.torso.y + Math.sin(phase)*0.07*sw, st.torso.z);
  neck.rotation.set(
    st.head.x + Math.sin(t*0.53)*0.04*idle,
    st.head.y + (Math.sin(t*0.37)*0.28 + Math.sin(t*0.91)*0.08)*idle*(1-sw*0.7),
    st.head.z);

  const swing = Math.sin(phase)*0.6*sw, knee = Math.max(0,-Math.cos(phase))*1.0*sw, knee2 = Math.max(0,Math.cos(phase))*1.0*sw;
  legL.thigh.rotation.set(st.tL.x - swing, st.tL.y, st.tL.z);
  legR.thigh.rotation.set(st.tR.x + swing, st.tR.y, st.tR.z);
  legL.shin.rotation.x = st.sL + knee;
  legR.shin.rotation.x = st.sR + knee2;

  // rifle + recoil
  rifle.position.copy(st.rPos); rifle.quaternion.copy(st.rQ);
  if (recoil > 0){
    rifle.position.addScaledVector(_back.set(0,0,-1).applyQuaternion(st.rQ), recoil*0.09);
    rifle.quaternion.multiply(_qx.setFromAxisAngle(XAXIS, -recoil*0.14));
    recoil = Math.max(0, recoil - dt*8);
  }
  rifle.updateMatrix();

  // hands → IK
  _rT.copy(RIFLE_GRIP).applyMatrix4(rifle.matrix).lerp(st.rOvT, st.rOv);
  _lT.copy(RIFLE_FORE).applyMatrix4(rifle.matrix);
  solveArm(armR, _rT, st.poleR);
  solveArm(armL, _lT, st.poleL);

  // firing
  soldier.updateMatrixWorld(true);
  if (burst > 0 && t >= nextShot && aimW > 0.88){ shoot(); burst--; nextShot = t + 0.11; }
  if (flashT > 0){ flashT -= dt; if (flashT <= 0) flash.visible = false; }
  muzzleLight.intensity *= Math.exp(-dt*40);

  // face: blink + squint when aiming
  if (t > nextBlink){ blinkEnd = t + 0.12; nextBlink = t + 2.5 + Math.random()*3; }
  const blink = t < blinkEnd;
  drawFace(blink, blink || aimW > 0.6);

  // shells
  for (const s of shells){
    const u = s.userData; if (u.rest) continue;
    u.v.y -= 14*dt; s.position.addScaledVector(u.v, dt);
    s.rotation.x += u.spin.x*dt; s.rotation.y += u.spin.y*dt; s.rotation.z += u.spin.z*dt;
    if (s.position.y < 0.018 && onIsland(s.position.x, s.position.z)){
      s.position.y = 0.018; u.v.y *= -0.32; u.v.x *= 0.55; u.v.z *= 0.55; u.spin.multiplyScalar(0.5);
      if (Math.abs(u.v.y) < 0.3){ u.rest = true; s.rotation.set(0, s.rotation.y, Math.PI/2); }
    }
    if (s.position.y < -20) u.rest = true;
  }
  for (let i=smokes.length-1;i>=0;i--){
    const s = smokes[i], u = s.userData; u.life += dt;
    s.position.addScaledVector(u.v, dt); u.v.multiplyScalar(Math.exp(-dt*1.5)); u.v.y += dt*0.2;
    s.scale.setScalar(u.s + u.life*0.35); s.rotation.y += dt;
    s.material.opacity = Math.max(0, 0.5*(1-u.life/1.4));
    if (u.life > 1.4){ scene.remove(s); s.material.dispose(); smokes.splice(i,1); }
  }

  // environment
  const nk = 1 - Math.exp(-dt*3), n = night ? 1 : 0;
  hemi.intensity += ((night?0.5:1.5) - hemi.intensity)*nk;
  sun.intensity += ((night?0.55:2.7) - sun.intensity)*nk;
  fill.intensity += ((night?0.15:0.7) - fill.intensity)*nk;
  sun.color.lerp(night ? MOON_COL : SUN_COL, nk);
  hemi.color.lerp(night ? SKY_NIGHT : SKY_DAY, nk);
  stars.material.opacity += (n*0.9 - stars.material.opacity)*nk;
  torch.intensity += ((torchOn?60:0) - torch.intensity)*(1-Math.exp(-dt*12));
  mats.goggleLens.emissiveIntensity = night ? 1.2 : 0.5;
  mats.watchFace.emissiveIntensity = night ? 2 : 0.8;
  for (const c of clouds){ c.position.x += c.userData.speed*dt; if (c.position.x > 34) c.position.x = -34; }
  clouds[0].children[0].material.opacity = night ? 0.25 : 0.92;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
document.getElementById('loading').remove();
requestAnimationFrame(tick);
</script>
