<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PMC Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage, docked loadout rail on the right (bottom sheet on phones) */
:root{
  --bg:#0d1011;
  --panel:#13181a;
  --panel-2:#1a2123;
  --line:#283133;
  --fg:#dbe0d8;
  --muted:#879189;
  --accent:#c9a54a;      /* cartridge brass */
  --accent-ink:#16130b;
  --f-display:'Saira Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-body)}
#stage{position:fixed;left:0;top:0;bottom:0;right:320px}
#stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
.hud{position:fixed;left:18px;top:16px;pointer-events:none;z-index:5;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.brand{font:700 30px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:700}
.desig{margin-top:6px;font:500 12px/1.2 var(--f-mono);letter-spacing:.08em;color:var(--fg);opacity:.85}
.stats{margin-top:4px;font:400 11px/1.2 var(--f-mono);color:#c3cbc2;font-variant-numeric:tabular-nums}
.views{position:fixed;left:18px;bottom:16px;display:flex;flex-wrap:wrap;gap:6px;z-index:5;max-width:calc(100vw - 360px)}
.views button,.seg button,.tog{font:500 12px/1 var(--f-body);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;transition:border-color .15s,background .15s}
.views button{background:rgba(19,24,26,.82);backdrop-filter:blur(8px)}
.views button:hover,.seg button:hover,.tog:hover{border-color:#4a5557}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:fixed;right:336px;bottom:18px;font:400 11px var(--f-mono);color:var(--muted);z-index:5;pointer-events:none}
aside{position:fixed;right:0;top:0;bottom:0;width:320px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px;z-index:6}
aside h2{margin:0;font:600 13px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
aside h2 small{font:400 10.5px var(--f-mono);letter-spacing:.04em;text-transform:none;color:#5f6a63}
.grp{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;gap:6px}
.seg.c2{grid-template-columns:1fr 1fr}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg button{padding:10px 6px;text-align:center}
.seg button[aria-pressed="true"],.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button .sub{display:block;margin-top:4px;font:400 10px var(--f-mono);opacity:.75;letter-spacing:.02em}
.wclass{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#6c776f;margin:2px 0 -2px}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tog{text-align:left;padding:9px 10px;display:flex;justify-content:space-between;align-items:center}
.tog::after{content:"OFF";font:500 9.5px var(--f-mono);opacity:.6}
.tog[aria-pressed="true"]::after{content:"ON";opacity:.8}
.tog:disabled{opacity:.35;cursor:not-allowed}
.spec{font:400 11px/1.55 var(--f-mono);color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.spec dt{color:#5f6a63;float:left;width:86px}
.spec dd{margin:0 0 0 86px;color:var(--fg)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;transition:opacity .5s}
#loading div{font:600 20px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
#loading.done{opacity:0;pointer-events:none}
@media (max-width:760px){
  #stage{right:0;bottom:46%}
  aside{top:auto;height:46%;width:auto;left:0;border-left:0;border-top:1px solid var(--line);padding:14px 16px 24px}
  .hint{display:none}
  .views{bottom:calc(46% + 10px);max-width:calc(100vw - 32px)}
  .brand{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud">
  <div class="brand"><b>PMC</b> Operator</div>
  <div class="desig" id="desig">&mdash;</div>
  <div class="stats" id="stats">&mdash;</div>
</div>
<div class="views" id="views">
  <button data-view="front">Front</button>
  <button data-view="quarter">3/4</button>
  <button data-view="side">Side</button>
  <button data-view="back">Back</button>
  <button data-view="close">Head</button>
  <button data-view="weapon">Weapon</button>
</div>
<div class="hint">drag orbit &middot; wheel zoom &middot; right-drag pan</div>

<aside>
  <div class="grp">
    <h2>Faction <small id="factionNote">FAST / plate carrier</small></h2>
    <div class="seg c2" data-key="faction">
      <button data-v="west">Western<span class="sub">MultiCam family</span></button>
      <button data-v="east">Eastern<span class="sub">EMR digital</span></button>
    </div>
  </div>
  <div class="grp">
    <h2>Theatre</h2>
    <div class="seg c3" data-key="theatre">
      <button data-v="city">City</button>
      <button data-v="desert">Desert</button>
      <button data-v="forest">Forest</button>
    </div>
  </div>
  <div class="grp">
    <h2>Primary <small id="calNote"></small></h2>
    <div class="wclass">SMG</div>
    <div class="seg c2" data-key="weapon">
      <button data-v="mp5">MP5A2<span class="sub">9&times;19</span></button>
    </div>
    <div class="wclass">Assault</div>
    <div class="seg c2" data-key="weapon">
      <button data-v="m4">M4A1<span class="sub">5.56&times;45</span></button>
      <button data-v="ak">AK-74M<span class="sub">5.45&times;39</span></button>
    </div>
    <div class="wclass">Marksman / sniper</div>
    <div class="seg c2" data-key="weapon">
      <button data-v="hk417">HK417<span class="sub">7.62&times;51</span></button>
      <button data-v="svd">SVD Dragunov<span class="sub">7.62&times;54R</span></button>
    </div>
  </div>
  <div class="grp">
    <h2>Pose</h2>
    <div class="seg c2" data-key="pose">
      <button data-v="ease">At ease</button>
      <button data-v="aim">Aim</button>
      <button data-v="tactical">Tactical aim</button>
      <button data-v="kneel">Kneeling aim</button>
      <button data-v="prone">Prone</button>
    </div>
  </div>
  <div class="grp">
    <h2>Attachments</h2>
    <div class="toggles">
      <button class="tog" data-tog="optic">Optic</button>
      <button class="tog" data-tog="suppressor">Suppressor</button>
      <button class="tog" data-tog="light">Light / laser</button>
      <button class="tog" data-tog="sling">Sling</button>
    </div>
  </div>
  <div class="grp">
    <h2>Kit</h2>
    <div class="toggles">
      <button class="tog" data-tog="helmet">Helmet</button>
      <button class="tog" data-tog="nvg">NVG</button>
      <button class="tog" data-tog="pack">Assault pack</button>
      <button class="tog" data-tog="glasses">Eyewear</button>
    </div>
  </div>
  <div class="grp">
    <h2>View</h2>
    <div class="toggles">
      <button class="tog" data-tog="rotate">Turntable</button>
      <button class="tog" data-tog="wire">Wireframe</button>
      <button class="tog" data-tog="props">Scenery</button>
      <button class="tog" data-tog="idle">Breathing</button>
    </div>
  </div>
  <dl class="spec" id="spec"></dl>
</aside>
<div id="loading"><div>Assembling operator</div></div>

<script type="importmap">

</script>
<script type="module">

/* ============================================================

   ============================================================ */

}
const box=(w,h,d,a=1,b=1,c=1)=>new THREE.BoxGeometry(w,h,d,a,b,c);

function latheZ(pts,seg=56){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);g.rotateX(Math.PI/2);return g;}
/* side-profile extrusion: pts [[z,y]...] in weapon space, thickness along X */

  const sh=new THREE.Shape();pts.forEach(([z,y],i)=>i?sh.lineTo(z,y):sh.moveTo(z,y));
  if(holes)holes.forEach(h=>{const p=new THREE.Path();h.forEach(([z,y],i)=>i?p.lineTo(z,y):p.moveTo(z,y));sh.holes.push(p);});
  const d=Math.max(t-2*b,0.0008);
  let g=new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:b>0,bevelThickness:b,bevelSize:b*0.9,bevelSegments:seg,curveSegments:16});

  g=toCreasedNormals(g,0.5);

/* curved slab (armour plate), front face centred at z=t, curving back at sides */

  for(let i=0;i<=n;i++){const a=-A+2*A*i/n;const x=(R+t)*Math.sin(a),y=(R+t)*Math.cos(a)-R;i?sh.lineTo(x,y):sh.moveTo(x,y);}
  for(let i=n;i>=0;i--){const a=-A+2*A*i/n;sh.lineTo(R*Math.sin(a),R*Math.cos(a)-R);}
  const d=h-2*b;

/* flat strap following a planar path (shape: thickness x width) */
function strapGeo(points,w,t,steps=40){

function tubePath(points,r,seg=48,rs=8,closed=false){return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points,closed,'catmullrom',0.5),seg,r,rs,closed);}
function basisQuat(z,up=V(0,1,0)){

  if(x.lengthSq()<1e-6)x=V(1,0,0);x.normalize();const y=new THREE.Vector3().crossVectors(z,x);

/* anchor frame used for hand placement: X = grip axis, Z = palm normal (palm->object) */
function frame(p,xAxis,zAxis){
  const x=xAxis.clone().normalize();const z=zAxis.clone();z.sub(x.clone().multiplyScalar(z.dot(x))).normalize();
  const y=new THREE.Vector3().crossVectors(z,x);
  return {p:p.clone(),q:new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z))};

/* ============================================================
   Procedural textures
   ============================================================ */
function hash2(i,j,s){let h=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(s+1,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}

  const m=a=>((a%P)+P)%P;const x0=m(xi),x1=m(xi+1),y0=m(yi),y1=m(yi+1);
  const a=hash2(x0,y0,s),b=hash2(x1,y0,s),c=hash2(x0,y1,s),d=hash2(x1,y1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;

function fbm(u,v,P,s,oct=4){let sum=0,amp=0.5,nrm=0,f=1;for(let o=0;o<oct;o++){sum+=amp*vnoise(u*P*f,v*P*f,P*f,s+o*31);nrm+=amp;amp*=0.5;f*=2;}return sum/nrm;}
const hexRGB=h=>{const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];};

const CAMO = {
  // Western: MultiCam-family organic patterns
  mcForest:{colors:['#8a8160','#6c6c47','#4f5534','#a99a78','#5f4733','#2f2a20','#d7ccab'],warp:0.22,
    layers:[{c:1,s:3,t:0.52,seed:1},{c:2,s:4,t:0.6,seed:2},{c:3,s:5,t:0.63,seed:3},{c:4,s:5,t:0.66,seed:4},{c:5,s:4,vein:0.016,seed:5,oct:3},{c:6,s:9,t:0.72,seed:6}]},
  mcArid:{colors:['#cbb893','#b49f79','#ddcfae','#9e8664','#7d6649','#e9dfc6'],warp:0.22,
    layers:[{c:1,s:3,t:0.52,seed:11},{c:2,s:4,t:0.6,seed:12},{c:3,s:5,t:0.64,seed:13},{c:4,s:4,vein:0.014,seed:14,oct:3},{c:5,s:9,t:0.72,seed:15}]},
  mcBlack:{colors:['#2b2c2d','#3a3b3c','#1b1c1d','#4b4c4d','#141414','#56585a'],warp:0.22,
    layers:[{c:1,s:3,t:0.52,seed:21},{c:2,s:4,t:0.6,seed:22},{c:3,s:5,t:0.65,seed:23},{c:4,s:4,vein:0.015,seed:24,oct:3},{c:5,s:9,t:0.74,seed:25}]},
  // Eastern: EMR-style digital patterns
  emrForest:{digital:4,colors:['#7b8a60','#56693e','#3c4a2b','#4b3a29','#1e1f1a'],
    layers:[{c:1,s:4,t:0.5,seed:31},{c:2,s:6,t:0.58,seed:32},{c:3,s:7,t:0.64,seed:33},{c:4,s:8,t:0.7,seed:34}]},
  emrDesert:{digital:4,colors:['#c5b58f','#a9956f','#8c7454','#dacdab','#6b5741'],
    layers:[{c:1,s:4,t:0.5,seed:41},{c:2,s:6,t:0.6,seed:42},{c:3,s:7,t:0.66,seed:43},{c:4,s:8,t:0.72,seed:44}]},
  emrUrban:{digital:4,colors:['#8f9193','#6e7072','#505254','#a9abad','#2e3032'],
    layers:[{c:1,s:4,t:0.5,seed:51},{c:2,s:6,t:0.58,seed:52},{c:3,s:7,t:0.64,seed:53},{c:4,s:8,t:0.71,seed:54}]},
};
const texCache={};
function camoTexture(key){
  if(texCache[key])return texCache[key];
  const spec=CAMO[key],size=512,c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d'),img=ctx.createImageData(size,size),d=img.data,cols=spec.colors.map(hexRGB);
  const blk=spec.digital||1,N=size/blk;
  for(let by=0;by<N;by++)for(let bx=0;bx<N;bx++){
    const u=(bx+0.5)/N,v=(by+0.5)/N;let wu=u,wv=v;
    if(spec.warp){wu+=spec.warp*(fbm(u,v,3,91,3)-0.5);wv+=spec.warp*(fbm(u,v,3,57,3)-0.5);}
    let ci=0;
    for(let L=0;L<spec.layers.length;L++){
      const ly=spec.layers[L];const n=fbm(wu,wv,ly.s,ly.seed,ly.oct||(spec.digital?3:4));
      if(ly.vein){if(Math.abs(n-0.5)<ly.vein)ci=ly.c;}else if(n>ly.t)ci=ly.c;
    }
    const col=cols[ci];
    for(let py=0;py<blk;py++)for(let px=0;px<blk;px++){
      const X=bx*blk+px,Y=by*blk+py,o=(Y*size+X)*4,gr=(hash2(X,Y,7)-0.5)*14;
      d[o]=clamp(col[0]+gr,0,255);d[o+1]=clamp(col[1]+gr,0,255);d[o+2]=clamp(col[2]+gr,0,255);d[o+3]=255;

  return texCache[key]=t;

function heightToNormal(size,hf,strength){
  const c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d'),img=ctx.createImageData(size,size),d=img.data;
  const H=new Float32Array(size*size);for(let y=0;y<size;y++)for(let x=0;x<size;x++)H[y*size+x]=hf(x,y);
  const at=(x,y)=>H[((y+size)%size)*size+((x+size)%size)];
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const dx=(at(x+1,y)-at(x-1,y))*strength,dy=(at(x,y+1)-at(x,y-1))*strength;

}
function fabricNormal(){
  if(texCache.fabric)return texCache.fabric;
  const t=heightToNormal(256,(x,y)=>{const cx=Math.floor(x/4),cy=Math.floor(y/4);const over=(cx+cy)%2;
    const wx=Math.sin((x%4)/4*Math.PI),wy=Math.sin((y%4)/4*Math.PI);return (over?wx:wy)*0.6+hash2(x,y,3)*0.25;},2.2);

const H_GRIP = V(0,-0.078,0.034); // centre of gripped object, hand-local
function buildHand(M,mirror){
  const g=new THREE.Group();
  add(g,rb(0.084,0.094,0.034,0.013,4),M.glove,[0,-0.048,0.0]);
  add(g,rb(0.07,0.026,0.012,0.005,3),M.gloveKnuckle,[0,-0.084,-0.019]); // knuckle armour
  add(g,rb(0.06,0.03,0.008,0.004,3),M.gloveKnuckle,[0.004,-0.04,-0.019]);
  add(g,cyl(0.041,0.04,0.05,32),M.glove,[0,0.008,0],null,[1,1,0.72]); // cuff
  const fx=[-0.029,-0.0095,0.0095,0.0285],fl=[[0.042,0.026,0.021],[0.046,0.029,0.022],[0.043,0.027,0.021],[0.035,0.022,0.018]],fr=[0.0102,0.0106,0.0102,0.0092];
  const up=V(0,1,0);
  for(let i=0;i<4;i++){
    let p=V(fx[i],-0.094,0.002);let ang=0;const bends=[72,88,62];
    for(let k=0;k<3;k++){
      ang+=bends[k]*DEG;const dir=V(0,-Math.cos(ang),Math.sin(ang));const len=fl[i][k];const r=fr[i]-k*0.0007;

      m.position.copy(p.clone().addScaledVector(dir,len/2));m.quaternion.setFromUnitVectors(up,dir);
      p.addScaledVector(dir,len);
    }
  }
  // thumb wraps from index side across the grip
  let p=V(-0.036,-0.026,0.012);
  [[V(-0.25,-0.62,0.75),0.036,0.0122],[V(0.45,-0.55,0.7),0.03,0.0112],[V(0.9,-0.25,0.3),0.022,0.0105]].forEach(([d,len,r])=>{

  });
  add(g,ell(0.02,0.03,0.016),M.glove,[-0.03,-0.03,0.008]); // thenar pad
  if(mirror)g.scale.x=-1;

function shellGeo(sx,sy,sz,thMax,nu=128,nv=36){
  const pos=[],uv=[],idx=[];
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){
    const az=i/nu*2*Math.PI-Math.PI;const th=(j/nv)*thMax(az);
    pos.push(sx*Math.sin(th)*Math.sin(az),sy*Math.cos(th),sz*Math.sin(th)*Math.cos(az));
    uv.push(i/nu*2.2,j/nv*0.8);
  }
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1;idx.push(a,b,c,b,d,c);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g;
}
function shellPt(sx,sy,sz,az,th,c){
  const p=V(sx*Math.sin(th)*Math.sin(az),sy*Math.cos(th),sz*Math.sin(th)*Math.cos(az)).add(c);
  const n=V(Math.sin(th)*Math.sin(az)/sx,Math.cos(th)/sy,Math.sin(th)*Math.cos(az)/sz).normalize();
  return {p,n};
}
function onShell(parent,geo,mat,S,az,th,out,up){
  const {p,n}=shellPt(S[0],S[1],S[2],az,th,S[3]);const m=add(parent,geo,mat);m.position.copy(p).addScaledVector(n,out);
  m.quaternion.copy(basisQuat(n,up||V(0,1,0)));return m;
}

    const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),s=V(),p=V();let k=0;
    for(let i=0;i<n*3&&k<n;i++){const r=0.9+Math.random()*4.5,a=Math.random()*Math.PI*2;p.set(Math.cos(a)*r,0,Math.sin(a)*r-0.3);
      if(Math.abs(p.x)<0.7&&p.z>-1.6&&p.z<0.8)continue;
      q.setFromEuler(new THREE.Euler((Math.random()-0.5)*0.5,Math.random()*6,(Math.random()-0.5)*0.5));const sc=0.5+Math.random()*1.0;s.set(sc,sc,sc);m4.compose(p,q,s);inst.setMatrixAt(k++,m4);
      inst.setColorAt(k-1,new THREE.Color().setHSL(0.22+Math.random()*0.06,0.35,0.22+Math.random()*0.12));}
    inst.count=k;inst.castShadow=true;inst.receiveShadow=true;propGroup.add(inst);
    const bark=new THREE.MeshStandardMaterial({color:'#4a3a2b',roughness:1});
    const log=sh(new THREE.Mesh(cyl(0.16,0.19,2.4,24,6),bark));log.rotation.z=Math.PI/2;log.rotation.y=0.6;log.position.set(-1.5,0.16,-2.2);propGroup.add(log);
    const rock=new THREE.MeshStandardMaterial({color:'#6d6c62',roughness:0.95,flatShading:true});
    const rk=sh(new THREE.Mesh(new THREE.DodecahedronGeometry(0.45,1),rock));rk.scale.set(1,0.55,0.8);rk.position.set(2.2,0.15,-1.8);propGroup.add(rk);
  }
  propGroup.visible=state.props;
}
function applyEnvironment(theatre){
  const e=ENV[theatre];
  scene.background=skyTexture(e.sky[0],e.sky[1]);
  scene.fog=new THREE.Fog(e.fog,9,26);
  sun.color.set(e.sun[0]);sun.intensity=e.sun[1];
  hemi.color.set(e.hemi[0]);hemi.groundColor.set(e.hemi[1]);hemi.intensity=e.hemi[2];
  groundMat.map=groundTexture(e.ground);groundMat.needsUpdate=true;
  renderer.toneMappingExposure=e.exp;
  buildProps(theatre);
}

/* ============================================================
   State + UI
   ============================================================ */
const state={faction:'west',theatre:'forest',weapon:'m4',pose:'aim',optic:true,suppressor:false,light:true,sling:true,helmet:true,nvg:true,pack:false,glasses:true,rotate:false,wire:false,props:true,idle:true};
let S=null,poseFrom='aim',poseTo='aim',poseT=1,envKey='';
function disposeSoldier(){
  if(!S)return;scene.remove(S.root);
  S.root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());});
}
function rebuild(){
  disposeSoldier();
  S=buildSoldier(state);scene.add(S.root);
  S.sling.visible=state.sling;
  setWire(state.wire);
  if(envKey!==state.theatre){applyEnvironment(state.theatre);envKey=state.theatre;}
  applyPose(S,POSES[poseFrom],POSES[poseTo],poseT,clock.elapsedTime,state);
  updateHud();
}
function setWire(on){S.root.traverse(o=>{if(o.isMesh){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{m.wireframe=on;});}});}
function countTris(){let t=0,m=0;S.root.traverse(o=>{if(o.isMesh&&o.geometry&&o.geometry.attributes.position){const g=o.geometry;t+=(g.index?g.index.count:g.attributes.position.count)/3;m++;}});return {t:Math.round(t),m};}
function updateHud(){
  const A=S.weapon.A;const f=state.faction==='west'?'W':'E';
  document.getElementById('desig').textContent=`${f}-${PAL[state.faction][state.theatre].code} · ${A.name.toUpperCase()} · ${POSES[poseTo].label.toUpperCase()}`;
  const c=countTris();
  document.getElementById('stats').textContent=`${c.t.toLocaleString('en-US')} tris · ${c.m.toLocaleString('en-US')} meshes`;
  document.getElementById('calNote').textContent=A.cal;
  document.getElementById('factionNote').textContent=state.faction==='west'?'FAST helmet · plate carrier':'6B47-type helmet · full-cover vest';
  const camoName={mcForest:'MultiCam-type woodland',mcArid:'MultiCam-type arid',mcBlack:'MultiCam-type black',emrForest:'EMR-type digital woodland',emrDesert:'EMR-type digital desert',emrUrban:'EMR-type digital urban'}[PAL[state.faction][state.theatre].camo];
  const opt={m4:'EXPS3 holo + G33 (flipped)',hk417:'1–6× LPVO',ak:'side-rail collimator',mp5:'micro red dot',svd:'PSO-1 4×'}[state.weapon];
  document.getElementById('spec').innerHTML=
    `<dt>Camo</dt><dd>${camoName}</dd><dt>Primary</dt><dd>${A.name} · ${A.cal}</dd><dt>Length</dt><dd>${A.len.toFixed(2)} m</dd><dt>Optic</dt><dd>${state.optic?opt:'iron sights'}</dd><dt>Sidearm</dt><dd>9mm, drop holster (right)</dd><dt>Spare mags</dt><dd>${state.faction==='west'?3:6} on chest rig</dd>`;
}
function syncUI(){
  document.querySelectorAll('.seg').forEach(seg=>{const k=seg.dataset.key;seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(state[k]===b.dataset.v)));});
  document.querySelectorAll('.tog').forEach(b=>{b.setAttribute('aria-pressed',String(!!state[b.dataset.tog]));});
  const nv=document.querySelector('[data-tog="nvg"]');nv.disabled=!state.helmet;
}
document.querySelectorAll('.seg').forEach(seg=>{
  seg.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;const k=seg.dataset.key,v=b.dataset.v;
    if(k==='pose'){if(v!==poseTo){poseFrom=poseTo;poseTo=v;poseT=0;focusTo=POSES[v].focus;}state.pose=v;syncUI();updateHud();return;}
    if(state[k]===v)return;
    if(k==='faction'){const swap={west:{ak:'m4',svd:'hk417'},east:{m4:'ak',hk417:'svd'}}[v];if(swap[state.weapon])state.weapon=swap[state.weapon];}
    state[k]=v;syncUI();rebuild();
  });
});
document.querySelectorAll('.tog').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.tog;state[k]=!state[k];syncUI();
  if(k==='rotate')controls.autoRotate=state.rotate;
  else if(k==='wire')setWire(state.wire);
  else if(k==='props')propGroup.visible=state.props;
  else if(k==='sling')S.sling.visible=state.sling;
  else if(k==='idle'){}
  else rebuild();
}));
controls.autoRotateSpeed=1.2;
let focusTo=POSES.aim.focus,camAnim=null;
const VIEWS={front:[0,0.15,3.4],quarter:[2.4,0.55,3.3],side:[3.6,0.25,0.0],back:[-1.2,0.6,-3.4],close:[0.55,0.12,0.75],weapon:[-0.9,0.35,1.0]};
document.getElementById('views').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const v=VIEWS[b.dataset.view];
  let tgt;
  if(b.dataset.view==='close')tgt=S.B.head.localToWorld(V(0,0.09,0.02));
  else if(b.dataset.view==='weapon')tgt=S.weapon.g.localToWorld(V(0,0.03,0.1));
  else tgt=V(0,focusTo,0);
  camAnim={t:0,fromP:camera.position.clone(),fromT:controls.target.clone(),toP:tgt.clone().add(V(v[0],v[1],v[2])),toT:tgt};
});
window.addEventListener('keydown',e=>{if(e.key==='r'){state.rotate=!state.rotate;controls.autoRotate=state.rotate;syncUI();}});

function resize(){const w=stageEl.clientWidth,h=stageEl.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
const clock=new THREE.Clock();
let lastFocus=focusTo;
function tick(){
  if(window.__pmcPause){requestAnimationFrame(tick);return;}
  const dt=Math.min(clock.getDelta(),0.05);const time=clock.elapsedTime;
  if(poseT<1){poseT=Math.min(1,poseT+dt/0.9);}
  const e=poseT<1?(poseT<0.5?4*poseT*poseT*poseT:1-Math.pow(-2*poseT+2,3)/2):1;
  applyPose(S,POSES[poseFrom],POSES[poseTo],e,time,state);
  // follow focus height with the pose
  const fNow=lerp(POSES[poseFrom].focus,POSES[poseTo].focus,e);
  if(!camAnim){const dy=fNow-lastFocus;controls.target.y+=dy;camera.position.y+=dy;}
  lastFocus=fNow;
  if(camAnim){camAnim.t=Math.min(1,camAnim.t+dt/0.8);const k=1-Math.pow(1-camAnim.t,3);camera.position.lerpVectors(camAnim.fromP,camAnim.toP,k);controls.target.lerpVectors(camAnim.fromT,camAnim.toT,k);if(camAnim.t>=1)camAnim=null;}
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
syncUI();resize();
requestAnimationFrame(()=>{
  rebuild();
  controls.target.set(0,POSES.aim.focus,0);lastFocus=POSES.aim.focus;
  document.getElementById('loading').classList.add('done');
  tick();
});
window.__pmc={state,get S(){return S;},rebuild,POSES,camera,controls,renderer,scene,
  snap(pose,cam,tgt,draw=true){if(pose){poseFrom=poseTo=pose;poseT=1;}if(draw)resize();applyPose(S,POSES[poseFrom],POSES[poseTo],1,clock.elapsedTime,state);if(cam){camera.position.set(...cam);controls.target.set(...tgt);}if(draw){controls.update();renderer.render(scene,camera);}}};
</script>
