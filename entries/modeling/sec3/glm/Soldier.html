<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMC OPERATOR — FIELD DOSSIER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101208; --panel:#15180f; --panel2:#1a1e13; --line:#2c3120; --line2:#3a4128;
  --ink:#d9d6c3; --dim:#7f8369; --amber:#d3a54c; --amber2:#eccf8a; --red:#b0492f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:12px}
#app{display:flex;flex-direction:column;height:100%}
header{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--panel)}
header .mark{width:26px;height:26px;color:var(--amber)}
header h1{font-family:"Saira Condensed";font-size:19px;font-weight:700;letter-spacing:.22em;color:var(--ink)}
header h1 b{color:var(--amber);font-weight:700}
header .sub{font-size:10px;color:var(--dim);letter-spacing:.14em;border-left:1px solid var(--line);padding-left:14px}
header .right{margin-left:auto;display:flex;gap:18px;font-size:10px;color:var(--dim);letter-spacing:.1em}
header .right b{color:var(--ink);font-weight:500}
#burger{display:none;background:none;border:1px solid var(--line2);color:var(--ink);padding:5px 9px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.1em}
#wrap{flex:1;display:flex;min-height:0}
aside{width:296px;flex:0 0 296px;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 14px 30px}
aside::-webkit-scrollbar{width:5px} aside::-webkit-scrollbar-thumb{background:var(--line2)}
.sec{margin-bottom:22px}
.sec h2{font-family:"Saira Condensed";font-size:11px;font-weight:600;letter-spacing:.3em;
  color:var(--dim);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line)}
.sec h2 i{font-style:normal;color:var(--amber);font-family:"IBM Plex Mono";font-size:10px}
.btn{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line2);
  color:var(--ink);padding:9px 11px;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
.btn:hover{background:var(--panel2)}
.btn .t{font-family:"Saira Condensed";font-size:14px;font-weight:600;letter-spacing:.14em;display:block}
.btn .d{font-size:10px;color:var(--dim);display:block;margin-top:2px;letter-spacing:.03em;line-height:1.45}
.btn.on{border-color:var(--amber);background:rgba(211,165,76,.07)}
.btn.on .t{color:var(--amber)} .btn.on .d{color:#a89a74}
.btn+.btn{margin-top:6px}
.row3{display:flex;gap:6px}
.camo{flex:1;background:none;border:1px solid var(--line2);cursor:pointer;padding:5px;color:var(--dim);font-family:inherit}
.camo canvas{width:100%;height:44px;display:block;image-rendering:auto}
.camo span{display:block;text-align:center;font-size:9px;letter-spacing:.2em;margin-top:5px}
.camo:hover{border-color:var(--dim)} .camo.on{border-color:var(--amber);color:var(--amber)}
.load{display:flex;justify-content:space-between;align-items:baseline}
.load .tag{font-size:10px;color:var(--dim);letter-spacing:.06em}
.load.on .tag{color:#a89a74}
.tgl{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line2);
  padding:8px 11px;cursor:pointer;color:var(--ink);font-family:inherit;background:none;width:100%}
.tgl+.tgl{margin-top:6px}
.tgl .sw{width:30px;height:15px;border:1px solid var(--line2);position:relative;flex:0 0 30px}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;background:var(--dim);transition:all .15s}
.tgl.on .sw{border-color:var(--amber)}
.tgl.on .sw::after{left:16px;background:var(--amber)}
.tgl span{font-size:10px;letter-spacing:.18em;color:var(--dim)}
.tgl.on span{color:var(--amber)}
#stage{flex:1;position:relative;min-width:0;background:#0d0f0a}
#stage canvas{display:block}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(0,0,0,.42) 100%)}
.corner{position:absolute;width:20px;height:20px;border:1px solid rgba(211,165,76,.4);pointer-events:none;z-index:2}
.c-tl{top:12px;left:12px;border-right:0;border-bottom:0}
.c-tr{top:12px;right:12px;border-left:0;border-bottom:0}
.c-bl{bottom:12px;left:12px;border-right:0;border-top:0}
.c-br{bottom:12px;right:12px;border-left:0;border-top:0}
#desig{position:absolute;top:22px;left:44px;z-index:2;pointer-events:none}
#desig .big{font-family:"Saira Condensed";font-size:26px;font-weight:700;letter-spacing:.18em;color:var(--ink)}
#desig .big b{color:var(--amber)}
#desig .sm{font-size:10px;color:var(--dim);letter-spacing:.2em;margin-top:2px}
#spec{position:absolute;top:22px;right:44px;z-index:2;pointer-events:none;text-align:right}
#spec .w{font-family:"Saira Condensed";font-size:16px;font-weight:600;letter-spacing:.16em;color:var(--amber);margin-bottom:6px}
#spec .r{font-size:10px;color:var(--dim);letter-spacing:.08em;line-height:1.7}
#spec .r b{color:var(--ink);font-weight:500;margin-left:8px}
#posebar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
#posebar button{background:rgba(16,18,8,.82);border:1px solid var(--line2);color:var(--dim);
  cursor:pointer;padding:7px 10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:inherit;transition:all .15s;backdrop-filter:blur(3px)}
#posebar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#posebar button span{font-size:8px;letter-spacing:.18em}
#posebar button:hover{color:var(--ink);border-color:var(--dim)}
#posebar button.on{color:var(--amber);border-color:var(--amber);background:rgba(211,165,76,.1)}
#hint{position:absolute;bottom:22px;left:44px;z-index:2;font-size:9px;color:var(--dim);letter-spacing:.16em;pointer-events:none;transition:opacity .8s}
@media (max-width:880px){
  #burger{display:block}
  aside{position:fixed;left:0;top:48px;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .25s}
  aside.open{transform:none}
  #spec{display:none} #desig .big{font-size:18px} #hint{display:none}
}
</style>
</head>
<body>
<div id="app">
<header>
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
    <path d="M12 2 21 12 12 22 3 12Z"/><path d="M7.5 12 12 7.5 16.5 12M7.5 16 12 11.5 16.5 16"/>
  </svg>

</header>

      <button class="camo on" data-env="desert"><canvas width="76" height="44"></canvas><span>DESERT</span></button>
      <button class="camo" data-env="forest"><canvas width="76" height="44"></canvas><span>FOREST</span></button>
    </div>
  </div>
  <div class="sec"><h2><i>03</i>LOADOUT</h2>
    <button class="btn load on" data-cls="smg"><span class="t">SMG</span><span class="tag" id="tag-smg">MP5A5</span></button>
    <button class="btn load" data-cls="assault"><span class="t">ASSAULT</span><span class="tag" id="tag-assault">M4A1</span></button>
    <button class="btn load" data-cls="marksman"><span class="t">MARKSMAN</span><span class="tag" id="tag-marksman">HK417</span></button>
  </div>
  <div class="sec"><h2><i>04</i>VIEW OPTIONS</h2>
    <button class="tgl on" id="t-orbit"><span>AUTO ORBIT</span><span class="sw"></span></button>
    <button class="tgl on" id="t-idle"><span>IDLE MOTION</span><span class="sw"></span></button>
    <button class="tgl" id="t-wire"><span>WIREFRAME / MESH DENSITY</span><span class="sw"></span></button>
  </div>
</aside>
<main id="stage">
  <div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>
  <div id="desig"><div class="big" id="d-big">WEST <b>//</b> MC-ARID</div><div class="sm" id="d-sm">M4A1 · AT EASE</div></div>
  <div id="spec"><div class="w" id="s-name">M4A1 BLOCK II</div>
    <div class="r">CAL<b id="s-cal">—</b></div><div class="r">RATE<b id="s-rate">—</b></div>
    <div class="r">MASS<b id="s-mass">—</b></div><div class="r">LENGTH<b id="s-len">—</b></div>
    <div class="r">ACTION<b id="s-act">—</b></div></div>
  <div id="posebar">
    <button data-pose="ease" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.6" r="2"/><path d="M12 6.8V14M12 8.4 9.2 13.5M12 8.4 15 13M12 14 9.6 21M12 14l2.6 7M15 13l3.6 4.4"/></svg><span>AT EASE</span></button>
    <button data-pose="aim"><svg viewBox="0 0 24 24"><circle cx="11" cy="4.6" r="2"/><path d="M11 6.8v6.7M11 8.2l4.5 1M11 8.6l4.5 1M11 13.5 7 20.5M11 13.5 15.5 21M9 9.8l13-1M20.5 8.9v1.7"/></svg><span>AIM</span></button>
    <button data-pose="tact"><svg viewBox="0 0 24 24"><circle cx="11.5" cy="6" r="2"/><path d="M11.5 8.2 11 13.5M11.5 9.4l4.3 1.2M11 13.5 6.8 15.6 8 21M11 13.5l3.6 2.3-1.2 5.2M9.4 10.4 21 9.4"/></svg><span>TACTICAL</span></button>
    <button data-pose="kneel"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.4" r="2"/><path d="M12 6.6v6.2M12 8l4 1.4M12 12.8l2.6 3.8-1 4.4M12 12.8 8.8 17.4H3.6M9.4 9.6 21 8.8"/></svg><span>KNEEL</span></button>
    <button data-pose="prone"><svg viewBox="0 0 24 24"><circle cx="18.6" cy="15.4" r="1.9"/><path d="M2.5 19.8h19M3.6 18 7 16.4l9.8-.2M7 16.4 4 19.2M13 15l9.8-.8M10.5 16.6 13 15"/></svg><span>PRONE</span></button>
  </div>
  <div id="hint">LMB ORBIT · WHEEL ZOOM · RMB PAN</div>
</main>
</div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================== STATE ============================== */
const st = { faction:'west', env:'desert', cls:'assault', pose:'ease', wire:false, idle:true, orbit:true };

const ENV = {
  city:  { gear:0x2f3338, pouch:0x25282c, boot:0x222427, sole:0x121314, helmE:0x33373a, glove:0x2a2d31, lens:0x39414a, furn:0x202225, name:'URBAN' },
  desert:{ gear:0x8a744f, pouch:0x745f3f, boot:0x66503a, sole:0x191612, helmE:0x937f57, glove:0x8a744f, lens:0x7d5c28, furn:0x8a734e, name:'ARID' },
  forest:{ gear:0x3c4232, pouch:0x31372a, boot:0x2a281f, sole:0x111210, helmE:0x414c36, glove:0x343a2c, lens:0x2c3a2e, furn:0x4d3728, name:'WOODLAND' }
};
const CAMO = {
  west: { city:[0x565a5e,0x43474b,0x6b6f73,0x33363a,0x24262a], desert:[0xa08c62,0x8a744d,0xb3a17c,0x6e5c3d,0x4c4534], forest:[0x4d5442,0x3a4130,0x5d6449,0x2c3126,0x6b5d3f], tag:{city:'MC-URBAN',desert:'MC-ARID',forest:'MC-TROPIC'} },
  east: { city:[0x4d5257,0x3c4145,0x5e6468,0x2d3134,0x212427], desert:[0x9c8a60,0x83704b,0xb09d74,0x655738,0x4a4230], forest:[0x4a5340,0x39422f,0x5b6647,0x2b3325,0x1f251c], tag:{city:'EMR-URBAN',desert:'EMR-DESERT',forest:'EMR-TAIGA'} }
};
const SPECS = {
  smg:     { name:'MP5A5',         cal:'9×19 PAR', rate:'700 RPM', mass:'2.5 KG', len:'680 MM', act:'ROLLER-DELAY' },
  assault_w:{ name:'M4A1 BLOCK II', cal:'5.56×45',  rate:'810 RPM', mass:'3.1 KG', len:'838 MM', act:'GAS-IMPINGE' },
  assault_e:{ name:'AK-74M',        cal:'5.45×39',  rate:'650 RPM', mass:'3.4 KG', len:'943 MM', act:'LONG-STROKE' },
  marksman_w:{name:'HK417 DMR',     cal:'7.62×51',  rate:'600 RPM', mass:'4.9 KG', len:'1005 MM', act:'GAS-PISTON' },
  marksman_e:{name:'SVD-S',         cal:'7.62×54R', rate:'SEMI',    mass:'4.5 KG', len:'1225 MM', act:'SHORT-STROKE' }
};

/* ============================== POSES ============================== */
function pose(o){ return Object.assign({
  px:0,py:0.97,pz:0, prx:0,pry:0,prz:0, crx:0,cry:0,crz:0, nrx:0,nry:0,nrz:0,
  flx:0.17,fly:0.10,flz:0.10,flYaw:0.2,flPit:0,
  frx:-0.17,fry:0.10,frz:0.02,frYaw:-0.12,frPit:0,
  wx:0,wy:1.4,wz:0.2, wrx:0,wry:0,wrz:0,
  aPLx:0.9,aPLy:-0.5,aPLz:-0.15, aPRx:-0.3,aPRy:-0.95,aPRz:-0.4,
  lPLx:0,lPLy:0.15,lPLz:1, lPRx:0,lPRy:0.15,lPRz:1,
  handL:'gun', hLx:0.24,hLy:0.97,hLz:0.06,
  camY:0.98, breath:1, sway:0.4 }, o); }

const POSES = {
  ease:  pose({ pry:0.12, crx:0.03, cry:0.04, nrx:0.03, nry:-0.10, nrz:0.04,
    flYaw:0.20, frYaw:-0.12,
    wx:-0.26, wy:0.97, wz:0.17, wrx:1.28, wry:0.10, wrz:0.06,
    aPLx:0.35,aPLy:-0.15,aPLz:-0.9, aPRx:-0.25,aPRy:-0.25,aPRz:-0.95,
    handL:'free', camY:0.98, breath:1, sway:0.35 }),
  aim:   pose({ py:0.96, prx:0.05, pry:0.30, crx:0.07, cry:0.02, nrx:0.10, nry:-0.26, nrz:0.06,
    flx:0.20,flz:0.22,flYaw:0.35, frx:-0.17,frz:-0.14,frYaw:-0.85,
    wx:-0.10, wy:1.46, wz:0.17, wrx:0.03, wry:-0.10, camY:1.22, breath:1, sway:1.0 }),
  tact:  pose({ py:0.86, prx:0.10, pry:0.34, crx:0.18, cry:0.05, nrx:0.16, nry:-0.30, nrz:0.05,
    flx:0.26,flz:0.15,flYaw:0.45, frx:-0.26,frz:-0.05,frYaw:-0.90,
    wx:-0.09, wy:1.40, wz:0.15, wrx:0.07, wry:-0.12,
    aPLx:0.95,aPLy:-0.35,aPLz:0.10, aPRx:-0.3,aPRy:-1.0,aPRz:-0.25, camY:1.12, breath:1, sway:1.5 }),
  kneel: pose({ py:0.45, pry:0.30, prx:0.04, crx:0.10, cry:0.03, nrx:0.06, nry:-0.24, nrz:0.04,
    flx:0.26,flz:0.26,flYaw:0.50, frx:-0.20,fry:0.14,frz:-0.27,frYaw:2.75,frPit:1.15,
    wx:-0.10, wy:1.05, wz:0.23, wrx:0.04, wry:-0.08,
    lPLy:0.5, lPRy:-0.8,lPRz:0.6, camY:0.78, breath:1, sway:1.0 }),
  prone: pose({ py:0.18, pz:-0.02, prx:1.32, pry:0.05, crx:-0.12, cry:0.04, nrx:-0.58, nry:-0.12, nrz:0.05,
    flx:0.15,fly:0.09,flz:-0.78,flYaw:3.0,flPit:0.25, frx:-0.15,fry:0.10,frz:-0.76,frYaw:3.25,frPit:0.35,
    wx:-0.09, wy:0.15, wz:0.48, wrx:-0.05, wry:-0.04,
    aPLx:0.95,aPLy:-0.55,aPLz:-0.25, aPRx:-0.95,aPRy:-0.45,aPRz:-0.2,
    lPLx:0.5,lPLy:-0.35,lPLz:0.35, lPRx:-0.5,lPRy:-0.35,lPRz:0.35,
    camY:0.42, breath:0.25, sway:0.8 })
};
const POSE_LABEL = { ease:'AT EASE', aim:'AIM', tact:'TACTICAL AIM', kneel:'KNEELING AIM', prone:'PRONE' };

/* ============================== THREE SETUP ============================== */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f0a);
scene.fog = new THREE.Fog(0x0d0f0a, 7.5, 16);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 60);
camera.position.set(3.6, 2.2, 5.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1.1; controls.maxDistance = 7;
controls.maxPolarAngle = 1.54;
controls.target.set(0, 0.95, 0);
controls.autoRotate = true; controls.autoRotateSpeed = 0.9;
let orbitHold = 0, introT = 0;
controls.addEventListener('start', () => { orbitHold = 4; document.getElementById('hint').style.opacity = 0; });

const hemi = new THREE.HemisphereLight(0x9aa08a, 0x1a1c12, 0.5); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffeed8, 2.4);
key.position.set(2.3, 3.8, 1.8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -1.8; key.shadow.camera.right = 1.8;
key.shadow.camera.top = 2.2; key.shadow.camera.bottom = -0.6;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 10;
key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb4c8, 1.15);
rim.position.set(-2.4, 2.6, -2.4); scene.add(rim);

/* floor + turntable markings */
function floorTexture(){
  const s = 1024, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d');
  g.fillStyle = '#191c11'; g.fillRect(0,0,s,s);
  g.strokeStyle = 'rgba(211,165,76,0.16)'; g.fillStyle = 'rgba(211,165,76,0.28)';
  const cx = s/2;
  for(let r = 90; r < 500; r += 82){ g.beginPath(); g.arc(cx,cx,r,0,7); g.lineWidth = 2; g.stroke(); }
  for(let i = 0; i < 72; i++){
    const a = i/72*Math.PI*2, major = i%6===0;
    g.save(); g.translate(cx,cx); g.rotate(a);
    g.fillRect(-2, -498, 4, major? 34: 18);
    g.restore();
  }
  g.font = '600 30px "Saira Condensed", monospace'; g.textAlign = 'center';
  g.fillStyle = 'rgba(217,214,195,0.4)';
  g.fillText('PMC DOSSIER — TURNTABLE 0x1', cx, cx - 150);
  g.font = '500 22px "IBM Plex Mono", monospace';
  g.fillText('AZ REF / GRID K22', cx, cx + 190);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;

/* ============================== TEXTURE GENERATORS ============================== */
const hx = n => '#' + n.toString(16).padStart(6,'0');

function drawCamo(g, style, cols, s){
  g.clearRect(0,0,s,s);
  g.fillStyle = hx(cols[0]); g.fillRect(0,0,s,s);
  if(style === 'multi'){
    for(let i = 0; i < 130; i++){
      g.fillStyle = hx(cols[1 + (Math.random()*3|0)]);
      g.globalAlpha = 0.55 + Math.random()*0.4;
      const cx = Math.random()*s, cy = Math.random()*s, R = 18 + Math.random()*46;
      g.beginPath();
      const lobes = 3 + (Math.random()*4|0);
      for(let j = 0; j < lobes; j++){
        const a = Math.random()*6.28, rr = R*(0.4 + Math.random()*0.6);
        const x = cx + Math.cos(a)*R*0.45, y = cy + Math.sin(a)*R*0.45;
        g.moveTo(x+rr, y); g.arc(x, y, rr, 0, 6.28);
      }
      g.fill();
    }
    g.globalAlpha = 0.35; g.fillStyle = hx(cols[4]);
    for(let i = 0; i < 70; i++){
      const x = Math.random()*s, y = Math.random()*s, a = Math.random()*6.28, l = 8 + Math.random()*22;
      g.save(); g.translate(x,y); g.rotate(a); g.fillRect(-l/2,-1.2,l,2.4); g.restore();
    }
  } else {
    const c = 16;
    for(let y = 0; y < s; y += c) for(let x = 0; x < s; x += c){
      const r = Math.random(); let col = cols[0];
      if(r < 0.18) col = cols[1]; else if(r < 0.36) col = cols[2];
      else if(r < 0.46) col = cols[3]; else if(r < 0.5) col = cols[4];
      g.fillStyle = hx(col); g.fillRect(x, y, c, c);
    }
    g.globalAlpha = 0.18; g.fillStyle = hx(cols[3]);
    for(let i = 0; i < 40; i++) g.fillRect(Math.random()*s, (Math.random()*s|0), 40 + Math.random()*120, c);
  }
  g.globalAlpha = 0.05;
  for(let i = 0; i < 2600; i++){
    g.fillStyle = Math.random() < 0.5 ? '#000' : '#fff';
    g.fillRect(Math.random()*s, Math.random()*s, 2, 2);
  }
  g.globalAlpha = 1;
}
function camoTex(style, cols, rep){
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  drawCamo(cv.getContext('2d'), style, cols, 512);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function tapeTex(txt, bg, fg){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = bg; g.fillRect(0,0,256,64);
  g.strokeStyle = 'rgba(0,0,0,0.4)'; g.strokeRect(3,3,250,58);
  g.fillStyle = fg; g.font = '700 30px "Saira Condensed", monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(txt, 128, 34);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const tz = g => { g.rotateX(Math.PI/2); return g; };
const grp = (x=0,y=0,z=0) => { const g = new THREE.Group(); g.position.set(x,y,z); return g; };
function mesh(geo, m, x=0,y=0,z=0, rx=0,ry=0,rz=0, sx=1,sy=1,sz=1){
  const o = new THREE.Mesh(geo, m);
  o.position.set(x,y,z); o.rotation.set(rx,ry,rz); o.scale.set(sx,sy,sz);
  o.castShadow = o.receiveShadow = true;
  return o;

function railRibs(parent, m, y, z0, z1, n, w=0.034){
  for(let i = 0; i < n; i++)
    parent.add(mesh(B(w,0.005,0.008), m, 0, y, z0 + i*(z1-z0)/(n-1)));
}
function curvedMag(m, segs, len, w, th, ang, x, y0, z0, tilt){
  const root = grp(x, y0, z0); root.rotation.x = tilt;
  let node = root;
  for(let i = 0; i < segs; i++){
    const seg = grp(); seg.rotation.x = -ang;
    seg.add(mesh(B(w, len, th), m, 0, -len/2, 0));
    const nx = grp(); nx.position.y = -len;
    seg.add(nx); node.add(seg); node = nx;
  }
  return root;
}
function addSling(parent, m, pts){
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)));
  parent.add(mesh(new THREE.TubeGeometry(curve, 24, 0.005, 8), m));
}

/* ============================== IK SOLVER (2-bone) ============================== */
const _p0=new THREE.Vector3(), _dir=new THREE.Vector3(), _pole=new THREE.Vector3(),
      _n=new THREE.Vector3(), _U=new THREE.Vector3(), _M=new THREE.Vector3(),
      _dB=new THREE.Vector3(), _k=new THREE.Vector3(), _e2=new THREE.Vector3(),
      _e3=new THREE.Vector3(), _cr=new THREE.Vector3(),
      _m4=new THREE.Matrix4(), _qw=new THREE.Quaternion(), _qp=new THREE.Quaternion();
const _X = new THREE.Vector3(1,0,0);
function solveLimb(root, mid, target, pole, L1, L2){
  root.getWorldPosition(_p0);
  _dir.subVectors(target, _p0);
  let d = _dir.length();
  const dmin = Math.abs(L1-L2)+0.02, dmax = L1+L2-0.004;
  const dc = THREE.MathUtils.clamp(d, dmin, dmax);
  if(d > 1e-6) _dir.multiplyScalar(1/d); else _dir.set(0,-1,0);
  d = dc;
  _pole.copy(pole).addScaledVector(_dir, -pole.dot(_dir));
  if(_pole.lengthSq() < 1e-6) _pole.set(0,0,1);
  _n.copy(_pole).normalize();
  const a1 = Math.acos(THREE.MathUtils.clamp((L1*L1 + d*d - L2*L2)/(2*L1*d), -1, 1));
  _U.copy(_dir).multiplyScalar(Math.cos(a1)).addScaledVector(_n, Math.sin(a1));
  _M.copy(_p0).addScaledVector(_U, L1);
  _dB.subVectors(target, _M);
  if(_dB.lengthSq() < 1e-8) _dB.copy(_dir); else _dB.normalize();
  _k.crossVectors(_U, _dB);
  if(_k.lengthSq() < 1e-8) _k.set(1,0,0); else _k.normalize();
  _e2.copy(_U).negate();
  _e3.crossVectors(_k, _e2);
  _m4.makeBasis(_k, _e2, _e3);
  _qw.setFromRotationMatrix(_m4);
  root.parent.getWorldQuaternion(_qp).invert();
  root.quaternion.copy(_qp).multiply(_qw);
  const beta = Math.atan2(_cr.crossVectors(_U,_dB).dot(_k), THREE.MathUtils.clamp(_U.dot(_dB),-1,1));
  mid.quaternion.setFromAxisAngle(_X, beta);
}

function applyFrame(t){
  const br = st.idle ? Math.sin(t*1.7)*0.012*cur.breath : 0;
  const br2 = st.idle ? Math.cos(t*1.13)*0.006*cur.breath : 0;
  const bob = st.idle ? Math.sin(t*1.7)*0.004*cur.breath : 0;
  const swy = st.idle ? cur.sway : 0;
  j.pelvis.position.set(cur.px, cur.py + bob, cur.pz);
  j.pelvis.rotation.set(cur.prx, cur.pry, cur.prz);
  j.chest.rotation.set(cur.crx + br, cur.cry + br2, cur.crz);
  j.neck.rotation.set(cur.nrx + br*0.5, cur.nry, cur.nrz);
  soldier.updateMatrixWorld(true);
  // legs
  _tv.set(cur.flx, cur.fly, cur.flz); _pv.set(cur.lPLx, cur.lPLy, cur.lPLz);
  solveLimb(j.hipL, j.kneeL, _tv, _pv, 0.43, 0.41);
  _tv.set(cur.frx, cur.fry, cur.frz); _pv.set(cur.lPRx, cur.lPRy, cur.lPRz);
  solveLimb(j.hipR, j.kneeR, _tv, _pv, 0.43, 0.41);
  soldier.updateMatrixWorld(true);
  setFootOrient(j.footL, cur.flYaw, cur.flPit);
  setFootOrient(j.footR, cur.frYaw, cur.frPit);
  // weapon (with aiming micro-sway)
  weapon.position.set(cur.wx, cur.wy, cur.wz);
  weapon.rotation.set(
    cur.wrx + Math.sin(t*1.31)*0.006*swy,
    cur.wry + Math.sin(t*0.97)*0.005*swy,
    cur.wrz + Math.cos(t*1.11)*0.004*swy);
  soldier.updateMatrixWorld(true);
  // arm targets from weapon grips
  weapon.getWorldQuaternion(_qW);
  gRo.getWorldPosition(tR);
  _qH.copy(_qW).multiply(qGRIP_R);
  tR.add(_off.set(0,0.032,0).applyQuaternion(_qH));
  if(tgt.handL === 'gun'){
    gLo.getWorldPosition(tL);
    _qH.copy(_qW).multiply(wLeftMode === 'vert' ? qGRIP_L : qGRIP_U);
    tL.add(_off.set(0,0.032,0).applyQuaternion(_qH));
  } else {
    tL.set(cur.hLx, cur.hLy, cur.hLz);
    _qH.copy(qFree);
  }
  _pv.set(cur.aPLx, cur.aPLy, cur.aPLz);
  solveLimb(j.shL, j.elL, tL, _pv, 0.295, 0.265);
  _pv.set(cur.aPRx, cur.aPRy, cur.aPRz);
  solveLimb(j.shR, j.elR, tR, _pv, 0.295, 0.265);
  soldier.updateMatrixWorld(true);
  // hand orientation
  setHandOrient(j.handR, j.wrR, _qH.copy(_qW).multiply(qGRIP_R));
  if(tgt.handL === 'gun')
    setHandOrient(j.handL, j.wrL, _qH.copy(_qW).multiply(wLeftMode === 'vert' ? qGRIP_L : qGRIP_U));
  else setHandOrient(j.handL, j.wrL, qFree);
}

/* ============================== MAIN LOOP ============================== */
const clock = new THREE.Clock();
let fpsN = 0, fpsT = 0, hudT = 0;
const restCam = new THREE.Vector3(2.35, 1.55, 3.35);
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  // pose damping
  const f = 1 - Math.exp(-dt*6);
  for(const k in tgt){ if(typeof tgt[k] === 'number') cur[k] += (tgt[k]-cur[k])*f; }
  // intro camera ease
  if(introT < 1){
    introT += dt*0.7;
    camera.position.lerp(restCam, 1 - Math.exp(-dt*2.4));
  }
  if(orbitHold > 0){ orbitHold -= dt; controls.autoRotate = false; }
  else controls.autoRotate = st.orbit;
  // camera framing follows pose
  controls.target.y += (cur.camY - controls.target.y) * (1 - Math.exp(-dt*2.5));
  applyFrame(t);
  controls.update();
  renderer.render(scene, camera);
  // HUD
  fpsN++; fpsT += dt; hudT += dt;
  if(hudT > 0.4){
    hudT = 0;
    document.getElementById('hud-tri').textContent = renderer.info.render.triangles.toLocaleString('en-US');
    document.getElementById('hud-call').textContent = renderer.info.render.calls;
    document.getElementById('hud-fps').textContent = Math.round(fpsN/fpsT);
    fpsN = 0; fpsT = 0;
  }
}

/* ============================== UI ============================== */
function updateHUDText(){
  const camoTag = CAMO[st.faction].tag[st.env];
  const wName = typeof WEAPONS[st.cls].w === 'string' ? WEAPONS[st.cls].w : WEAPONS[st.cls].w[st.faction];
  document.getElementById('d-big').innerHTML =
    (st.faction === 'west' ? 'WEST' : 'EAST') + ' <b>//</b> ' + camoTag;
  document.getElementById('d-sm').textContent = wName + ' · ' + POSE_LABEL[st.pose];
  document.getElementById('unit').textContent = st.faction === 'west' ? 'KORD-6 "CONDOR"' : 'SEKTOR-9 "VULKAN"';
  const sp = SPECS[st.cls + '_' + st.faction[0]] || SPECS[st.cls];
  document.getElementById('s-name').textContent = wName;
  document.getElementById('s-cal').textContent = sp.cal;
  document.getElementById('s-rate').textContent = sp.rate;
  document.getElementById('s-mass').textContent = sp.mass;
  document.getElementById('s-len').textContent = sp.len;
  document.getElementById('s-act').textContent = sp.act;
  document.getElementById('tag-smg').textContent = 'MP5A5';
  document.getElementById('tag-assault').textContent = st.faction === 'west' ? 'M4A1' : 'AK-74M';
  document.getElementById('tag-marksman').textContent = st.faction === 'west' ? 'HK417' : 'SVD-S';
}
function refreshSwatches(){
  const style = st.faction === 'west' ? 'multi' : 'digital';
  document.querySelectorAll('.camo').forEach(b => {
    const env = b.dataset.env;
    drawCamo(b.querySelector('canvas').getContext('2d'), style, CAMO[st.faction][env], 76);
  });
}
function select(sel){ document.querySelectorAll(sel).forEach(b => b.classList.remove('on')); }
document.getElementById('f-west').onclick = e => {
  st.faction = 'west'; select('#rail .btn:not(.load)'); e.currentTarget.classList.add('on'); rebuild(); refreshSwatches();
};
document.getElementById('f-east').onclick = e => {
  st.faction = 'east'; select('#rail .btn:not(.load)'); e.currentTarget.classList.add('on'); rebuild(); refreshSwatches();
};
document.querySelectorAll('.camo').forEach(b => b.onclick = () => {
  st.env = b.dataset.env; select('.camo'); b.classList.add('on'); rebuild();
});
document.querySelectorAll('.load').forEach(b => b.onclick = () => {
  st.cls = b.dataset.cls; select('.load'); b.classList.add('on'); rebuild();
});
document.querySelectorAll('#posebar button').forEach(b => b.onclick = () => {
  st.pose = b.dataset.pose; tgt = POSES[st.pose]; select('#posebar button'); b.classList.add('on');
  updateHUDText();
});
function wireToggle(id, key, fn){
  const el = document.getElementById(id);
  el.onclick = () => { st[key] = !st[key]; el.classList.toggle('on', st[key]); if(fn) fn(); };
}
wireToggle('t-orbit', 'orbit');
wireToggle('t-idle', 'idle');
wireToggle('t-wire', 'wire', () => matsAll.forEach(m => m.wireframe = st.wire));
document.getElementById('burger').onclick = () => document.getElementById('rail').classList.toggle('open');
window.addEventListener('pointerdown', () => document.getElementById('rail').classList.remove('open'), { once:false });

/* ============================== BOOT ============================== */
refreshSwatches();
resize();
rebuild();
loop();
</script>
